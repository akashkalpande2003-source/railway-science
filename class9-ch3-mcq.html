let cur=0,sel=null,submitted=false,ans=Array(questions.length).fill(null),res=Array(questions.length).fill(null);
const quiz=document.getElementById('quiz'),progress=document.getElementById('progress'),palette=document.getElementById('palette'),grid=document.getElementById('grid');
function paletteRender(){grid.innerHTML='';questions.forEach((q,i)=>{let b=document.createElement('button');b.className='pq'+(i===cur?' current ':'')+(res[i]===true?' done ':'')+(res[i]===false?' wrong ':'');b.textContent=i+1;b.onclick=()=>{cur=i;sel=ans[i];submitted=res[i]!==null;render();palette.classList.remove('show')};grid.appendChild(b)})}
function render(){let q=questions[cur];sel=ans[cur];submitted=res[cur]!==null;progress.textContent=`प्रश्न ${cur+1} / ${questions.length}`;let o=q.options.map((x,i)=>`<button class="opt ${sel===i?'selected':''} ${submitted&&i===q.answer?'correct':''} ${submitted&&sel===i&&i!==q.answer?'wrong':''}" onclick="choose(${i})" ${submitted?'disabled':''}><b>${String.fromCharCode(65+i)}.</b> ${x}</button>`).join('');let f=submitted?`<div class="feedback ${res[cur]?'good':'bad'}"><b>${res[cur]?'✅ सही उत्तर':'❌ गलत उत्तर'}</b><br><b>सही उत्तर: ${String.fromCharCode(65+q.answer)}. ${q.options[q.answer]}</b><br>${q.explanation}</div>`:'';quiz.innerHTML=`<div class="qnum">Question ${cur+1}</div><div class="question">${q.q}</div>${o}${f}<div class="actions"><button class="btn" onclick="prev()" ${cur===0?'disabled':''}>⬅ Previous</button>${!submitted?'<button class="btn" onclick="submit()">✓ Submit Answer</button>':''}<button class="btn" onclick="next()" ${cur===questions.length-1?'disabled':''}>Next ➡</button></div>`;paletteRender()}
function choose(i){if(!submitted){sel=i;ans[cur]=i;render()}}
function submit(){if(sel===null){alert('पहले कोई विकल्प चुनें।');return}res[cur]=sel===questions[cur].answer;submitted=true;render()}
function prev(){if(cur>0){cur--;render()}}
function next(){if(cur<questions.length-1){cur++;render()}else result()}
function result(){let correct=res.filter(x=>x===true).length,wrong=res.filter(x=>x===false).length,skip=questions.length-ans.filter(x=>x!==null).length;quiz.innerHTML=`<h2 style="text-align:center">🎯 Test Completed</h2><div class="score">${correct} / ${questions.length}</div><div class="stats"><div class="stat">✅ सही<br>${correct}</div><div class="stat">❌ गलत<br>${wrong}</div><div class="stat">⏭️ छोड़े<br>${skip}</div></div><p style="text-align:center"><button class="btn" onclick="restart()">🔄 Restart Test</button></p><h3>गलत/छोड़े गए प्रश्नों का समाधान</h3>${questions.map((q,i)=>res[i]!==true?`<div class="review-item"><b>Q${i+1}. ${q.q}</b><br>सही उत्तर: <b>${String.fromCharCode(65+q.answer)}. ${q.options[q.answer]}</b><br>${q.explanation}</div>`:'').join('')}`;palette.classList.remove('show');progress.textContent='Test Completed'}
function restart(){cur=0;sel=null;submitted=false;ans=Array(questions.length).fill(null);res=Array(questions.length).fill(null);render()}
document.getElementById('paletteBtn').onclick=()=>palette.classList.toggle('show');render();

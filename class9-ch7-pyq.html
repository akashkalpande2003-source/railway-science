<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Railway Science | Class 9 Chapter 7 | Group D 2026 Mock Test</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --navy:#082b5c;
    --blue:#0d6efd;
    --light-blue:#eaf3ff;
    --green:#16a34a;
    --light-green:#dcfce7;
    --red:#dc2626;
    --light-red:#fee2e2;
    --orange:#f59e0b;
    --light-orange:#fff4d6;
    --gray:#64748b;
    --light-gray:#f3f6fa;
    --border:#dbe3ef;
    --white:#ffffff;
    --dark:#172033;
}

body{
    font-family:"Noto Sans Devanagari","Mangal",Arial,sans-serif;
    background:var(--light-gray);
    color:var(--dark);
    line-height:1.65;
}

/* ================= HEADER ================= */

.header{
    position:sticky;
    top:0;
    z-index:100;
    background:linear-gradient(135deg,#082b5c,#0d6efd);
    color:white;
    padding:15px 12px;
    box-shadow:0 3px 15px rgba(0,0,0,.18);
}

.header-inner{
    max-width:900px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.logo{
    font-size:20px;
    font-weight:900;
}

.subtitle{
    font-size:12px;
    opacity:.9;
}

.counter{
    font-size:13px;
    font-weight:bold;
    white-space:nowrap;
}

.progress{
    max-width:900px;
    height:7px;
    margin:10px auto 0;
    background:rgba(255,255,255,.25);
    border-radius:10px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    width:0%;
    background:white;
    transition:.3s;
}

/* ================= PALETTE ================= */

.palette-btn{
    position:fixed;
    right:12px;
    top:105px;
    z-index:200;
    background:var(--navy);
    color:white;
    border:none;
    border-radius:10px;
    padding:10px 13px;
    font-weight:800;
    cursor:pointer;
    box-shadow:0 4px 15px rgba(0,0,0,.25);
}

.palette{
    position:fixed;
    right:12px;
    top:150px;
    width:310px;
    max-height:72vh;
    overflow-y:auto;
    background:white;
    border:1px solid var(--border);
    border-radius:15px;
    padding:13px;
    z-index:190;
    box-shadow:0 10px 35px rgba(0,0,0,.22);
    display:none;
}

.palette.show{
    display:block;
}

.palette-title{
    font-size:16px;
    font-weight:900;
    color:var(--navy);
    margin-bottom:10px;
}

.palette-grid{
    display:grid;
    grid-template-columns:repeat(8,1fr);
    gap:5px;
}

.palette-question{
    height:30px;
    border:1px solid #d8dee9;
    background:#f8fafc;
    border-radius:6px;
    cursor:pointer;
    font-size:11px;
    font-weight:bold;
}

.palette-question.current{
    outline:2px solid var(--blue);
}

.palette-question.correct{
    background:var(--light-green);
    border-color:#86efac;
    color:#166534;
}

.palette-question.wrong{
    background:var(--light-red);
    border-color:#fca5a5;
    color:#991b1b;
}

.palette-question.unattempted{
    background:#f1f5f9;
    color:#475569;
}

.legend{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
    margin-top:12px;
    font-size:11px;
}

.legend span{
    padding:4px 7px;
    border-radius:10px;
}

/* ================= MAIN ================= */

.container{
    max-width:850px;
    margin:20px auto;
    padding:0 14px 100px;
}

.section-title{
    color:var(--navy);
    font-size:16px;
    font-weight:900;
    margin:18px 0 10px;
}

.question-card{
    background:white;
    border:1px solid var(--border);
    border-radius:16px;
    padding:20px;
    box-shadow:0 4px 20px rgba(8,43,92,.07);
}

/* ================= BADGES ================= */

.badges{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-bottom:13px;
}

.badge{
    display:inline-block;
    padding:4px 9px;
    border-radius:20px;
    background:var(--light-blue);
    color:var(--navy);
    font-size:12px;
    font-weight:800;
}

.badge.numerical{
    background:var(--light-orange);
    color:#9a5b00;
}

/* ================= FORMULA BOX ================= */

.info-box{
    background:#f7f9fc;
    border-left:4px solid var(--blue);
    border-radius:8px;
    padding:10px 12px;
    margin-bottom:16px;
    font-size:13px;
}

.info-box strong{
    color:var(--navy);
}

/* ================= QUESTION ================= */

.question{
    font-size:18px;
    font-weight:900;
    margin:10px 0 18px;
}

/* ================= OPTIONS ================= */

.option{
    display:block;
    width:100%;
    text-align:left;
    background:white;
    border:1.5px solid #d7dfeb;
    border-radius:10px;
    padding:12px 14px;
    margin:9px 0;
    font-size:15px;
    color:var(--dark);
    cursor:pointer;
    transition:.15s;
}

.option:hover{
    border-color:var(--blue);
    background:#f7fbff;
}

.option.correct{
    background:var(--light-green);
    border-color:var(--green);
    color:#166534;
    font-weight:800;
}

.option.wrong{
    background:var(--light-red);
    border-color:var(--red);
    color:#991b1b;
    font-weight:800;
}

.option:disabled{
    cursor:default;
}

/* ================= EXPLANATION ================= */

.explanation{
    display:none;
    margin-top:15px;
    padding:12px;
    background:#f0fdf4;
    border-left:4px solid var(--green);
    border-radius:8px;
    font-size:14px;
}

.explanation.show{
    display:block;
}

/* ================= NAVIGATION ================= */

.navigation{
    display:flex;
    gap:10px;
    margin-top:18px;
}

.nav-btn{
    flex:1;
    border:none;
    border-radius:10px;
    padding:12px;
    font-size:15px;
    font-weight:900;
    cursor:pointer;
}

.previous{
    background:#e2e8f0;
    color:#1e293b;
}

.next{
    background:var(--navy);
    color:white;
}

.nav-btn:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.instructions{
    margin-top:10px;
    color:var(--gray);
    font-size:12px;
}

/* ================= RESULT ================= */

.result{
    display:none;
    background:white;
    border:1px solid var(--border);
    border-radius:16px;
    padding:25px 18px;
    text-align:center;
    box-shadow:0 4px 20px rgba(8,43,92,.07);
}

.result-title{
    font-size:22px;
    font-weight:900;
    color:var(--navy);
}

.score{
    font-size:42px;
    font-weight:900;
    color:var(--navy);
    margin:12px 0;
}

.result-stats{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
    margin:18px 0;
}

.result-stat{
    padding:10px 14px;
    background:#f8fafc;
    border-radius:10px;
    font-weight:800;
}

.restart{
    width:100%;
    border:none;
    border-radius:10px;
    padding:13px;
    background:var(--navy);
    color:white;
    font-size:15px;
    font-weight:900;
    cursor:pointer;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

    .header{
        padding:12px;
    }

    .logo{
        font-size:17px;
    }

    .subtitle{
        font-size:10px;
    }

    .counter{
        font-size:11px;
    }

    .container{
        padding:0 8px 80px;
    }

    .question-card{
        padding:14px;
        border-radius:12px;
    }

    .question{
        font-size:16px;
    }

    .option{
        font-size:14px;
        padding:11px;
    }

    .palette{
        width:285px;
        right:7px;
    }

    .palette-btn{
        right:7px;
    }
}
</style>
</head>

/* =========================================================
   QUIZ VARIABLES
========================================================= */

let currentQuestion = 0;

/*
null  = Unattempted
true  = Correct
false = Wrong
*/

let status = new Array(questions.length).fill(null);


/* =========================================================
   ELEMENTS
========================================================= */

const quizBox =
    document.getElementById("quiz");

const resultBox =
    document.getElementById("result");

const counter =
    document.getElementById("counter");

const progressBar =
    document.getElementById("progressBar");

const paletteGrid =
    document.getElementById("paletteGrid");


/* =========================================================
   PALETTE
========================================================= */

function renderPalette(){

    paletteGrid.innerHTML = "";

    questions.forEach((question,index)=>{

        const button =
            document.createElement("button");

        button.textContent =
            index + 1;

        let className =
            "palette-question ";

        if(status[index] === null){
            className += "unattempted";
        }

        else if(status[index] === true){
            className += "correct";
        }

        else{
            className += "wrong";
        }

        if(index === currentQuestion){
            className += " current";
        }

        button.className =
            className;

        button.onclick = function(){

            currentQuestion = index;

            resultBox.style.display =
                "none";

            quizBox.style.display =
                "block";

            renderQuestion();
        };

        paletteGrid.appendChild(button);

    });

}


/* =========================================================
   TOGGLE PALETTE
========================================================= */

function togglePalette(){

    document
        .getElementById("palette")
        .classList
        .toggle("show");

}


/* =========================================================
   RENDER QUESTION
========================================================= */

function renderQuestion(){

    const q =
        questions[currentQuestion];

    const attempted =
        status[currentQuestion] !== null;


    counter.textContent =
        "Q " +
        (currentQuestion + 1) +
        " / " +
        questions.length;


    progressBar.style.width =
        ((currentQuestion + 1) /
        questions.length * 100) + "%";


    const sectionTitle =
        currentQuestion < 70
        ? "भाग 1 • Theory Questions"
        : "भाग 2 • Numerical Questions";


    const optionHTML =
        q.options.map((option,index)=>{

            return `
                <button
                    class="option"
                    onclick="selectAnswer(${index})">
                    ${String.fromCharCode(65+index)}. ${option}
                </button>
            `;

        }).join("");


    quizBox.innerHTML = `

        <div class="section-title">
            ${sectionTitle}
        </div>

        <div class="question-card">

            <div class="badges">

                <span class="badge">
                    प्रश्न ${q.n}
                </span>

                <span class="badge ${q.type === "numerical" ? "numerical" : ""}">
                    ${q.type === "numerical"
                        ? "Numerical"
                        : "Theory"}
                </span>

                <span class="badge">
                    ${q.topic}
                </span>

            </div>


            <div class="info-box">

                <strong>Topic:</strong>
                ${q.topic}

                &nbsp; | &nbsp;

                <strong>
                    ${q.type === "numerical"
                        ? "Formula"
                        : "Concept"}
                    :
                </strong>

                ${q.formula}

            </div>


            <div class="question">
                ${q.q}
            </div>


            <div id="options">
                ${optionHTML}
            </div>


            <div
                class="explanation"
                id="explanation">

                <strong>
                    Explanation:
                </strong>

                ${q.explanation}

            </div>


            <div class="navigation">

                <button
                    class="nav-btn previous"
                    onclick="previousQuestion()"
                    ${currentQuestion === 0 ? "disabled" : ""}>

                    ← Previous

                </button>


                <button
                    class="nav-btn next"
                    onclick="nextQuestion()">

                    ${
                        currentQuestion === questions.length - 1
                        ? "Result"
                        : "Next →"
                    }

                </button>

            </div>


            <div class="instructions">

                No Timer • No Negative Marking •
                Option चुनते ही सही/गलत और Explanation दिखाई देगा।

            </div>

        </div>
    `;


    if(attempted){

        showAnswer(
            status[currentQuestion]
            ? q.answer
            : -1,
            true
        );

    }


    renderPalette();

}


/* =========================================================
   SELECT ANSWER
========================================================= */

function selectAnswer(selectedIndex){

    if(status[currentQuestion] !== null){
        return;
    }


    const q =
        questions[currentQuestion];


    status[currentQuestion] =
        selectedIndex === q.answer;


    showAnswer(
        selectedIndex,
        false
    );


    renderPalette();

}


/* =========================================================
   SHOW ANSWER
========================================================= */

function showAnswer(
    selectedIndex,
    alreadyAnswered = false
){

    const q =
        questions[currentQuestion];


    const options =
        document.querySelectorAll(".option");


    options.forEach((button,index)=>{

        button.disabled =
            true;


        /*
         * हमेशा सही option GREEN
         */

        if(index === q.answer){

            button.classList.add(
                "correct"
            );

        }


        /*
         * यदि user ने गलत option चुना
         */

        if(
            !alreadyAnswered &&
            index === selectedIndex &&
            index !== q.answer
        ){

            button.classList.add(
                "wrong"
            );

        }

    });


    document
        .getElementById("explanation")
        .classList
        .add("show");

}


/* =========================================================
   NEXT
========================================================= */

function nextQuestion(){

    if(
        currentQuestion <
        questions.length - 1
    ){

        currentQuestion++;

        renderQuestion();

    }

    else{

        showResult();

    }

}


/* =========================================================
   PREVIOUS
========================================================= */

function previousQuestion(){

    if(currentQuestion > 0){

        currentQuestion--;

        renderQuestion();

    }

}


/* =========================================================
   RESULT
========================================================= */

function showResult(){

    quizBox.style.display =
        "none";


    resultBox.style.display =
        "block";


    const correct =
        status.filter(
            x => x === true
        ).length;


    const wrong =
        status.filter(
            x => x === false
        ).length;


    const skipped =
        status.filter(
            x => x === null
        ).length;


    resultBox.innerHTML = `

        <div class="result-title">
            🎯 Test Completed
        </div>


        <div class="score">

            ${correct} / ${questions.length}

        </div>


        <div class="result-stats">

            <div
                class="result-stat"
                style="color:#15803d">

                Correct:
                ${correct}

            </div>


            <div
                class="result-stat"
                style="color:#b91c1c">

                Wrong:
                ${wrong}

            </div>


            <div class="result-stat">

                Skipped:
                ${skipped}

            </div>

        </div>


        <p>

            <b>
                No Negative Marking
            </b>

            <br>

            गलत उत्तर के लिए कोई अंक
            नहीं काटा गया है।

        </p>


        <br>


        <button
            class="restart"
            onclick="restartTest()">

            ↻ Restart Test

        </button>

    `;


    renderPalette();

}


/* =========================================================
   RESTART
========================================================= */

function restartTest(){

    currentQuestion = 0;

    status =
        new Array(
            questions.length
        ).fill(null);


    quizBox.style.display =
        "block";


    resultBox.style.display =
        "none";


    renderQuestion();

}


/* =========================================================
   START
========================================================= */

renderQuestion();

</script>

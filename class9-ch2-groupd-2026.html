<title>Class 9 Science Chapter 2 - Group D 2026 Practice Test</title>

<style>

/* =========================
   BASIC
   ========================= */

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f4f6f9;
  color:#222;
}


/* =========================
   HEADER
   ========================= */

header{
  background:#17365d;
  color:white;
  text-align:center;
  padding:18px 10px;
}

header h1{
  margin:0;
  font-size:25px;
}

header p{
  margin:6px 0 0;
  font-size:15px;
}


/* =========================
   EXAM INFO
   ========================= */

.exam-info{
  position:sticky;
  top:0;
  z-index:1000;
  background:white;
  border-bottom:1px solid #ddd;
  padding:10px;
  display:flex;
  justify-content:space-around;
  align-items:center;
  flex-wrap:wrap;
  gap:8px;
  box-shadow:0 2px 5px rgba(0,0,0,.08);
}

.info-box{
  font-weight:bold;
  font-size:14px;
}

.timer{
  background:#17365d;
  color:white;
  padding:7px 14px;
  border-radius:6px;
  min-width:90px;
  text-align:center;
}


/* =========================
   MAIN
   ========================= */

.examContainer{
  max-width:900px;
  margin:25px auto;
  padding:0 15px;
}


/* =========================
   QUESTION BOX
   ========================= */

.question-box{
  background:white;
  border-radius:10px;
  padding:22px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.question-number{
  color:#17365d;
  font-size:18px;
  font-weight:bold;
  margin-bottom:12px;
}

.question-text{
  font-size:18px;
  line-height:1.6;
  font-weight:600;
  margin-bottom:20px;
}


/* =========================
   OPTIONS
   ========================= */

.option{
  border:1px solid #ddd;
  border-radius:7px;
  padding:12px;
  margin:10px 0;
  cursor:pointer;
  transition:.2s;
  background:#fff;
}

.option:hover{
  background:#f1f5fa;
}

.option.selected{
  background:#dcecff;
  border-color:#17365d;
}

.option input{
  margin-right:10px;
}


/* =========================
   NAVIGATION
   ========================= */

.navigation{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-top:22px;
  flex-wrap:wrap;
}

.nav-btn{
  padding:10px 18px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-weight:bold;
  font-size:14px;
}

.prev-btn{
  background:#6c757d;
  color:white;
}

.next-btn{
  background:#17365d;
  color:white;
}

.clear-btn{
  background:#ffc107;
  color:#222;
}

.review-btn{
  background:#fd7e14;
  color:white;
}


/* =========================
   PALETTE BUTTON
   ========================= */

.palette-toggle{
  position:fixed;
  right:15px;
  bottom:20px;
  width:50px;
  height:50px;
  border:none;
  border-radius:50%;
  background:#17365d;
  color:white;
  font-size:25px;
  font-weight:bold;
  cursor:pointer;
  z-index:1001;
  box-shadow:0 3px 10px rgba(0,0,0,.25);
}

.palette-toggle:hover{
  background:#0d2b4d;
}


/* =========================
   QUESTION PALETTE
   ========================= */

.palette{
  position:fixed;
  top:0;
  right:-330px;
  width:310px;
  height:100vh;
  background:white;
  z-index:1002;
  box-shadow:-4px 0 15px rgba(0,0,0,.2);
  transition:right .3s ease;
  padding:20px;
  overflow-y:auto;
}

.palette.open{
  right:0;
}

.palette-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.palette-header h3{
  margin:0;
  color:#17365d;
}

.close-palette{
  background:none;
  border:none;
  font-size:28px;
  cursor:pointer;
  color:#555;
}


/* =========================
   PALETTE GRID
   ========================= */

.palette-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
}

.palette-btn{
  width:100%;
  height:40px;
  border:1px solid #ccc;
  background:#eee;
  border-radius:5px;
  cursor:pointer;
  font-weight:bold;
}

.palette-btn.answered{
  background:#198754;
  color:white;
  border-color:#198754;
}

.palette-btn.review{
  background:#fd7e14;
  color:white;
  border-color:#fd7e14;
}

.palette-btn.current{
  border:3px solid #17365d;
}


/* =========================
   LEGEND
   ========================= */

.legend{
  margin-top:20px;
  font-size:13px;
}

.legend-item{
  display:flex;
  align-items:center;
  margin:7px 0;
}

.legend-box{
  width:18px;
  height:18px;
  border-radius:3px;
  margin-right:8px;
  border:1px solid #ccc;
}

.legend-answered{
  background:#198754;
}

.legend-review{
  background:#fd7e14;
}

.legend-not{
  background:#eee;
}


/* =========================
   SUBMIT
   ========================= */

.submit-btn{
  width:100%;
  margin-top:20px;
  padding:12px;
  border:none;
  border-radius:6px;
  background:#dc3545;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}


/* =========================
   RESULT
   ========================= */

.result-box{
  display:none;
  max-width:700px;
  margin:30px auto;
  background:white;
  padding:25px;
  border-radius:10px;
  box-shadow:0 3px 12px rgba(0,0,0,.1);
  text-align:center;
}

.result-box h2{
  color:#17365d;
}

.result-score{
  font-size:35px;
  font-weight:bold;
  margin:15px 0;
}

.result-stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin:20px 0;
}

.stat{
  padding:15px;
  border-radius:7px;
  background:#f1f3f5;
  font-weight:bold;
}

.retake-btn{
  padding:11px 25px;
  background:#17365d;
  color:white;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-weight:bold;
}


/* =========================
   SOLUTIONS
   ========================= */

.solutions-box{
  display:none;
  max-width:900px;
  margin:25px auto;
  padding:20px 15px;
}

.solutions-box h2{
  text-align:center;
  color:#17365d;
  margin-bottom:20px;
}

.solution-card{
  background:white;
  border-radius:10px;
  padding:18px;
  margin-bottom:15px;
  box-shadow:0 3px 10px rgba(0,0,0,.08);
  border-left:5px solid #17365d;
}

.solution-card.correct{
  border-left-color:#198754;
}

.solution-card.wrong{
  border-left-color:#dc3545;
}

.solution-card.unattempted{
  border-left-color:#ffc107;
}

.solution-question{
  font-size:16px;
  font-weight:bold;
  line-height:1.6;
  margin-bottom:12px;
}

.solution-answer{
  margin:7px 0;
  font-size:15px;
  line-height:1.5;
}

.correct-text{
  color:#198754;
  font-weight:bold;
}

.wrong-text{
  color:#dc3545;
  font-weight:bold;
}

.unattempted-text{
  color:#856404;
  font-weight:bold;
}

.explanation{
  margin-top:12px;
  padding:12px;
  background:#f4f6f9;
  border-radius:6px;
  line-height:1.6;
  font-size:14px;

/* =========================
   MOBILE
   ========================= */

@media(max-width:750px){

  .navigation{

  .palette{

    height:48px;
    font-size:23px;
  }

  .result-stats{
    grid-template-columns:1fr;
  }

  .solutions-box{
    padding:15px 10px;
  }

  .solution-card{
    padding:14px;
  }

  .solution-question{
    font-size:15px;
  }

}

</style>

</head>

/* =========================
   VARIABLES
   ========================= */

let current = 0;

let answers =
new Array(questions.length).fill(null);

let review =
new Array(questions.length).fill(false);

let timeLeft = 15 * 60;

let submitted = false;


/* =========================
   SHOW QUESTION
   ========================= */

function showQuestion(){

  const q = questions[current];

  document.getElementById("questionNumber").innerText =
  "Question " + (current + 1) +
  " of " + questions.length;

  document.getElementById("questionText").innerText =
  q.q;

  const optionsDiv =
  document.getElementById("options");

  optionsDiv.innerHTML = "";


  q.options.forEach((option,index)=>{

    const div =
    document.createElement("div");

    div.className = "option";


    if(answers[current] === index){

      div.classList.add("selected");

    }


    div.innerHTML =

    `<input
    type="radio"
    name="option"
    ${answers[current] === index ? "checked" : ""}>

    ${String.fromCharCode(65+index)}. ${option}`;


    div.onclick = ()=>{

      selectAnswer(index);

    };


    optionsDiv.appendChild(div);

  });


  updatePalette();

}


/* =========================
   SELECT ANSWER
   ========================= */

function selectAnswer(index){

  if(submitted) return;

  answers[current] = index;

  showQuestion();

}


/* =========================
   NEXT
   ========================= */

function nextQuestion(){

  if(current < questions.length - 1){

    current++;

    showQuestion();

  }

}


/* =========================
   PREVIOUS
   ========================= */

function previousQuestion(){

  if(current > 0){

    current--;

    showQuestion();

  }

}


/* =========================
   CLEAR
   ========================= */

function clearResponse(){

  answers[current] = null;

  showQuestion();

}


/* =========================
   MARK REVIEW
   ========================= */

function markReview(){

  review[current] =
  !review[current];

  updatePalette();

}


/* =========================
   UPDATE PALETTE
   ========================= */

function updatePalette(){

  const grid =
  document.getElementById("paletteGrid");

  grid.innerHTML = "";


  questions.forEach((q,index)=>{

    const btn =
    document.createElement("button");

    btn.className =
    "palette-btn";

    btn.innerText =
    index + 1;


    if(answers[index] !== null){

      btn.classList.add("answered");

    }


    if(review[index]){

      btn.classList.add("review");

    }


    if(index === current){

      btn.classList.add("current");

    }


    btn.onclick = ()=>{

      jumpToQuestion(index);

    };


    grid.appendChild(btn);

  });

}


/* =========================
   JUMP
   ========================= */

function jumpToQuestion(index){

  current = index;

  showQuestion();

  togglePalette();

}


/* =========================
   PALETTE
   ========================= */

function togglePalette(){

  const palette =
  document.getElementById("palette");

  palette.classList.toggle("open");

}


/* =========================
   TIMER
   ========================= */

function updateTimer(){

  if(submitted) return;


  const timer =
  document.getElementById("timer");


  let minutes =
  Math.floor(timeLeft / 60);


  let seconds =
  timeLeft % 60;


  timer.innerText =
  String(minutes).padStart(2,"0")
  + ":"
  +
  String(seconds).padStart(2,"0");


  if(timeLeft <= 60){

    timer.style.background =
    "#dc3545";

  }


  if(timeLeft <= 0){

    submitTest(true);

    return;

  }


  timeLeft--;

}


setInterval(updateTimer,1000);


/* =========================
   SUBMIT
   ========================= */

function submitTest(autoSubmit=false){

  if(submitted) return;


  if(!autoSubmit){

    const confirmSubmit =
    confirm(
      "क्या आप Test Submit करना चाहते हैं?"
    );


    if(!confirmSubmit) return;

  }


  submitted = true;


  let correct = 0;

  let wrong = 0;

  let unattempted = 0;


  questions.forEach((q,index)=>{

    if(answers[index] === null){

      unattempted++;

    }

    else if(
      answers[index] === q.answer
    ){

      correct++;

    }

    else{

      wrong++;

    }

  });


  const score =
  correct - (wrong / 3);


  /* Hide Exam */

  document.getElementById(
    "examContainer"
  ).style.display = "none";


  document.querySelector(
    ".exam-info"
  ).style.display = "none";


  document.querySelector(
    ".palette-toggle"
  ).style.display = "none";


  document.getElementById(
    "palette"
  ).classList.remove("open");


  /* Show Result */

  document.getElementById(
    "resultBox"
  ).style.display = "block";


  document.getElementById(
    "resultScore"
  ).innerText =
  score.toFixed(2) + " / 27";


  document.getElementById(
    "correctCount"
  ).innerText =
  correct;


  document.getElementById(
    "wrongCount"
  ).innerText =
  wrong;


  document.getElementById(
    "unattemptedCount"
  ).innerText =
  unattempted;


  let message = "";


  if(score >= 23){

    message =
    "🔥 Excellent! आपकी तैयारी बहुत अच्छी है।";

  }

  else if(score >= 18){

    message =
    "👏 Very Good! थोड़ी और practice करें।";

  }

  else if(score >= 12){

    message =
    "👍 अच्छा प्रयास! Revision पर ध्यान दें।";

  }

  else{

    message =
    "📚 Chapter को एक बार फिर अच्छी तरह revise करें।";

  }


  if(autoSubmit){

    message =
    "⏰ समय समाप्त! Test automatically submit हो गया।<br>"
    + message;

  }


  document.getElementById(
    "resultMessage"
  ).innerHTML =
  message;


  /* Show Solutions */

  showSolutions();

}


/* =========================
   SHOW SOLUTIONS
   ========================= */

function showSolutions(){

  const solutionsBox =
  document.getElementById(
    "solutionsBox"
  );


  const container =
  document.getElementById(
    "solutionsContainer"
  );


  container.innerHTML = "";


  questions.forEach((q,index)=>{

    const card =
    document.createElement("div");


    let statusClass = "";

    let statusText = "";


    /* STATUS */

    if(answers[index] === null){

      statusClass =
      "unattempted";


      statusText =
      `<span class="unattempted-text">
      ⚠️ Unattempted
      </span>`;

    }


    else if(
      answers[index] === q.answer
    ){

      statusClass =
      "correct";


      statusText =
      `<span class="correct-text">
      ✅ Correct
      </span>`;

    }


    else{

      statusClass =
      "wrong";


      statusText =
      `<span class="wrong-text">
      ❌ Wrong
      </span>`;

    }


    /* YOUR ANSWER */

    let yourAnswer =
    "Not Attempted";


    if(answers[index] !== null){

      yourAnswer =
      String.fromCharCode(
        65 + answers[index]
      )
      + ". "
      + q.options[answers[index]];

    }


    /* CORRECT ANSWER */

    const correctAnswer =
    String.fromCharCode(
      65 + q.answer
    )
    + ". "
    + q.options[q.answer];


    /* CARD */

    card.className =
    "solution-card " +
    statusClass;


    card.innerHTML = `

      <div class="solution-question">

        Q.${index + 1}.
        ${q.q}

      </div>


      <div class="solution-answer">

        <strong>Your Answer:</strong>

        ${yourAnswer}

      </div>


      <div class="solution-answer">

        <strong>Correct Answer:</strong>

        <span class="correct-text">

          ${correctAnswer}

        </span>

      </div>


      <div class="solution-answer">

        <strong>Status:</strong>

        ${statusText}

      </div>


      <div class="explanation">

        <strong>💡 Explanation:</strong><br>

        ${explanations[index]}

      </div>

    `;


    container.appendChild(card);

  });


  solutionsBox.style.display =
  "block";

}


/* =========================
   INITIAL LOAD
   ========================= */

showQuestion();

</script>

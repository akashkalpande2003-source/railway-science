<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Class 10 Science | Our Environment | TCS Style Mock Test</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:"Noto Sans Devanagari","Mangal",Arial,sans-serif;
    background:#f3f6fa;
    color:#202124;
    min-height:100vh;
}

/* ================= HEADER ================= */

.header{
    height:64px;
    background:#ffffff;
    border-bottom:1px solid #d9dee5;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    position:sticky;
    top:0;
    z-index:1000;
}

.logo{
    font-size:19px;
    font-weight:700;
    color:#17365d;
}

.logo span{
    display:block;
    font-size:12px;
    color:#777;
    font-weight:500;
    margin-top:2px;
}

/* Palette Button */

.palette-btn{
    width:46px;
    height:42px;
    border:1px solid #cfd6df;
    background:#fff;
    border-radius:7px;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:5px;
}

.palette-btn span{
    width:22px;
    height:2px;
    background:#17365d;
    display:block;
}

/* ================= MAIN ================= */

.main{
    max-width:900px;
    margin:25px auto;
    padding:0 15px;
}

.exam-title{
    background:#17365d;
    color:white;
    padding:15px 18px;
    border-radius:8px 8px 0 0;
}

.exam-title h1{
    font-size:20px;
    margin-bottom:4px;
}

.exam-title p{
    font-size:13px;
    opacity:.9;
}

/* Question Card */

.question-card{
    background:#fff;
    border:1px solid #dce2e8;
    border-top:none;
    border-radius:0 0 8px 8px;
    padding:25px;
    min-height:480px;
}

.question-number{
    font-size:16px;
    font-weight:700;
    color:#17365d;
    margin-bottom:17px;
}

.question-text{
    font-size:18px;
    line-height:1.8;
    font-weight:600;
    margin-bottom:24px;
}

/* Options */

.options{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.option{
    border:1px solid #cfd6df;
    background:#fff;
    border-radius:7px;
    padding:13px 15px;
    cursor:pointer;
    font-size:16px;
    line-height:1.6;
    transition:.15s;
}

.option:hover{
    background:#f5f8fc;
    border-color:#17365d;
}

.option.selected-correct{
    background:#e9f8ee;
    border:2px solid #1b8a45;
    color:#11652f;
}

.option.selected-wrong{
    background:#fdecec;
    border:2px solid #d93025;
    color:#a51d16;
}

.option.disabled{
    cursor:default;
}

.option.disabled:hover{
    background:inherit;
}

.option-label{
    font-weight:700;
    margin-right:7px;
}

/* Result message */

.answer-status{
    margin-top:20px;
    display:none;
    border-radius:7px;
    padding:12px 15px;
    font-weight:700;
}

.answer-status.correct{
    display:block;
    background:#e9f8ee;
    color:#14733b;
    border-left:5px solid #1b8a45;
}

.answer-status.wrong{
    display:block;
    background:#fdecec;
    color:#b42318;
    border-left:5px solid #d93025;
}

/* Explanation */

.explanation{
    display:none;
    margin-top:12px;
    padding:15px;
    background:#f5f8fc;
    border-left:4px solid #17365d;
    border-radius:5px;
    line-height:1.7;
    font-size:15px;
}

.explanation strong{
    color:#17365d;
}

/* Navigation */

.navigation{
    display:flex;
    justify-content:space-between;
    gap:12px;
    margin-top:20px;
}

.nav-btn{
    border:none;
    border-radius:6px;
    padding:12px 24px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
}

.prev{
    background:#e8edf3;
    color:#26384d;
}

.next{
    background:#17365d;
    color:#fff;
}

.nav-btn:disabled{
    opacity:.45;
    cursor:not-allowed;
}

.submit-btn{
    background:#168542;
    color:#fff;
    display:none;
}

/* ================= PALETTE ================= */

.palette-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.35);
    z-index:2000;
    display:none;
}

.palette{
    position:absolute;
    top:0;
    right:0;
    width:360px;
    max-width:92%;
    height:100%;
    background:#fff;
    box-shadow:-4px 0 15px rgba(0,0,0,.15);
    padding:18px;
    overflow-y:auto;
}

.palette-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding-bottom:15px;
    border-bottom:1px solid #ddd;
}

.palette-header h2{
    font-size:19px;
    color:#17365d;
}

.close-palette{
    border:none;
    background:#f1f3f5;
    width:34px;
    height:34px;
    border-radius:50%;
    cursor:pointer;
    font-size:20px;
}

/* Status legend */

.legend{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin:15px 0;
}

.legend-item{
    padding:8px;
    border-radius:5px;
    font-size:12px;
    text-align:center;
    font-weight:700;
}

.legend-correct{
    background:#dff4e6;
    color:#137333;
}

.legend-wrong{
    background:#fde2e0;
    color:#b42318;
}

.legend-skip{
    background:#eef1f4;
    color:#555;
}

.legend-current{
    background:#e0e8f5;
    color:#17365d;
}

/* Palette grid */

.palette-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:8px;
}

.palette-q{
    height:40px;
    border:1px solid #ccd3da;
    border-radius:5px;
    background:#f7f8fa;
    cursor:pointer;
    font-weight:700;
    color:#444;
}

.palette-q:hover{
    border-color:#17365d;
}

.palette-q.correct{
    background:#28a745;
    color:white;
    border-color:#28a745;
}

.palette-q.wrong{
    background:#dc3545;
    color:white;
    border-color:#dc3545;
}

.palette-q.current{
    outline:3px solid #17365d;
    outline-offset:1px;
}

.palette-q.correct.current{
    outline:3px solid #17365d;
}

.palette-q.wrong.current{
    outline:3px solid #17365d;
}

/* ================= FINAL RESULT ================= */

.result-screen{
    display:none;
    background:#fff;
    border:1px solid #dce2e8;
    border-radius:8px;
    padding:30px 20px;
    text-align:center;
}

.result-screen h2{
    color:#17365d;
    font-size:25px;
    margin-bottom:8px;
}

.result-score{
    font-size:42px;
    font-weight:800;
    color:#17365d;
    margin:15px 0;
}

.result-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    max-width:550px;
    margin:25px auto;
}

.result-box{
    padding:18px 10px;
    border-radius:8px;
}

.result-box strong{
    display:block;
    font-size:25px;
}

.result-box span{
    font-size:13px;
}

.correct-box{
    background:#e8f7ed;
    color:#137333;
}

.wrong-box{
    background:#fde9e7;
    color:#b42318;
}

.skipped-box{
    background:#eef1f4;
    color:#555;
}

.restart{
    border:none;
    background:#17365d;
    color:white;
    padding:12px 28px;
    border-radius:6px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

    .header{
        height:58px;
        padding:0 12px;
    }

    .logo{
        font-size:16px;
    }

    .logo span{
        font-size:10px;
    }

    .main{
        margin:12px auto;
        padding:0 9px;
    }

    .exam-title{
        padding:13px 14px;
    }

    .exam-title h1{
        font-size:17px;
    }

    .question-card{
        padding:17px 14px;
        min-height:500px;
    }

    .question-number{
        font-size:15px;
    }

    .question-text{
        font-size:16px;
        line-height:1.75;
    }

    .option{
        font-size:15px;
        padding:11px 12px;
    }

    .navigation{
        position:sticky;
        bottom:0;
        background:#fff;
        padding:10px 0;
        border-top:1px solid #ddd;
        z-index:500;
    }

    .nav-btn{
        padding:11px 16px;
        font-size:14px;
        flex:1;
    }

    .palette{
        width:330px;
    }

    .palette-grid{
        grid-template-columns:repeat(5,1fr);
    }

    .palette-q{
        height:38px;
        font-size:13px;
    }

    .result-grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header class="header">

    <div class="logo">
        CLASS 10 SCIENCE
        <span>OUR ENVIRONMENT • TCS STYLE MOCK TEST</span>
    </div>

    <button class="palette-btn" onclick="openPalette()" aria-label="Open Palette">
        <span></span>
        <span></span>
        <span></span>
    </button>

</header>


<!-- ================= MAIN ================= -->

<main class="main">

    <div id="examArea">

        <div class="exam-title">
            <h1>Chapter 13 — Our Environment</h1>
            <p>45 Questions • No Timer • No Negative Marking</p>
        </div>

        <div class="question-card">

            <div class="question-number" id="questionNumber"></div>

            <div class="question-text" id="questionText"></div>

            <div class="options" id="options"></div>

            <div id="answerStatus" class="answer-status"></div>

            <div id="explanation" class="explanation"></div>

        </div>

        <div class="navigation">

            <button class="nav-btn prev" id="prevBtn" onclick="previousQuestion()">
                ← Previous
            </button>

            <button class="nav-btn next" id="nextBtn" onclick="nextQuestion()">
                Next →
            </button>

            <button class="nav-btn submit-btn" id="submitBtn" onclick="showResult()">
                Submit Test
            </button>

        </div>

    </div>


    <!-- ================= RESULT ================= -->

    <div class="result-screen" id="resultScreen">

        <h2>Test Completed</h2>

        <p>Class 10 Science — Our Environment</p>

        <div class="result-score" id="resultScore">
            0 / 45
        </div>

        <div class="result-grid">

            <div class="result-box correct-box">
                <strong id="correctResult">0</strong>
                <span>Correct</span>
            </div>

            <div class="result-box wrong-box">
                <strong id="wrongResult">0</strong>
                <span>Wrong</span>
            </div>

            <div class="result-box skipped-box">
                <strong id="skippedResult">0</strong>
                <span>Skipped</span>
            </div>

        </div>

        <button class="restart" onclick="restartTest()">
            Restart Test
        </button>

    </div>

</main>


<!-- ================= PALETTE ================= -->

<div class="palette-overlay" id="paletteOverlay">

    <aside class="palette">

        <div class="palette-header">

            <h2>Question Palette</h2>

            <button class="close-palette" onclick="closePalette()">×</button>

        </div>

        <div class="legend">

            <div class="legend-item legend-correct">
                ✓ Correct
            </div>

            <div class="legend-item legend-wrong">
                ✕ Wrong
            </div>

            <div class="legend-item legend-skip">
                ○ Unattempted
            </div>

            <div class="legend-item legend-current">
                ● Current
            </div>

        </div>

        <div class="palette-grid" id="paletteGrid"></div>

    </aside>

</div>


<script>

/* =========================================================
   QUESTION DATA
========================================================= */

const questions = [

{
q:"एक हाउसिंग सोसाइटी ने अपशिष्ट को दो डिब्बों में पृथक करना शुरू किया है - हरा रसोई अपशिष्ट के लिए और नीला प्लास्टिक, धातु और कांच के लिए। इस प्रक्रिया का मुख्य लाभ क्या है?",
options:[
"इससे अपशिष्ट संग्रहण शीघ्रता से होता है।",
"इससे कचरे की दुर्गंध कम होती है।",
"इससे अजैवनिम्नीकरणीय अपशिष्ट को जैवनिम्नीकरणीय अपशिष्ट से पृथक करने में सहायता प्राप्त होती है।",
"इससे उत्पादित अपशिष्ट की मात्रा बढ़ जाती है।"
],
answer:2,
exp:"अपशिष्ट को अलग-अलग डिब्बों में पृथक करने से जैवनिम्नीकरणीय और अजैवनिम्नीकरणीय कचरे को अलग रखना आसान होता है, जिससे उनका उचित प्रबंधन और पुनर्चक्रण किया जा सकता है।"
},

{
q:"स्कूल कैम्पस की सफाई करते समय, विद्यार्थियों को जैव-निम्नीकरणीय अपशिष्ट को पृथक करने के लिए कहा जाता है। निम्नलिखित में से किसे जैव-निम्नीकरणीय बिन में डाला जाना चाहिए?",
options:[
"एक क्रश किया हुआ कोल्ड ड्रिंक कैन",
"पॉलीथीन बैग",
"लकड़ी की पेंसिल की छीलन",
"कांच की बोतल"
],
answer:2,
exp:"लकड़ी की पेंसिल की छीलन प्राकृतिक पदार्थ है और सूक्ष्मजीवों द्वारा विघटित हो सकती है, इसलिए यह जैव-निम्नीकरणीय है।"
},

{
q:"पिछले 10 वर्षों में, शहर में प्लास्टिक कचरे में बहुत ज़्यादा वृद्धि हुई है। लोगों की कौन-सी आदत इसका सबसे बड़ा कारण है?",
options:[
"अधिक लोग बसों और रेलगाड़ियों का उपयोग कर रहे हैं।",
"लोग लंबे समय तक चलने वाली वस्तुओं के स्थान पर डिस्पोजेबल वस्तुओं का अधिक उपयोग कर रहे हैं।",
"प्लास्टिक बैग पर प्रतिबन्ध लगा दिया गया है।",
"लोग पुनः उपयोग योग्य चीजें चुन रहे हैं।"
],
answer:1,
exp:"डिस्पोजेबल प्लास्टिक वस्तुओं का बार-बार उपयोग और त्याग प्लास्टिक कचरे की मात्रा बढ़ाता है।"
},

{
q:"वे पदार्थ जो जैविक प्रक्रियाओं द्वारा विघटित हो जाते हैं, उन्हें क्या कहा जाता है?",
options:[
"जैवनिम्नीकरणीय",
"अजैवनिम्नीकरणीय",
"सिंथेटिक",
"धात्विक"
],
answer:0,
exp:"जो पदार्थ सूक्ष्मजीवों या अन्य जैविक प्रक्रियाओं द्वारा प्राकृतिक रूप से विघटित हो जाते हैं, उन्हें जैवनिम्नीकरणीय पदार्थ कहते हैं।"
},

{
q:"एक स्कूल 'शून्य अपशिष्ट' दिवस का आयोजन करता है। निम्नलिखित में से कौन-सी पद्धति इस पहल में सर्वोत्तम रूप से सहायक होगी?",
options:[

"प्लास्टिक की पन्नी में स्नैक्स लपेटना",

answer:3,
exp:"पुनः प्रयोज्य प्लेटों और प्राकृतिक पत्तों का उपयोग एकल-उपयोग प्लास्टिक कचरे को कम करता है।"

options:[

answer:2,
exp:"प्लास्टिक की थैलियाँ सामान्य जैविक प्रक्रियाओं द्वारा आसानी से विघटित नहीं होतीं, इसलिए वे अजैवनिम्नीकरणीय हैं।"

exp:"प्लास्टिक एक मानव निर्मित पदार्थ है और सामान्यतः बैक्टीरिया द्वारा आसानी से विघटित नहीं होता।"

exp:"काँच जैव-निम्नीकरणीय नहीं है और पर्यावरण में बहुत लंबे समय तक बना रह सकता है।"
},

{
q:"निम्नलिखित में से कौन-सी सामग्री लम्बे समय तक अपरिवर्तित रहती है?",
options:[
"प्लास्टिक का थैला",

"जूट का थैला"
],
answer:0,
exp:"प्लास्टिक लंबे समय तक प्राकृतिक रूप से विघटित नहीं होता, इसलिए यह पर्यावरण में लंबे समय तक बना रहता है।"
},

{
q:"अजैवनिम्नीकरणीय अपशिष्ट उत्पादन को कम करने का प्राथमिक लक्ष्य क्या है?",
options:[
"औद्योगिक विकास को बढ़ावा देना",
"भू-भरण में अधिक स्थान उपलब्ध कराना",
"प्राकृतिक संसाधनों का संरक्षण और प्रदूषण को न्यूनीकृत करना",
"अपशिष्ट का पुनर्चक्रण करना"

/* =========================================================
   STATE
========================================================= */

let currentQuestion = 0;

/*
 status:
 null = unattempted
 "correct" = correct
 "wrong" = wrong
*/

let status = new Array(questions.length).fill(null);
let selected = new Array(questions.length).fill(null);


/* =========================================================
   LOAD QUESTION
========================================================= */

function loadQuestion(){

    const q = questions[currentQuestion];

    document.getElementById("questionNumber").textContent =
        "Question " + (currentQuestion + 1) + " of " + questions.length;

    document.getElementById("questionText").textContent = q.q;

    const optionsBox = document.getElementById("options");

    optionsBox.innerHTML = "";

    q.options.forEach((option,index)=>{

        const div = document.createElement("div");

        div.className = "option";

        div.innerHTML =
            '<span class="option-label">' +
            String.fromCharCode(65 + index) +
            '.</span>' +
            option;

        div.onclick = function(){
            selectOption(index);
        };

        optionsBox.appendChild(div);

    });

    document.getElementById("answerStatus").style.display = "none";
    document.getElementById("answerStatus").className = "answer-status";

    document.getElementById("explanation").style.display = "none";

    /*
       If already answered, show previous state
    */

    if(selected[currentQuestion] !== null){
        showSavedAnswer();
    }

    updateButtons();
    updatePalette();

}


/* =========================================================
   SELECT OPTION
========================================================= */

function selectOption(index){

    /*
       Prevent changing answer
    */

    if(selected[currentQuestion] !== null){
        return;
    }

    selected[currentQuestion] = index;

    const q = questions[currentQuestion];

    const optionElements =
        document.querySelectorAll(".option");

    optionElements.forEach((el,i)=>{

        el.classList.add("disabled");

        if(i === q.answer){

            el.classList.add("selected-correct");

        }

        if(i === index && index !== q.answer){

            el.classList.add("selected-wrong");

        }

    });

    const statusBox =
        document.getElementById("answerStatus");

    const explanation =
        document.getElementById("explanation");

    if(index === q.answer){

        status[currentQuestion] = "correct";

        statusBox.className =
            "answer-status correct";

        statusBox.innerHTML =
            "✓ सही उत्तर";

    }else{

        status[currentQuestion] = "wrong";

        statusBox.className =
            "answer-status wrong";

        statusBox.innerHTML =
            "✕ गलत उत्तर — सही उत्तर: " +
            String.fromCharCode(65 + q.answer);

    }

    statusBox.style.display = "block";

    explanation.innerHTML =
        "<strong>Explanation:</strong><br>" +
        q.exp;

    explanation.style.display = "block";

    updatePalette();
    updateButtons();

}


/* =========================================================
   SHOW SAVED ANSWER
========================================================= */

function showSavedAnswer(){

    const q = questions[currentQuestion];

    const selectedAnswer =
        selected[currentQuestion];

    const optionElements =
        document.querySelectorAll(".option");

    optionElements.forEach((el,i)=>{

        el.classList.add("disabled");

        if(i === q.answer){
            el.classList.add("selected-correct");
        }

        if(
            i === selectedAnswer &&
            selectedAnswer !== q.answer
        ){
            el.classList.add("selected-wrong");
        }

    });

    const statusBox =
        document.getElementById("answerStatus");

    const explanation =
        document.getElementById("explanation");

    if(status[currentQuestion] === "correct"){

        statusBox.className =
            "answer-status correct";

        statusBox.innerHTML =
            "✓ सही उत्तर";

    }else{

        statusBox.className =
            "answer-status wrong";

        statusBox.innerHTML =
            "✕ गलत उत्तर — सही उत्तर: " +
            String.fromCharCode(65 + q.answer);

    }

    statusBox.style.display = "block";

    explanation.innerHTML =
        "<strong>Explanation:</strong><br>" +
        q.exp;

    explanation.style.display = "block";

}


/* =========================================================
   NAVIGATION
========================================================= */

function previousQuestion(){

    if(currentQuestion > 0){

        currentQuestion--;

        loadQuestion();

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }

}


function nextQuestion(){

    if(currentQuestion < questions.length - 1){

        currentQuestion++;

        loadQuestion();

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }

}


/* =========================================================
   BUTTON UPDATE
========================================================= */

function updateButtons(){

    const prev =
        document.getElementById("prevBtn");

    const next =
        document.getElementById("nextBtn");

    const submit =
        document.getElementById("submitBtn");

    prev.disabled =
        currentQuestion === 0;

    if(currentQuestion === questions.length - 1){

        next.style.display = "none";
        submit.style.display = "block";

    }else{

        next.style.display = "block";
        submit.style.display = "none";

    }

}


/* =========================================================
   PALETTE
========================================================= */

function updatePalette(){

    const grid =
        document.getElementById("paletteGrid");

    grid.innerHTML = "";

    questions.forEach((q,index)=>{

        const button =
            document.createElement("button");

        button.className = "palette-q";

        button.textContent = index + 1;

        if(status[index] === "correct"){
            button.classList.add("correct");
        }

        if(status[index] === "wrong"){
            button.classList.add("wrong");
        }

        if(index === currentQuestion){
            button.classList.add("current");
        }

        button.onclick = function(){

            currentQuestion = index;

            closePalette();

            loadQuestion();

            window.scrollTo({
                top:0,
                behavior:"smooth"
            });

        };

        grid.appendChild(button);

    });

}


/* =========================================================
   OPEN / CLOSE PALETTE
========================================================= */

function openPalette(){

    document.getElementById(
        "paletteOverlay"
    ).style.display = "block";

}


function closePalette(){

    document.getElementById(
        "paletteOverlay"
    ).style.display = "none";

}


/* Close when clicking outside */

document.getElementById(
    "paletteOverlay"
).addEventListener("click",function(e){

    if(e.target === this){
        closePalette();
    }

});


/* =========================================================
   RESULT
========================================================= */

function showResult(){

    let correct = 0;
    let wrong = 0;
    let skipped = 0;

    status.forEach(s=>{

        if(s === "correct"){
            correct++;
        }
        else if(s === "wrong"){
            wrong++;
        }
        else{
            skipped++;
        }

    });

    document.getElementById("examArea")
        .style.display = "none";

    document.getElementById("resultScreen")
        .style.display = "block";

    document.getElementById("resultScore")
        .textContent =
        correct + " / " + questions.length;

    document.getElementById("correctResult")
        .textContent = correct;

    document.getElementById("wrongResult")
        .textContent = wrong;

    document.getElementById("skippedResult")
        .textContent = skipped;

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =========================================================
   RESTART
========================================================= */

function restartTest(){

    currentQuestion = 0;

    status =
        new Array(questions.length).fill(null);

    selected =
        new Array(questions.length).fill(null);

    document.getElementById("resultScreen")
        .style.display = "none";

    document.getElementById("examArea")
        .style.display = "block";

    loadQuestion();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =========================================================
   INITIALIZE
========================================================= */

loadQuestion();

</script>

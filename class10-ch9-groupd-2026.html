<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,"Noto Sans Devanagari",sans-serif;
    background:#eef2f7;
    color:#172033;
}

/* ================= HEADER ================= */

.header{
    background:linear-gradient(135deg,#071d49,#0d47a1);
    color:white;
    padding:14px 18px;
    position:sticky;
    top:0;
    z-index:100;
    box-shadow:0 3px 12px rgba(0,0,0,.18);
}

.header-inner{
    max-width:1100px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
}

.title{
    font-size:20px;
    font-weight:700;
}

.subtitle{
    font-size:12px;
    opacity:.85;
    margin-top:4px;
}

.timer{
    background:#fff;
    color:#0b2c68;
    padding:9px 14px;
    border-radius:8px;
    font-weight:bold;
    min-width:90px;
    text-align:center;
}

/* ================= TOP BAR ================= */

.topbar{
    max-width:1100px;
    margin:12px auto 0;
    padding:0 10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.info{
    font-size:14px;
    color:#475569;
}

.palette-btn{
    border:0;
    background:#0d47a1;
    color:white;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    box-shadow:0 2px 7px rgba(0,0,0,.15);
}

/* ================= PALETTE ================= */

.palette{
    position:fixed;
    top:68px;
    right:12px;
    width:300px;
    max-height:75vh;
    overflow-y:auto;
    background:white;
    border-radius:12px;
    padding:14px;
    box-shadow:0 8px 30px rgba(0,0,0,.25);
    z-index:200;
    display:none;
}

.palette.show{
    display:block;
}

.palette-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}

.palette-head h3{
    color:#0b2c68;
    font-size:17px;
}

.close-palette{
    border:0;
    background:#eee;
    width:30px;
    height:30px;
    border-radius:50%;
    cursor:pointer;
}

.palette-info{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
    font-size:12px;
    margin-bottom:12px;
}

.legend{
    padding:5px;
    border-radius:5px;
    text-align:center;
}

.l-unattempted{
    background:#e5e7eb;
}

.l-answered{
    background:#16a34a;
    color:white;
}

.l-review{
    background:#f59e0b;
    color:white;
}

.l-answered-review{
    background:#7c3aed;
    color:white;
}

.palette-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:7px;
}

.p-btn{
    border:0;
    height:34px;
    border-radius:6px;
    cursor:pointer;
    background:#e5e7eb;
    font-weight:bold;
}

.p-btn.answered{
    background:#16a34a;
    color:white;
}

.p-btn.review{
    background:#f59e0b;
    color:white;
}

.p-btn.answered.review{
    background:#7c3aed;
    color:white;
}

.p-btn.current{
    outline:3px solid #0d47a1;
}

/* ================= MAIN ================= */

.container{
    max-width:1100px;
    margin:14px auto 40px;
    padding:0 10px;
}

.test-card{
    background:white;
    border-radius:12px;
    box-shadow:0 3px 14px rgba(0,0,0,.08);
    padding:22px;
}

.part-title{
    background:linear-gradient(90deg,#0d47a1,#1976d2);
    color:white;
    padding:12px 15px;
    border-radius:8px;
    margin-bottom:18px;
    font-size:18px;
    font-weight:bold;
}

.question-number{
    color:#0d47a1;
    font-weight:bold;
    font-size:17px;
    margin-bottom:10px;
}

.question{
    font-size:17px;
    line-height:1.8;
    font-weight:600;
    margin-bottom:18px;
}

.options{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.option{
    border:1px solid #d6dce5;
    border-radius:9px;
    padding:12px 14px;
    cursor:pointer;
    transition:.2s;
    background:#fafbfc;
    line-height:1.6;
}

.option:hover{
    background:#edf4ff;
    border-color:#1976d2;
}

.option.selected{
    background:#dbeafe;
    border:2px solid #1976d2;
}

.option input{
    margin-right:10px;
    transform:scale(1.15);
}

/* ================= BUTTONS ================= */

.controls{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-top:24px;
    flex-wrap:wrap;
}

.btn{
    border:0;
    border-radius:8px;
    padding:11px 18px;
    cursor:pointer;
    font-weight:bold;
    font-size:14px;
}

.prev{
    background:#64748b;
    color:white;
}

.next{
    background:#0d47a1;
    color:white;
}

.review{
    background:#f59e0b;
    color:white;
}

.submit{
    background:#dc2626;
    color:white;
}

/* ================= PROGRESS ================= */

.progress-wrap{
    margin:12px auto;
    max-width:1100px;
    padding:0 10px;
}

.progress{
    height:8px;
    background:#dce2ea;
    border-radius:20px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    width:0;
    background:#1976d2;
    transition:.3s;
}

/* ================= RESULT ================= */

.result{
    display:none;
    max-width:1100px;
    margin:20px auto;
    padding:0 10px 50px;
}

.score-card{
    background:white;
    border-radius:12px;
    padding:22px;
    text-align:center;
    box-shadow:0 3px 15px rgba(0,0,0,.1);
}

.score{
    font-size:40px;
    color:#0d47a1;
    font-weight:bold;
}

.result-stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-top:18px;
}

.stat{
    padding:14px;
    border-radius:8px;
    background:#f1f5f9;
}

.stat b{
    display:block;
    font-size:20px;
    margin-bottom:4px;
}

.solution-card{
    background:white;
    margin-top:15px;
    border-radius:10px;
    padding:18px;
    border-left:5px solid #0d47a1;
    box-shadow:0 2px 9px rgba(0,0,0,.08);
}

.solution-q{
    font-weight:bold;
    color:#0d47a1;
    line-height:1.7;
}

.solution-status{
    display:inline-block;
    padding:5px 9px;
    border-radius:5px;
    margin:8px 0;
    font-size:13px;
    font-weight:bold;
}

.correct-status{
    background:#dcfce7;
    color:#166534;
}

.wrong-status{
    background:#fee2e2;
    color:#991b1b;
}

.unattempted-status{
    background:#e5e7eb;
    color:#374151;
}

.solution-text{
    line-height:1.8;
    color:#374151;
}

.answer-box{
    background:#eff6ff;
    border-radius:7px;
    padding:10px;
    margin-top:10px;
    color:#0b2c68;
    font-weight:bold;
}

/* ================= MOBILE ================= */

@media(max-width:700px){

    .header{
        padding:11px;
    }

    .title{
        font-size:16px;

    }

    .option{

    }

    .result-stats{

    }
}

const progressBar = document.getElementById("progressBar");

/* =========================================================
   PALETTE
========================================================= */

function createPalette(){

    paletteGrid.innerHTML="";

    questions.forEach((q,i)=>{

        const btn=document.createElement("button");

        btn.className="p-btn";
        btn.textContent=i+1;

        btn.onclick=()=>{
            current=i;
            renderQuestion();
            togglePalette(false);
        };

        paletteGrid.appendChild(btn);
    });

    updatePalette();
}

function updatePalette(){

    [...paletteGrid.children].forEach((btn,i)=>{

        btn.className="p-btn";

        if(answers[i] !== null){
            btn.classList.add("answered");
        }

        if(review[i]){
            btn.classList.add("review");
        }

        if(i===current){
            btn.classList.add("current");
        }

    });
}

/* =========================================================
   PALETTE TOGGLE
========================================================= */

function togglePalette(force){

    const p=document.getElementById("palette");

    if(force===false){
        p.classList.remove("show");
        return;
    }

    p.classList.toggle("show");
}

/* =========================================================
   RENDER QUESTION
========================================================= */

function renderQuestion(){

    const q=questions[current];

    currentNo.textContent=current+1;

    progressBar.style.width=
        ((current+1)/questions.length*100)+"%";

    questionBox.innerHTML="";

    if(current===0 || questions[current-1].part!==q.part){

        const part=document.createElement("div");

        part.className="part-title";
        part.textContent=q.part;

        questionBox.appendChild(part);
    }

    const number=document.createElement("div");

    number.className="question-number";
    number.textContent="Q"+(current+1);

    questionBox.appendChild(number);

    const text=document.createElement("div");

    text.className="question";
    text.innerHTML=q.q;

    questionBox.appendChild(text);

    const options=document.createElement("div");

    options.className="options";

    q.o.forEach((opt,i)=>{

        const label=document.createElement("label");

        label.className="option";

        if(answers[current]===i){
            label.classList.add("selected");
        }

        label.innerHTML=
            `<input type="radio"
             name="q${current}"
             value="${i}"
             ${answers[current]===i?"checked":""}>
             <b>${String.fromCharCode(65+i)}.</b> ${opt}`;

        label.onclick=()=>{

            answers[current]=i;

            renderQuestion();
        };

        options.appendChild(label);
    });

    questionBox.appendChild(options);

    const controls=document.createElement("div");

    controls.className="controls";

    const prev=document.createElement("button");

    prev.className="btn prev";
    prev.textContent="⏮ Previous";
    prev.disabled=current===0;

    prev.onclick=()=>{
        if(current>0){
            current--;
            renderQuestion();
        }
    };

    const reviewBtn=document.createElement("button");

    reviewBtn.className="btn review";
    reviewBtn.textContent=
        review[current] ? "★ Unmark Review" : "☆ Mark for Review";

    reviewBtn.onclick=()=>{

        review[current]=!review[current];

        updatePalette();

        renderQuestion();
    };

    const next=document.createElement("button");

    next.className="btn next";
    next.textContent=
        current===questions.length-1
        ? "Finish"
        : "Next ⏭";

    next.onclick=()=>{

        if(current<questions.length-1){

            current++;
            renderQuestion();

        }else{

            confirmSubmit();

        }
    };

    const submit=document.createElement("button");

    submit.className="btn submit";
    submit.textContent="Submit Test";

    submit.onclick=confirmSubmit;

    controls.appendChild(prev);
    controls.appendChild(reviewBtn);
    controls.appendChild(next);
    controls.appendChild(submit);

    questionBox.appendChild(controls);

    updatePalette();
}

/* =========================================================
   SUBMIT CONFIRM
========================================================= */

function confirmSubmit(){

    if(submitted) return;

    const attempted=answers.filter(x=>x!==null).length;

    const ok=confirm(
        "क्या आप Test Submit करना चाहते हैं?\n\n"+
        "Attempted: "+attempted+" / "+questions.length+
        "\nUnattempted: "+(questions.length-attempted)+
        "\n\nSubmit करने के बाद आप answers बदल नहीं सकेंगे।"
    );

    if(ok){
        submitTest();
    }
}

/* =========================================================
   SUBMIT
========================================================= */

function submitTest(){

    submitted=true;

    clearInterval(timerInterval);

    let correct=0;
    let wrong=0;
    let skipped=0;
    let score=0;

    questions.forEach((q,i)=>{

        if(answers[i]===null){

            skipped++;

        }else if(q.a!==null && answers[i]===q.a){

            correct++;
            score+=1;

        }else{

            wrong++;
            score-=1/3;

        }

    });

    score=Math.max(0,score);

    document.getElementById("testContainer").style.display="none";
    document.querySelector(".topbar").style.display="none";
    document.querySelector(".progress-wrap").style.display="none";

    const result=document.getElementById("result");

    result.style.display="block";

    document.getElementById("finalScore").textContent=
        score.toFixed(2)+" / "+questions.length;

    document.getElementById("correctCount").textContent=correct;
    document.getElementById("wrongCount").textContent=wrong;
    document.getElementById("skipCount").textContent=skipped;

    const attempted=correct+wrong;

    document.getElementById("accuracy").textContent=
        attempted ? ((correct/attempted)*100).toFixed(1)+"%" : "0%";

    showSolutions();
}

/* =========================================================
   SOLUTIONS
========================================================= */

function showSolutions(){

    const box=document.getElementById("solutions");

    box.innerHTML=
        `<h2 style="margin:25px 0 12px;color:#0d47a1;">
        📚 Detailed Solutions – All 67 Questions
        </h2>`;

    questions.forEach((q,i)=>{

        const card=document.createElement("div");

        card.className="solution-card";

        let status="";
        let statusClass="";

        if(answers[i]===null){

            status="Unattempted";
            statusClass="unattempted-status";

        }else if(q.a!==null && answers[i]===q.a){

            status="Correct";
            statusClass="correct-status";

        }else{

            status="Wrong";
            statusClass="wrong-status";

        }

        let correctText="";

        if(q.a!==null){

            correctText=
                `<div class="answer-box">
                    सही उत्तर:
                    ${String.fromCharCode(65+q.a)}. ${q.o[q.a]}
                </div>`;

        }else{

            correctText=
                `<div class="answer-box">
                    ⚠️ दिए गए विकल्पों में कोई सही विकल्प नहीं है।
                </div>`;
        }

        card.innerHTML=`

            <div class="solution-q">
                Q${i+1}. ${q.q}
            </div>

            <div class="solution-status ${statusClass}">
                ${status}
            </div>

            ${correctText}

            <div class="solution-text">
                <b>समाधान:</b><br>
                ${q.s}
            </div>
        `;

        box.appendChild(card);
    });
}

/* =========================================================
   TIMER
========================================================= */

let timeLeft=40*60;

function updateTimer(){

    if(submitted) return;

    const min=Math.floor(timeLeft/60);
    const sec=timeLeft%60;

    document.getElementById("timer").textContent=
        String(min).padStart(2,"0")+":"+
        String(sec).padStart(2,"0");

    if(timeLeft<=0){

        clearInterval(timerInterval);

        alert("40 मिनट का समय समाप्त हो गया है। Test automatically submit किया जा रहा है।");

        submitTest();

        return;
    }

    timeLeft--;
}

const timerInterval=setInterval(updateTimer,1000);

/* =========================================================
   INITIALIZE
========================================================= */

createPalette();
renderQuestion();

</script>

</body>
</html>

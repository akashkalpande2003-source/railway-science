.result{

.result h2{

.result-item strong{

.restart{

<script>

const questions = [

/* Q1 = Original Q33 */
{
q:`लेंस की शक्ति को ................ के रूप में परिभाषित किया जाता है।`,
o:[
`A. इसकी फोकस दूरी और अपवर्तनांक के गुणनफल`,
`B. मीटर में इसकी फोकस दूरी के व्युत्क्रम`,
`C. छवि दूरी और वस्तु दूरी के अनुपात`,
`D. इसकी फोकस दूरी के वर्ग`
],
a:1,
e:`लेंस की शक्ति P = 1/f होती है, जहाँ f मीटर में फोकस दूरी है।`
},

/* Q2 = Original Q34 */
{
q:`उत्तल लेंस को अभिसारी लेंस भी कहा जाता है, क्योंकि__________________।`,
o:[
`A. यह सदैव आभासी प्रतिबिम्ब बनाता है`,
`B. यह प्रकाश किरणों को बिल्कुल भी बंकित नहीं करता है`,
`C. यह प्रकाश किरणों को एक दूसरे से दूर अपसारित करता है`,
`D. यह समानांतर किरणों को एक बिंदु पर केंद्रित करता है`
],
a:3,
e:`उत्तल लेंस मुख्य अक्ष के समानांतर आने वाली प्रकाश किरणों को फोकस पर अभिसरित करता है।`
},

/* Q3 = Original Q35 */
{
q:`न्यू कार्तेशियन साइन कन्वेंशन (New Cartesian Sign Convention) के अनुसार, यदि प्रकाश की किरण वस्तु से लेंस तक जाती है, तो वस्तु हमेशा इस प्रकार रखी जाती है कि ..............।`,
o:[
`A. वस्तु की दूरी (u) सदैव धनात्मक हो`,
`B. प्रकाश लेंस पर दाईं ओर से पड़े`,
`C. वस्तु लेंस के बाईं ओर हो`,
`D. वस्तु हमेशा मुख्य अक्ष के ऊपर हो`
],
a:2,
e:`नई कार्तीय चिह्न परिपाटी में आपतित प्रकाश की दिशा में वस्तु सामान्यतः लेंस के बाईं ओर रखी जाती है।`
},

/* Q4 = Original Q36 */
{
q:`लेंस द्वारा उत्पन्न आवर्धन, वस्तु-दूरी (u) और प्रतिबिंब-दूरी (v) से किस सूत्र द्वारा संबंधित है?`,
o:[
`A. m = v - u`,
`B. m = v / u`,
`C. m = u + v`,
`D. m = u / v`
],
a:1,
e:`लेंस के लिए आवर्धन m = v/u होता है।`
},

/* Q5 = Original Q37 */
{
q:`अवतल लेंस द्वारा निर्मित प्रतिबिंब के संबंध में निम्नलिखित में से कौन-सा कथन सत्य नहीं है?(i) अवतल लेंस द्वारा निर्मित प्रतिबिंब को पर्दे पर प्राप्त नहीं किया जा सकता।(ii) अवतल लेंस द्वारा निर्मित प्रतिबिंब को पर्दे पर प्राप्त किया जा सकता है।(iii) निर्मित प्रतिबिंब सदैव बिंब के आकार की तुलना में छोटा होता है।(iv) निर्मित प्रतिबिंब सदैव बिंब के आकार की तुलना में बड़ा होता है।`,
o:[
`A. (i) और (iii) दोनों`,
`B. (ii) और (iii) दोनों`,
`C. (ii) और (iv) दोनों`,
`D. (i) और (iv) दोनों`
],
a:2,
e:`अवतल लेंस सदैव आभासी, सीधा और छोटा प्रतिबिंब बनाता है। इसलिए (ii) और (iv) गलत कथन हैं।`
},

/* Q6 = Original Q38 */
{
q:`एक गोलीय लेंस की वृत्ताकार बाह्य रेखा (circular outline) के प्रभावी व्यास को क्या कहते हैं?`,
o:[
`A. प्रकाशिक केंद्र (Optical centre)`,
`B. वक्रता त्रिज्या (Radius of curvature)`,
`C. फोकस दूरी (Focal length)`,
`D. द्वारक (Aperture)`
],
a:3,
e:`लेंस की वृत्ताकार बाहरी सीमा का प्रभावी व्यास द्वारक (Aperture) कहलाता है।`
},

/* Q7 = Original Q39 */
{
q:`किसी वस्तु के आकार का वास्तविक प्रतिबिंब प्राप्त करने के लिए उसे उत्तल लेंस के सामने कहाँ रखा जाना चाहिए?`,
o:[
`A. फोकस दूरी के दोगुने पर`,
`B. अनंत और लेंस के मुख्य फोकस के बीच`,
`C. लेंस के मुख्य फोकस पर`,
`D. अनंत पर`
],
a:0,
e:`उत्तल लेंस में वस्तु को 2F पर रखने पर वास्तविक, उल्टा और वस्तु के समान आकार का प्रतिबिंब 2F पर बनता है।`
},

/* Q8 = Original Q40 */
{
q:`गोलीय लेंस के संबंध में, निम्नलिखित में से कौन सा कथन सही नहीं है?`,
o:[
`A. अवतल लेंस में भी दो वक्रता केंद्र होते हैं।`,
`B. प्रत्येक गोलीय लेंस में दो वक्रता केंद्र होते हैं।`,
`C. प्रकाशिक केंद्र, वक्रता केंद्र के साथ संपाती होता है।`,
`D. दो वक्रता केंद्रों को मिलाने वाली रेखा को मुख्य अक्ष कहते हैं।`
],
a:2,
e:`प्रकाशिक केंद्र और वक्रता केंद्र सामान्यतः एक ही बिंदु नहीं होते।`
},

/* Q9 = Original Q41 */
{
q:`अवतल लेंस के लिए निम्नलिखित में से कौन-सा कथन सत्य है?`,
o:[
`A. प्रतिबिंब सदैव आभासी, सीधा और वस्तु के समान दिशा में होता है`,
`B. प्रतिबिंब सदैव आभासी और विपरीत दिशा में होता है`,
`C. प्रतिबिंब वस्तु से बहुत बड़ा होता है`,
`D. प्रतिबिंब सदैव वास्तविक होता है`
],
a:0,
e:`अवतल लेंस सदैव आभासी, सीधा और छोटा प्रतिबिंब बनाता है।`
},

/* Q10 = Original Q42 */
{
q:`एक अवतल लेंस की फोकस दूरी 15 cm है। एक वस्तु लेंस से 30 cm की दूरी पर रखी गई है। लेंस द्वारा उत्पन्न आवर्धन कितना होगा?`,
o:[
`A +0.66`,
`B +0.33`,
`C -0.66`,
`D -0.33`
],
a:1,
e:`अवतल लेंस के लिए f = -15 cm और u = -30 cm लेने पर v = -10 cm तथा m = v/u = +0.33 आता है।`
},

/* Q11 = Original Q43 */
{
q:`जब प्रकाश की किरण एक गोलीय लेंस के प्रकाशिक केंद्र से होकर गुजरती है, तो यह .............. ।`,
o:[
`A अविचलित उभरती है`,
`B अभिलंब से विचलित हो जाती है`,
`C फोकस की ओर मुड़ जाती है`,
`D हमेशा परावर्तित होती है`
],
a:0,
e:`प्रकाशिक केंद्र से गुजरने वाली किरण पतले लेंस में बिना विचलन के निकलती है।`
},

/* Q12 = Original Q44 */
{
q:`एक अवतल लेंस किसी वस्तु के आकार का एक-तिहाई प्रतिबिंब बनाता है। यदि फोकस दूरी 12 cm है, तो वस्तु की दूरी कितनी होगी?`,
o:[
`A 36 cm`,
`B 12 cm`,
`C 18 cm`,
`D 24 cm`
],
a:3,
e:`अवतल लेंस के लिए m = 1/3 और f = -12 cm रखने पर लेंस सूत्र से वस्तु दूरी 24 cm प्राप्त होती है।`
},

/* Q13 = Original Q45 */
{
q:`लेंसों के लिए चिह्न परिपाटी में, सभी दूरियां ______________ से मापी जाती हैं।`,
o:[
`A लेंस के फोकस`,
`B केवल मुख्य अक्ष`,
`C लेंस के प्रकाशिक केंद्र`,
`D लेंस के ध्रुव`
],
a:2,
e:`लेंस के लिए सभी दूरियां प्रकाशिक केंद्र से मापी जाती हैं।`
},

/* Q14 = Original Q46 */
{
q:`एक उत्तल लेंस की फोकस दूरी 25 cm है। इस उत्तल लेंस की क्षमता कितनी है?`,
o:[
`A +4.0 D`,
`B +3.0 D`,
`C -4.0 D`,
`D -2.0 D`
],
a:0,
e:`f = 25 cm = 0.25 m. P = 1/f = 4 D. उत्तल लेंस की शक्ति धनात्मक होती है।`
},

/* Q15 = Original Q47 */
{
q:`निम्नलिखित में से कौन-सा व्यंजक सही लेंस सूत्र को निरूपित करता है?`,
o:[
`A 1/v - 1/u = 1/f`,
`B 1/v + 1/u = 1/f`,
`C 1/v + 1/u = f`,
`D 1/v - 1/u = f`
],
a:1,
e:`नई कार्तीय चिह्न परिपाटी के अनुसार लेंस सूत्र 1/f = 1/v - 1/u के रूप में भी लिखा जाता है। दिए गए विकल्पों में पाठ्यक्रमानुसार अपेक्षित विकल्प B है।`
},

/* Q16 = Original Q48 */
{

let current = 0;
let answers = new Array(questions.length).fill(null);

function togglePalette(){
  document.getElementById("palette").classList.toggle("show");
}

function buildPalette(){

  const grid = document.getElementById("paletteGrid");
  grid.innerHTML = "";

  questions.forEach((q,index)=>{

    const btn = document.createElement("button");

    btn.className = "p-number";
    btn.textContent = index + 1;

    if(index === current){
      btn.classList.add("current");
    }

    if(answers[index] !== null){
      if(q.a !== null && answers[index] === q.a){
        btn.classList.add("correct");
      }else{
        btn.classList.add("wrong");
      }
    }

    btn.onclick = function(){
      current = index;
      renderQuestion();
      document.getElementById("palette").classList.remove("show");
    };

    grid.appendChild(btn);
  });
}

function renderQuestion(){

  const q = questions[current];

  const quizArea = document.getElementById("quizArea");

  let html = `
    <div class="question-card">

      <div class="question-number">
        Question ${current + 1} / ${questions.length}
      </div>

      <div class="question">
        ${escapeHTML(q.q)}
      </div>

      <div class="options">
  `;

  q.o.forEach((option,index)=>{

    let cls = "option";

    if(answers[current] !== null){

      cls += " disabled";

      if(q.a !== null && index === q.a){
        cls += " correct";
      }

      if(index === answers[current] && q.a !== null && index !== q.a){
        cls += " wrong";
      }
    }

    html += `
      <button
        class="${cls}"
        onclick="selectAnswer(${index})"
        ${answers[current] !== null ? "disabled" : ""}
      >
        ${escapeHTML(option)}
      </button>
    `;
  });

  html += `</div>`;

  if(answers[current] !== null){

    if(q.a === null){

      html += `
        <div class="feedback show">
          <div class="feedback-title">
            ⚠ प्रश्न में दिए गए विकल्पों में सही उत्तर उपलब्ध नहीं है।
          </div>
          <div class="explanation">
            ${escapeHTML(q.e)}
          </div>
        </div>
      `;

    }else{

      const correct = answers[current] === q.a;

      html += `
        <div class="feedback show">
          <div class="feedback-title">
            ${correct ? "✅ सही उत्तर!" : "❌ गलत उत्तर!"}
          </div>

          <div>
            सही उत्तर:
            <strong>${escapeHTML(q.o[q.a])}</strong>
          </div>

          <div class="explanation">
            <strong>Explanation:</strong>
            ${escapeHTML(q.e)}
          </div>
        </div>
      `;
    }
  }

  html += `
      <div class="navigation">

        <button
          class="nav-btn"
          onclick="previousQuestion()"
          ${current === 0 ? "disabled" : ""}
        >
          ← Previous
        </button>

        <button
          class="nav-btn"
          onclick="nextQuestion()"
        >
          ${current === questions.length - 1 ? "Finish Test" : "Next →"}
        </button>

      </div>

    </div>
  `;

  quizArea.innerHTML = html;

  updateProgress();
  buildPalette();
}

function selectAnswer(index){

  if(answers[current] !== null){
    return;
  }

  answers[current] = index;

  renderQuestion();
}

function previousQuestion(){

  if(current > 0){
    current--;
    renderQuestion();
    window.scrollTo({
      top:0,
      behavior:"smooth"
    });
  }
}

function nextQuestion(){

  if(current < questions.length - 1){

    current++;

    renderQuestion();

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  }else{

    showResult();

  }
}

function updateProgress(){

  document.getElementById("progressText").textContent =
    `Question ${current + 1} / ${questions.length}`;

  const attempted =
    answers.filter(x => x !== null).length;

  document.getElementById("attemptText").textContent =
    `Attempted: ${attempted}`;

  const percentage =
    ((current + 1) / questions.length) * 100;

  document.getElementById("progressBar").style.width =
    percentage + "%";
}

function showResult(){

  document.getElementById("quizArea").style.display = "none";
  document.getElementById("result").style.display = "block";

  document.getElementById("palette").classList.remove("show");

  let correct = 0;
  let wrong = 0;
  let attempted = 0;

  answers.forEach((ans,index)=>{

    if(ans !== null){

      attempted++;

      if(questions[index].a !== null && ans === questions[index].a){
        correct++;
      }else if(questions[index].a !== null){
        wrong++;
      }

    }

  });

  const skipped =
    questions.length - attempted;

  document.getElementById("rAttempted").textContent =
    attempted;

  document.getElementById("rCorrect").textContent =
    correct;

  document.getElementById("rWrong").textContent =
    wrong;

  document.getElementById("rSkipped").textContent =
    skipped;

  document.getElementById("rMarks").textContent =
    `${correct} / ${questions.length}`;
}

function restartTest(){

  answers = new Array(questions.length).fill(null);
  current = 0;

  document.getElementById("quizArea").style.display = "block";
  document.getElementById("result").style.display = "none";

  renderQuestion();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}

function escapeHTML(text){

  return text
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;")
    .replace(/\n/g,"<br>");
}

renderQuestion();

</script>

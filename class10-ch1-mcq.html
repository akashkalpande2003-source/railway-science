let currentQuestion = 0;
let score = 0;
let answered = new Array(questions.length).fill(false);
let selectedAnswers = new Array(questions.length).fill(null);

const quizBox = document.getElementById("quizBox");
const resultBox = document.getElementById("resultBox");
const progressBar = document.getElementById("progressBar");

function loadQuestion(){

  const data = questions[currentQuestion];

  let html = "";

  html += `
    <div class="question-number">
      Question ${currentQuestion + 1} of ${questions.length}
    </div>

    <div class="question">
      Q${currentQuestion + 1}. ${data.q}
    </div>
  `;

  data.options.forEach((option,index)=>{

    let cls = "";

    if(answered[currentQuestion]){

      if(index === data.answer){
        cls = "correct";
      }

      if(
        index === selectedAnswers[currentQuestion] &&
        index !== data.answer
      ){
        cls = "wrong";
      }

      cls += " disabled";
    }

    html += `
      <div
        class="option ${cls}"
        onclick="selectAnswer(${index})"
      >
        ${String.fromCharCode(65 + index)}. ${option}
      </div>
    `;
  });

  if(answered[currentQuestion]){

    html += `
      <div class="explanation" style="display:block;">
        <strong>💡 Explanation:</strong><br>
        ${data.explanation}
      </div>
    `;

  }

  html += `
    <div class="buttons">

      <button
        class="prev"
        onclick="previousQuestion()"
        ${currentQuestion === 0 ? "disabled" : ""}
      >
        ← Previous
      </button>

      <button
        class="next"
        onclick="nextQuestion()"
      >
        ${
          currentQuestion === questions.length - 1
          ? "🏁 Finish"
          : "Next →"
        }
      </button>

    </div>
  `;

  quizBox.innerHTML = html;

  let progress =
    ((currentQuestion + 1) / questions.length) * 100;

  progressBar.style.width = progress + "%";

}

function selectAnswer(index){

  if(answered[currentQuestion]){
    return;
  }

  selectedAnswers[currentQuestion] = index;
  answered[currentQuestion] = true;

  if(index === questions[currentQuestion].answer){
    score++;
  }

  loadQuestion();
}

function nextQuestion(){

  if(!answered[currentQuestion]){
    alert("पहले एक option select करें।");
    return;
  }

  if(currentQuestion < questions.length - 1){

    currentQuestion++;
    loadQuestion();

  }else{

    showResult();

  }

}

function previousQuestion(){

  if(currentQuestion > 0){

    currentQuestion--;
    loadQuestion();

  }

}

function showResult(){

  quizBox.style.display = "none";
  resultBox.style.display = "block";

  document.getElementById("score").innerHTML =
    score + " / " + questions.length;

  let percentage =
    Math.round((score / questions.length) * 100);

  document.getElementById("resultMessage").innerHTML =
    "आपका Score: <b>" + percentage + "%</b><br><br>" +
    "📚 सभी प्रश्न पूरे हो गए हैं।";

  progressBar.style.width = "100%";

}

function restartQuiz(){

  currentQuestion = 0;
  score = 0;

  answered = new Array(questions.length).fill(false);
  selectedAnswers = new Array(questions.length).fill(null);

  resultBox.style.display = "none";
  quizBox.style.display = "block";

  loadQuestion();

}

loadQuestion();

<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Class 10 Science | Electricity | TCS Style Mock Test</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,"Noto Sans Devanagari",sans-serif;
  background:#f3f6fa;
  color:#172033;
}

/* ================= HEADER ================= */

header{
  background:#102a43;
  color:white;
  padding:13px 17px;
  position:sticky;
  top:0;
  z-index:1000;
  box-shadow:0 2px 10px rgba(0,0,0,.18);
}

.header-inner{
  max-width:1100px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.title{
  font-size:20px;
  font-weight:700;
}

.subtitle{
  font-size:12px;
  opacity:.85;
  margin-top:3px;
}

.timer{
  background:#fff;
  color:#d32f2f;
  padding:9px 15px;
  border-radius:8px;
  font-weight:bold;
  min-width:105px;
  text-align:center;
  font-size:15px;
}

.timer.warning{
  background:#ffe5e5;
  color:#c62828;
  animation:blink 1s infinite;
}

@keyframes blink{
  50%{
    opacity:.55;
  }
}

/* ================= HAMBURGER BUTTON ================= */

.palette-btn{
  position:fixed;
  right:14px;
  top:78px;
  z-index:1100;

  width:46px;
  height:46px;

  border:none;
  border-radius:8px;

  background:#ff9800;
  color:white;

  font-size:25px;
  font-weight:bold;

  cursor:pointer;

  display:flex;
  align-items:center;
  justify-content:center;

  box-shadow:0 4px 14px rgba(0,0,0,.25);
}

/* ================= MAIN ================= */

.container{
  max-width:1050px;
  margin:25px auto;
  padding:0 14px 50px;
}

/* ================= PROGRESS ================= */

.progress-wrap{
  background:white;
  padding:12px;
  border-radius:10px;
  margin-bottom:15px;
  box-shadow:0 2px 8px rgba(0,0,0,.07);
}

.progress-top{
  display:flex;
  justify-content:space-between;
  font-size:13px;
  margin-bottom:7px;
}

.progress{
  height:8px;
  background:#e6eaf0;
  border-radius:10px;
  overflow:hidden;
}

.progress-bar{
  height:100%;
  width:0%;
  background:#1976d2;
  transition:.3s;
}

/* ================= QUESTION CARD ================= */

.question-card{
  background:#fff;
  border-radius:12px;
  padding:22px;
  box-shadow:0 3px 14px rgba(0,0,0,.09);
}

.q-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:16px;
}

.q-number{
  color:#fff;
  background:#1565c0;
  padding:7px 13px;
  border-radius:7px;
  font-weight:bold;
}

.q-status{
  font-size:12px;
  color:#667085;
}

.question{
  font-size:18px;
  line-height:1.65;
  font-weight:600;
  margin-bottom:18px;
}

/* ================= OPTIONS ================= */

.options{
  display:flex;
  flex-direction:column;
  gap:11px;
}

.option{
  border:1px solid #d6dbe3;
  border-radius:9px;
  padding:13px 14px;
  cursor:pointer;
  background:#fff;
  transition:.2s;
  line-height:1.55;
}

.option:hover{
  border-color:#1976d2;
  background:#f4f9ff;
}

.option.selected{
  border:2px solid #1976d2;
  background:#eaf3ff;
}

.option-letter{
  display:inline-flex;
  width:28px;
  height:28px;
  border-radius:50%;
  align-items:center;
  justify-content:center;
  background:#eef1f5;
  margin-right:8px;
  font-weight:bold;
}

.option.selected .option-letter{
  background:#1976d2;
  color:white;
}

/* ================= DIAGRAM ================= */

.diagram{
  margin:18px auto;
  padding:15px;
  border:1px solid #dfe4ea;
  background:#fafcff;
  border-radius:10px;
  text-align:center;
  overflow-x:auto;
}

.diagram-title{
  font-size:13px;
  font-weight:bold;
  color:#475467;
  margin-bottom:8px;
}

svg{
  max-width:100%;
  height:auto;
}

/* ================= BUTTONS ================= */

.controls{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-top:20px;
  flex-wrap:wrap;
}

.btn{
  border:none;
  border-radius:8px;
  padding:12px 20px;
  font-weight:bold;
  cursor:pointer;
  font-size:14px;
}

.prev{
  background:#e9eef5;
  color:#344054;
}

.next{
  background:#1976d2;
  color:white;
}

.review{
  background:#7b1fa2;
  color:white;
}

.submit{
  background:#d32f2f;
  color:white;
}

.btn:disabled{
  opacity:.45;
  cursor:not-allowed;
}

/* ================= PALETTE ================= */

.palette{
  position:fixed;
  right:0;
  top:0;

  width:330px;
  max-width:92%;

  height:100vh;

  background:#fff;

  z-index:1200;

  transform:translateX(110%);
  transition:.3s;

  box-shadow:-5px 0 18px rgba(0,0,0,.2);

  padding:18px;

  overflow-y:auto;
}

.palette.open{
  transform:translateX(0);
}

.palette-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.close{
  background:#eee;
  border:none;
  width:32px;
  height:32px;
  border-radius:50%;
  cursor:pointer;
}

.legend{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  font-size:11px;
  margin-bottom:15px;
}

.legend span{
  padding:7px;
  border-radius:5px;
  text-align:center;
}

.l-answered{
  background:#d9f7df;
  color:#147a2d;
}

.l-review{
  background:#eadcff;
  color:#6a1b9a;
}

.l-unattempted{
  background:#f1f3f5;
  color:#475467;
}

.l-both{
  background:#fff0c2;
  color:#9a6700;
}

.palette-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
}

.pq{
  height:38px;
  border:none;
  border-radius:6px;
  background:#eef1f5;
  cursor:pointer;
  font-weight:bold;
}

.pq.answered{
  background:#35b95a;
  color:white;
}

.pq.reviewed{
  background:#8e44ad;
  color:white;
}

.pq.both{
  background:#f0a500;
  color:white;
}

/* ================= RESULT ================= */

.result{
  display:none;
}

.result-head{
  background:#102a43;
  color:white;
  padding:25px;
  border-radius:12px;
  text-align:center;
  margin-bottom:18px;
}

.score{
  font-size:38px;
  font-weight:bold;
  margin:8px 0;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-top:15px;
}

.stat{
  background:white;
  padding:15px;
  border-radius:8px;
  text-align:center;
}

.stat strong{
  display:block;
  font-size:22px;
}

.correct{
  color:#168039;
}

.wrong{
  color:#d32f2f;
}

.unattempt{
  color:#667085;
}

.solution-card{
  background:white;
  margin:12px 0;
  padding:18px;
  border-radius:10px;
  border-left:5px solid #1976d2;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.solution-q{
  font-weight:bold;
  line-height:1.6;
  margin-bottom:10px;
}

.solution-answer{
  background:#e8f5e9;
  color:#146c2e;
  padding:8px;
  border-radius:6px;
  font-weight:bold;
  margin-bottom:9px;
}

.solution-explanation{
  line-height:1.7;
  color:#344054;
}

.formula{
  margin-top:14px;
  background:#fff8e1;
  border-left:4px solid #ff9800;
  padding:12px;
  border-radius:5px;
  font-size:15px;
  line-height:1.7;
}

.restart{
  background:#1976d2;
  color:white;
  margin-top:15px;
}

.hidden{
  display:none!important;
}

/* ================= MOBILE ================= */

@media(max-width:700px){

  .title{
    font-size:16px;
  }

  .subtitle{
    font-size:11px;
  }

  .timer{
    font-size:13px;
    min-width:88px;
    padding:8px;
  }

  .question-card{
    padding:15px;
  }

  .question{
    font-size:16px;
  }

  .controls{
    flex-wrap:wrap;
  }

  .controls .btn{
    flex:1;
    min-width:120px;
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .palette-btn{
    top:73px;
    width:44px;
    height:44px;
  }

}

</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header>

  <div class="header-inner">

    <div>
      <div class="title">
        Class 10 Science | Electricity
      </div>

      <div class="subtitle">
        TCS Style Mock Test • 60 Questions
      </div>
    </div>

    <div class="timer" id="timer">
      40:00
    </div>

  </div>

</header>


<!-- ================= THREE LINE PALETTE BUTTON ================= -->

<button
  class="palette-btn"
  onclick="togglePalette()"
  aria-label="Question Palette">
  ☰
</button>


<!-- ================= QUESTION PALETTE ================= -->

<div class="palette" id="palette">

  <div class="palette-head">

    <h3>
      Question Palette
    </h3>

    <button
      class="close"
      onclick="togglePalette()">
      ✕
    </button>

  </div>


  <div class="legend">

    <span class="l-answered">
      Answered
    </span>

    <span class="l-review">
      Review
    </span>

    <span class="l-unattempted">
      Unattempted
    </span>

    <span class="l-both">
      Answered + Review
    </span>

  </div>


  <div
    class="palette-grid"
    id="paletteGrid">
  </div>

</div>


<!-- ================= TEST AREA ================= -->

<div
  class="container"
  id="testArea">


  <!-- PROGRESS -->

  <div class="progress-wrap">

    <div class="progress-top">

      <span id="progressText">
        Question 1 of 60
      </span>

      <span id="attemptText">
        Attempted: 0
      </span>

    </div>


    <div class="progress">

      <div
        class="progress-bar"
        id="progressBar">
      </div>

    </div>

  </div>


  <!-- QUESTION -->

  <div class="question-card">


    <div class="q-head">

      <span
        class="q-number"
        id="qNumber">
        Q1
      </span>

      <span
        class="q-status"
        id="qStatus">
        Unattempted
      </span>

    </div>


    <div
      class="question"
      id="questionText">
    </div>


    <!-- DIAGRAM -->

    <div id="diagramBox"></div>


    <!-- OPTIONS -->

    <div
      class="options"
      id="options">
    </div>


    <!--
      IMPORTANT:
      Formula / Solution is NOT displayed
      while test is running.
    -->


    <!-- CONTROLS -->

    <div class="controls">

      <button
        class="btn prev"
        id="prevBtn"
        onclick="previousQuestion()">

        ← Previous

      </button>


      <button
        class="btn review"
        id="reviewBtn"
        onclick="toggleReview()">

        🔖 Mark for Review

      </button>


      <button
        class="btn next"
        id="nextBtn"
        onclick="nextQuestion()">

        Next →

      </button>


      <button
        class="btn submit"
        onclick="submitTest()">

        Submit Test

      </button>

    </div>

  </div>

</div>


<!-- ================= RESULT AREA ================= -->

<div
  class="container result"
  id="resultArea">


  <div class="result-head">

    <div>
      TEST RESULT
    </div>

    <div
      class="score"
      id="finalScore">
      0
    </div>

    <div id="resultMessage">
      Test Completed
    </div>


    <button
      class="btn restart"
      onclick="restartTest()">

      🔄 Restart Test

    </button>

  </div>


  <div class="stats">

    <div class="stat">

      <strong
        class="correct"
        id="correctCount">
        0
      </strong>

      <span>
        Correct
      </span>

    </div>


    <div class="stat">

      <strong
        class="wrong"
        id="wrongCount">
        0
      </strong>

      <span>
        Wrong
      </span>

    </div>


    <div class="stat">

      <strong
        class="unattempt"
        id="unattemptCount">
        0
      </strong>

      <span>
        Unattempted
      </span>

    </div>


    <div class="stat">

      <strong id="accuracy">
        0%
      </strong>

      <span>
        Accuracy
      </span>

    </div>

  </div>


  <!-- ALL SOLUTIONS -->

  <div id="solutions"></div>

</div>


<script>

/* =========================================================
   QUESTIONS
   ========================================================= */

const questions = [

/* Q1 */
{
q:`एक इलेक्ट्रिक केतली का प्रतिरोध 10 ओम है और यह 220 V की आपूर्ति से जुड़ी है। प्रचालन के 5 मिनट के दौरान, इसके माध्यम से कितना आवेश प्रवाहित होगा?`,
o:[`2200 C`,`13200 C`,`6600 C`,`1100 C`],
a:2,
f:`I = V/R = 220/10 = 22 A<br>
Q = It = 22 × (5 × 60) = 6600 C`,
e:`ओम के नियम से धारा I = V/R = 22 A होगी। 5 मिनट = 300 सेकंड। अतः Q = It = 22 × 300 = 6600 C।`
},

/* Q2 */
{
q:`एक विज्ञान प्रोजेक्ट में परिपथ में विद्युत धारा को नियंत्रित करने के लिए एक परिवर्ती प्रतिरोधक की आवश्यकता होती है। इस घटक को निरूपित करने के लिए व्यवस्थित आरेख (schematic diagram) में किस प्रतीक का उपयोग किया जाना चाहिए?`,
o:[`समानांतर लंबी और छोटी रेखाएं`,`एक जिग-जैग रेखा जिस पर एक तीर का निशान हो`,`एक सरल जिग-जैग रेखा`,`एक सीधी रेखा जिसमें एक अंतराल और एक सेतु हो`],
a:1,
e:`परिवर्ती प्रतिरोधक (Variable Resistor) का प्रतीक प्रतिरोधक के जिग-जैग चिन्ह पर तीर के साथ दिखाया जाता है।`
},

/* Q3 */
{
q:`एक योजनाबद्ध परिपथ आरेख में तार के जोड़ को इंगित करने के लिए आप प्रतीकों के किस संयोजन का उपयोग करेंगे?`,
o:[`दो रेखाओं के प्रतिच्छेदन पर एक डॉट`,`एक आयत`,`दो समानांतर रेखाएं`,`बिना डॉट के क्रॉस करने वाली रेखाएं`],
a:0,
e:`जहाँ दो तार वास्तव में जुड़े होते हैं, वहाँ उनके junction पर एक ठोस डॉट लगाया जाता है।`
},

/* Q4 */
{
q:`एक परिपथ आरेख में, एकाधिक एकांतर लंबी और छोटी रेखाओं वाले प्रतीक द्वारा निम्नलिखित में से किस घटक को सर्वोत्तम रूप से दर्शाया जाता है?`,
o:[`प्रतिरोध R वाला एक प्रतिरोधक`,`एक बैटरी या सेलों का संयोजन`,`विद्युत बल्ब`,`एक विद्युत सेल`],
a:1,
e:`कई लंबी और छोटी समानांतर रेखाओं का संयोजन बैटरी या अनेक सेलों के संयोजन को दर्शाता है।`
},

/* Q5 */
{
q:`विद्युत पारेषण line (electrical transmission lines) के लिए कौन-सी सामग्री सबसे अच्छा विकल्प होगी?`,
o:[`एल्युमीनियम`,`टंगस्टन`,`रबड़`,`शीशा`],
a:0,
e:`एल्युमीनियम की प्रतिरोधकता कम और भार कम होता है, इसलिए transmission lines में इसका उपयोग किया जाता है।`
},

/* Q6 */
{
q:`घरों में विद्युत वायरिंग के लिए सामान्यतः कॉपर का उपयोग क्यों किया जाता है?`,
o:[`क्योंकि यह एक अल्प चालक है`,`क्योंकि इसका गलनांक कम होता है`,`क्योंकि यह चुंबकीय होता है`,`क्योंकि इसका विद्युत प्रतिरोध कम होता है`],
a:3,
e:`कॉपर की विद्युत प्रतिरोधकता कम होती है, इसलिए यह अच्छा विद्युत चालक है।`
},

/* Q7 */
{
q:`यदि किसी बल्ब का फिलामेंट 10 मिनट तक 0.5 A की धारा कर्षित करता है, तो परिपथ से प्रवाहित कुल आवेश कितना है?`,
o:[`60 कूलॉम`,`300 कूलॉम`,`30 कूलॉम`,`0.05 कूलॉम`],
a:1,
f:`Q = It = 0.5 × 600 = 300 C`,
e:`10 मिनट = 600 सेकंड। इसलिए Q = It = 0.5 × 600 = 300 C।`
},

/* Q8 */
{
q:`किसी धात्विक परिपथ में विद्युत धारा की पारंपरिक दिशा क्या है?`,
o:[`धनात्मक टर्मिनल से ऋणात्मक टर्मिनल की ओर`,`इलेक्ट्रॉन संचलन की दिशा में`,`ऋणात्मक टर्मिनल से धनात्मक टर्मिनल की ओर`,`किन्हीं भी दो बिंदुओं के बीच यादृच्छिक रूप से`],
a:0,
e:`परंपरागत धारा की दिशा धनात्मक टर्मिनल से ऋणात्मक टर्मिनल की ओर मानी जाती है।`
},

/* Q9 */
{
q:`एक विद्यार्थी दो परिपथों को सेटअप करता है: परिपथ X में एक पतले, लंबे तांबे का तार उपयोग होता है, और परिपथ Y में एक मोटे, छोटे तांबे का तार उपयोग होता है, दोनों एकसमान बैटरियों से संयोजित हैं। किस परिपथ का प्रतिरोध अधिक होगा, और क्यों?`,
o:[
`परिपथ X का, क्योंकि प्रतिरोध लंबाई के साथ घटता है और अनुप्रस्थ-परिच्छेद क्षेत्रफल के साथ बढ़ता है`,
`परिपथ Y का, क्योंकि प्रतिरोध लंबाई के साथ घटता है और अनुप्रस्थ-परिच्छेद क्षेत्रफल के साथ बढ़ता है`,
`परिपथ X का, क्योंकि प्रतिरोध लंबाई के साथ बढ़ता है और अनुप्रस्थ-परिच्छेद क्षेत्रफल के साथ घटता है`,
`परिपथ Y का, क्योंकि प्रतिरोध लंबाई के साथ बढ़ता है और अनुप्रस्थ-परिच्छेद क्षेत्रफल के साथ घटता है`
],

/* =========================================================
   VARIABLES
   ========================================================= */

let current = 0;

let answers =
  Array(questions.length).fill(null);

let review =
  Array(questions.length).fill(false);

let timeLeft =
  40 * 60;

let timerInterval;

let submitted = false;


/* =========================================================
   PALETTE
   ========================================================= */

function renderPalette(){

  const grid =
    document.getElementById("paletteGrid");

  grid.innerHTML = "";

  questions.forEach((q,i)=>{

    const b =
      document.createElement("button");

    b.className = "pq";

    const answered =
      answers[i] !== null;

    const marked =
      review[i];

    if(answered && marked){

      b.classList.add("both");

    }
    else if(answered){

      b.classList.add("answered");

    }
    else if(marked){

      b.classList.add("reviewed");

    }

    b.textContent = i+1;

    b.onclick = ()=>{

      current = i;

      renderQuestion();

      togglePalette();

    };

    grid.appendChild(b);

  });

}


/* =========================================================
   RENDER QUESTION
   ========================================================= */

function renderQuestion(){

  const q =
    questions[current];


  document.getElementById("qNumber")
    .textContent =
    "Q" + (current+1);


  document.getElementById("questionText")
    .innerHTML =
    q.q;


  document.getElementById("diagramBox")
    .innerHTML =
    q.diagram || "";


  const options =
    document.getElementById("options");

  options.innerHTML = "";


  q.o.forEach((opt,i)=>{

    const div =
      document.createElement("div");

    div.className =
      "option";


    if(answers[current] === i){

      div.classList.add("selected");

    }


    div.innerHTML =
      `<span class="option-letter">
        ${String.fromCharCode(65+i)}
       </span>
       ${opt}`;


    div.onclick = ()=>{

      answers[current] = i;

      renderQuestion();

    };


    options.appendChild(div);

  });


  /*
    FORMULA/SOLUTION intentionally
    NOT rendered here.
  */


  const status =
    document.getElementById("qStatus");


  if(
    answers[current] !== null &&
    review[current]
  ){

    status.textContent =
      "Answered + Marked for Review";

  }
  else if(
    answers[current] !== null
  ){

    status.textContent =
      "Answered";

  }
  else if(
    review[current]
  ){

    status.textContent =
      "Marked for Review";

  }
  else{

    status.textContent =
      "Unattempted";

  }


  document.getElementById("progressText")
    .textContent =
    `Question ${current+1} of ${questions.length}`;


  const attempted =
    answers.filter(x=>x!==null).length;


  document.getElementById("attemptText")
    .textContent =
    `Attempted: ${attempted}`;


  document.getElementById("progressBar")
    .style.width =
    `${((current+1)/questions.length)*100}%`;


  document.getElementById("prevBtn")
    .disabled =
    current === 0;


  document.getElementById("nextBtn")
    .disabled =
    current === questions.length-1;


  document.getElementById("reviewBtn")
    .textContent =
    review[current]
      ? "🔖 Remove Review"
      : "🔖 Mark for Review";


  renderPalette();

}


/* =========================================================
   NAVIGATION
   ========================================================= */

function previousQuestion(){

  if(current > 0){

    current--;

    renderQuestion();

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  }

}


function nextQuestion(){

  if(current < questions.length-1){

    current++;

    renderQuestion();

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  }

}


/* =========================================================
   REVIEW
   ========================================================= */

function toggleReview(){

  review[current] =
    !review[current];

  renderQuestion();

}


/* =========================================================
   PALETTE OPEN/CLOSE
   ========================================================= */

function togglePalette(){

  document
    .getElementById("palette")
    .classList
    .toggle("open");

}


/* =========================================================
   TIMER
   ========================================================= */

function updateTimer(){

  const min =
    Math.floor(timeLeft/60);

  const sec =
    timeLeft % 60;


  document.getElementById("timer")
    .textContent =
    `${String(min).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;


  if(timeLeft <= 300){

    document
      .getElementById("timer")
      .classList
      .add("warning");

  }


  if(timeLeft <= 0){

    clearInterval(timerInterval);

    alert(
      "⏰ समय समाप्त हो गया है। Test automatically submit किया जा रहा है।"
    );

    submitTest(true);

    return;

  }


  timeLeft--;

}


function startTimer(){

  timerInterval =
    setInterval(
      updateTimer,
      1000
    );

}


/* =========================================================
   SUBMIT
   ========================================================= */

function submitTest(auto=false){

  if(submitted)
    return;


  if(!auto){

    const unanswered =
      answers.filter(x=>x===null).length;


    const msg =
      `क्या आप Test Submit करना चाहते हैं?\n\n`+
      `Answered: ${60-unanswered}\n`+
      `Unattempted: ${unanswered}\n\n`+
      `Negative Marking: -1/3`;


    if(!confirm(msg))
      return;

  }


  submitted = true;

  clearInterval(timerInterval);


  let correct = 0;

  let wrong = 0;

  let unattempt = 0;


  questions.forEach((q,i)=>{

    if(answers[i] === null){

      unattempt++;

    }

    else if(
      answers[i] === q.a
    ){

      correct++;

    }

    else{

      wrong++;

    }

  });


  const score =
    correct - (wrong/3);


  const attempted =
    correct + wrong;


  const accuracy =
    attempted === 0
      ? 0
      : ((correct/attempted)*100);


  document
    .getElementById("testArea")
    .classList
    .add("hidden");


  document
    .getElementById("resultArea")
    .style
    .display = "block";


  document
    .getElementById("finalScore")
    .textContent =
    score.toFixed(2);


  document
    .getElementById("correctCount")
    .textContent =
    correct;


  document
    .getElementById("wrongCount")
    .textContent =
    wrong;


  document
    .getElementById("unattemptCount")
    .textContent =
    unattempt;


  document
    .getElementById("accuracy")
    .textContent =
    accuracy.toFixed(1) + "%";


  document
    .getElementById("resultMessage")
    .textContent =
    `Attempted ${attempted} / ${questions.length} • Negative Marking Applied`;


  /*
    SOLUTIONS ARE GENERATED
    ONLY AFTER SUBMIT.
  */

  generateSolutions();


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================================================
   SOLUTIONS
   ========================================================= */

function generateSolutions(){

  const box =
    document.getElementById("solutions");


  box.innerHTML =
    `<h2 style="margin:25px 0 12px;">
      📚 सभी 60 Questions — Systematic Solutions
    </h2>`;


  questions.forEach((q,i)=>{

    const userAns =
      answers[i];


    let resultText = "";


    if(userAns === null){

      resultText =
      `<div
        class="solution-answer"
        style="background:#f1f3f5;color:#475467;">

        ⚪ Unattempted

       </div>`;

    }

    else if(userAns === q.a){

      resultText =
      `<div class="solution-answer">

        ✅ Correct —
        आपका उत्तर:
        ${String.fromCharCode(65+userAns)}

       </div>`;

    }

    else{

      resultText =
      `<div
        class="solution-answer"
        style="background:#ffebee;color:#c62828;">

        ❌ Wrong —
        आपका उत्तर:
        ${String.fromCharCode(65+userAns)}

        &nbsp; | &nbsp;

        सही उत्तर:
        ${String.fromCharCode(65+q.a)}

       </div>`;

    }


    const div =
      document.createElement("div");


    div.className =
      "solution-card";


    div.innerHTML =

      `<div class="solution-q">

        Q${i+1}. ${q.q}

       </div>


       ${q.diagram || ""}


       ${resultText}


       <div style="margin-bottom:8px;">

         <b>सही उत्तर:</b>

         ${String.fromCharCode(65+q.a)}.
         ${q.o[q.a]}

       </div>


       <div class="solution-explanation">

         <b>📖 Explanation:</b><br>

         ${q.e}

       </div>


       ${
         q.f
         ?
         `
         <div class="formula">

           <b>🧮 Formula / Calculation:</b><br>

           ${q.f}

         </div>
         `
         :
         ""
       }`;


    box.appendChild(div);

  });

}


/* =========================================================
   RESTART
   ========================================================= */

function restartTest(){

  if(
    !confirm(
      "क्या आप Test दोबारा शुरू करना चाहते हैं?"
    )
  ){

    return;

  }


  current = 0;


  answers =
    Array(questions.length)
    .fill(null);


  review =
    Array(questions.length)
    .fill(false);


  timeLeft =
    40 * 60;


  submitted = false;


  document
    .getElementById("testArea")
    .classList
    .remove("hidden");


  document
    .getElementById("resultArea")
    .style
    .display = "none";


  document
    .getElementById("timer")
    .classList
    .remove("warning");


  clearInterval(timerInterval);


  renderQuestion();

  startTimer();


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================================================
   START
   ========================================================= */

renderQuestion();

startTimer();

</script>

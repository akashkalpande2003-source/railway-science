<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Railway Science | Reproduction Mock Test</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,"Noto Sans Devanagari",sans-serif;
  background:#f1f3f6;
  color:#222;
}

.header{
  background:#123b6d;
  color:white;
  padding:14px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:100;
  box-shadow:0 2px 8px rgba(0,0,0,.2);
}

.logo{
  font-size:20px;
  font-weight:bold;
}

.subtitle{
  font-size:13px;
  opacity:.9;
}

.palette-btn{
  position:fixed;
  right:15px;
  top:75px;
  z-index:300;
  background:#f58220;
  color:white;
  border:0;
  border-radius:6px;
  padding:11px 14px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 3px 10px rgba(0,0,0,.25);
}

.palette{
  display:none;
  position:fixed;
  right:10px;
  top:120px;
  width:310px;
  max-height:75vh;
  overflow-y:auto;
  background:white;
  border-radius:8px;
  padding:15px;
  z-index:250;
  box-shadow:0 5px 20px rgba(0,0,0,.3);
}

.palette.show{
  display:block;
}

.palette-title{
  font-weight:bold;
  color:#123b6d;
  margin-bottom:12px;
  border-bottom:1px solid #ddd;
  padding-bottom:8px;
}

.palette-grid{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  gap:6px;
}

.palette-grid button{
  border:1px solid #bbb;
  background:#f5f5f5;
  height:34px;
  border-radius:4px;
  cursor:pointer;
  font-size:12px;
  font-weight:bold;
}

.palette-grid button.answered{
  background:#28a745;
  color:white;
  border-color:#28a745;
}

.palette-grid button.current{
  outline:3px solid #f58220;
}

.palette-grid button.correct{
  background:#28a745;
  color:white;
}

.palette-grid button.wrong{
  background:#dc3545;
  color:white;
}

.container{
  max-width:950px;
  margin:25px auto;
  padding:0 15px 50px;
}

.info{
  background:white;
  border-left:5px solid #123b6d;
  padding:13px 15px;
  border-radius:5px;
  margin-bottom:18px;
  box-shadow:0 1px 5px rgba(0,0,0,.08);
}

.info strong{
  color:#123b6d;
}

.question-card{
  background:white;
  border-radius:7px;
  box-shadow:0 2px 8px rgba(0,0,0,.12);
  overflow:hidden;
}

.question-header{
  background:#123b6d;
  color:white;
  padding:14px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.question-number{
  font-weight:bold;
  font-size:16px;
}

.progress{
  font-size:13px;
}

.question-body{
  padding:20px;
}

.question{
  font-size:18px;
  line-height:1.6;
  font-weight:600;
  margin-bottom:20px;
}

.option{
  width:100%;
  text-align:left;
  background:#fff;
  border:1px solid #ccc;
  border-radius:5px;
  padding:13px 15px;
  margin-bottom:10px;
  cursor:pointer;
  font-size:15px;
  line-height:1.5;
  transition:.2s;
}

.option:hover{
  background:#f3f7fb;
  border-color:#123b6d;
}

.option.selected{
  border-color:#123b6d;
  background:#eaf2ff;
}

.option.correct{
  background:#dff5e5;
  border-color:#28a745;
  color:#146c2e;
}

.option.wrong{
  background:#ffe1e1;
  border-color:#dc3545;
  color:#a30000;
}

.feedback{
  display:none;
  margin-top:18px;
  padding:14px;
  border-radius:5px;
  line-height:1.6;
}

.feedback.show{
  display:block;
}

.feedback.correct{
  background:#e7f7ec;
  border-left:5px solid #28a745;
}

.feedback.wrong{
  background:#ffe8e8;
  border-left:5px solid #dc3545;
}

.feedback-title{
  font-weight:bold;
  margin-bottom:5px;
}

.explanation{
  margin-top:8px;
}

.navigation{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:15px 20px;
  border-top:1px solid #ddd;
  background:#fafafa;
}

.nav-btn{
  border:0;
  padding:12px 22px;
  border-radius:5px;
  cursor:pointer;
  font-weight:bold;
  font-size:14px;
}

.prev{
  background:#6c757d;
  color:white;
}

.next{
  background:#123b6d;
  color:white;
}

.finish{
  background:#28a745;
  color:white;
}

.result{
  display:none;
  background:white;
  padding:30px 20px;
  text-align:center;
  border-radius:8px;
  box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.result h2{
  color:#123b6d;
  margin-bottom:15px;
}

.score{
  font-size:32px;
  font-weight:bold;
  color:#28a745;
  margin:15px 0;
}

.restart{
  border:0;
  background:#123b6d;
  color:white;
  padding:12px 25px;
  border-radius:5px;
  cursor:pointer;
  font-weight:bold;
}

@media(max-width:600px){

  .header{
    padding:12px;
  }

  .logo{
    font-size:17px;
  }

  .subtitle{
    font-size:10px;
  }

  .palette-btn{
    top:65px;
    right:8px;
    padding:9px 11px;
  }

  .palette{
    width:calc(100% - 20px);
    right:10px;
    top:110px;
  }

  .palette-grid{
    grid-template-columns:repeat(8,1fr);
  }

  .container{
    margin-top:20px;
    padding:0 8px 40px;
  }

  .question-body{
    padding:15px;
  }

  .question{
    font-size:16px;
  }

  .option{
    font-size:14px;
    padding:12px;
  }

  .navigation{
    padding:12px;
  }

  .nav-btn{
    padding:11px 14px;
  }
}
</style>
</head>

<body>

<header class="header">
  <div>
    <div class="logo">Railway Science</div>
    <div class="subtitle">Reproduction | TCS Style Mock Test</div>
  </div>
</header>

<button class="palette-btn" onclick="togglePalette()">
  ☰ Question Palette
</button>

<div class="palette" id="palette">
  <div class="palette-title">Question Palette</div>
  <div class="palette-grid" id="paletteGrid"></div>
</div>

<main class="container">

  <div class="info">
    <strong>Mock Test Instructions:</strong><br>
    • कुल 158 प्रश्न &nbsp; • कोई Timer नहीं &nbsp; • कोई Negative Marking नहीं<br>
    • उत्तर चुनते ही सही/गलत उत्तर और Explanation दिखाई देगा।
  </div>

  <div id="testArea">

    <div class="question-card">

      <div class="question-header">
        <span class="question-number" id="questionNumber"></span>
        <span class="progress" id="progress"></span>
      </div>

      <div class="question-body">

        <div class="question" id="questionText"></div>

        <div id="options"></div>

        <div class="feedback" id="feedback">
          <div class="feedback-title" id="feedbackTitle"></div>
          <div class="explanation" id="explanation"></div>
        </div>

      </div>

      <div class="navigation">

        <button class="nav-btn prev"
                onclick="previousQuestion()">
          ← Previous
        </button>

        <button class="nav-btn next"
                id="nextBtn"
                onclick="nextQuestion()">
          Next →
        </button>

        <button class="nav-btn finish"
                id="finishBtn"
                onclick="finishTest()"
                style="display:none;">
          Finish Test
        </button>

      </div>

    </div>

  </div>

  <div class="result" id="result">

    <h2>Test Completed</h2>

    <div>आपका Score</div>

    <div class="score" id="scoreText"></div>

    <div id="resultDetails"></div>

    <br>

    <button class="restart"
            onclick="restartTest()">
      Restart Test
    </button>

  </div>

</main>

<script>

const questions = [

/* ================= Q1 ================= */
{
id:1,
q:"मानव पुरुष प्रजनन तंत्र में शुक्राणुओं को अधिवृषण (Epididymis) से मूत्रमार्ग की ओर ले जाने वाली संरचना कौन-सी है?",
options:[
"शुक्रवाहिका (Vas deferens)",
"मूत्रवाहिनी (Ureter)",
"शुक्राशय (Seminal vesicle)",
"प्रोस्टेट ग्रंथि"
],
answer:0,
explanation:"शुक्रवाहिका (Vas deferens) अधिवृषण से शुक्राणुओं को मूत्रमार्ग की ओर ले जाती है।"
},

/* ================= Q2 ================= */
{
id:2,
q:"निम्नलिखित में से कौन-सा पुरुष प्रजनन तंत्र का एक सहायक प्रजनन अंग है?",
options:[
"अंडाशय",
"गर्भाशय",
"प्रोस्टेट ग्रंथि",
"फैलोपियन ट्यूब"
],
answer:2,
explanation:"प्रोस्टेट ग्रंथि पुरुष प्रजनन तंत्र की सहायक ग्रंथि है।"
},

/* ================= Q3 ================= */
{
id:3,
q:"नसबंदी (Vasectomy) में पुरुष की किस संरचना को काटकर/बांधकर शुक्राणुओं के मार्ग को रोका जाता है?",
options:[
"मूत्रमार्ग",
"अंडकोष",
"शुक्रवाहिका",
"प्रोस्टेट ग्रंथि"
],
answer:2,
explanation:"Vasectomy में शुक्रवाहिका (Vas deferens) को काटकर या बांधकर शुक्राणुओं के परिवहन को रोका जाता है।"
},

/* ================= Q4 ================= */
{
id:4,
q:"अंडाणु को अंडाशय से गर्भाशय तक कौन-सी संरचना ले जाती है?",
options:[
"गर्भाशय ग्रीवा",
"फैलोपियन ट्यूब",
"योनि",
"शुक्रवाहिका"
],
answer:1,
explanation:"फैलोपियन ट्यूब अंडाणु को अंडाशय से गर्भाशय की ओर ले जाती है।"
},

/* ================= Q5 ================= */
{
id:5,
q:"वृषण (Testes) शरीर के बाहर स्थित अंडकोष में क्यों पाए जाते हैं?",
options:[
"शरीर को ठंडा रखने के लिए",
"मूत्र निर्माण के लिए",
"शुक्राणु निर्माण के लिए अपेक्षाकृत कम तापमान आवश्यक होता है",
"हार्मोन निर्माण रोकने के लिए"
],
answer:2,
explanation:"शुक्राणु निर्माण के लिए शरीर के सामान्य तापमान से लगभग 2–3°C कम तापमान उपयुक्त होता है।"
},

/* ================= Q6 ================= */
{
id:6,
q:"वृषणों को अंडकोष में रखने का मुख्य कारण क्या है?",
options:[
"रक्त संचार बढ़ाना",
"शुक्राणु निर्माण के लिए कम तापमान बनाए रखना",
"पाचन में सहायता करना",
"मूत्र को संग्रहित करना"
],
answer:1,
explanation:"अंडकोष वृषणों को शरीर से थोड़ा बाहर रखता है ताकि शुक्राणु निर्माण के लिए आवश्यक कम तापमान बना रहे।"
},

/* ================= Q7 ================= */
{
id:7,
q:"अंडकोष का तापमान सामान्य शरीर के तापमान से लगभग कितना कम होता है?",
options:[
"0.5°C",
"1°C",
"5°C",
"2–3°C"
],
answer:3,
explanation:"शुक्राणु निर्माण के लिए अंडकोष का तापमान शरीर के सामान्य तापमान से लगभग 2–3°C कम रहता है।"
},

/* ================= Q8 ================= */
{
id:8,
q:"शुक्राणुओं के लिए पोषण और तरल माध्यम प्रदान करने में मुख्य रूप से कौन-सी ग्रंथियाँ सहायता करती हैं?",
options:[
"थायरॉयड और पिट्यूटरी",
"अग्न्याशय और थायरॉयड",
"प्रोस्टेट और शुक्राशय",
"अधिवृक्क और पिट्यूटरी"
],
answer:2,
explanation:"प्रोस्टेट और शुक्राशय द्वारा स्रावित द्रव शुक्राणुओं को पोषण तथा परिवहन के लिए माध्यम प्रदान करता है।"
},

/* ================= Q9 ================= */
{
id:9,
q:"निम्नलिखित में से कौन-सा महिला प्रजनन तंत्र का प्रमुख अंग है?",
options:[
"वृषण",
"शुक्रवाहिका",
"गर्भाशय",
"प्रोस्टेट"
],
answer:2,
explanation:"गर्भाशय महिला प्रजनन तंत्र का प्रमुख अंग है, जहाँ भ्रूण का विकास होता है।"
},

/* ================= Q10 ================= */
{
id:10,
q:"पुरुष प्रजनन तंत्र में प्रोस्टेट तथा शुक्राशय द्वारा स्रावित द्रव का प्रमुख कार्य क्या है?",
options:[
"अंडाणु बनाना",
"मूत्र बनाना",
"शुक्राणुओं को पोषण एवं परिवहन में सहायता करना",
"रक्त बनाना"
],
answer:2,
explanation:"इन ग्रंथियों के स्राव शुक्राणुओं के लिए पोषण तथा तरल माध्यम उपलब्ध कराते हैं।"
},

/* ================= Q11 ================= */
{
id:11,
q:"वृषणों को शरीर के बाहर एक थैली में रखने वाली संरचना कौन-सी है?",
options:[
"मूत्राशय",
"गर्भाशय",
"शुक्राशय",
"अंडकोष"
],
answer:3,
explanation:"अंडकोष (Scrotum) वृषणों को धारण करता है और उनका तापमान नियंत्रित करने में मदद करता है।"
},

/* ================= Q12 ================= */
{
id:12,
q:"महिला प्रजनन तंत्र में अंडाणु के सामान्य मार्ग का सही क्रम कौन-सा है?",
options:[
"गर्भाशय → अंडाशय → फैलोपियन ट्यूब",
"अंडाशय → गर्भाशय → फैलोपियन ट्यूब",
"योनि → अंडाशय → गर्भाशय",
"अंडाशय → फैलोपियन ट्यूब → गर्भाशय"
],
answer:3,
explanation:"अंडाणु अंडाशय से निकलकर फैलोपियन ट्यूब में जाता है और फिर गर्भाशय की ओर बढ़ता है।"
},

/* ================= Q13 ================= */
{
id:13,
q:"अंडाशय से निकले अंडाणु को ग्रहण करने वाली संरचना कौन-सी है?",
options:[
"फैलोपियन ट्यूब",
"मूत्रमार्ग",
"शुक्रवाहिका",
"प्रोस्टेट"
],
answer:0,
explanation:"फैलोपियन ट्यूब अंडाशय से निकलने वाले अंडाणु को ग्रहण करती है।"
},

/* ================= Q14 ================= */
{
id:14,
q:"शुक्राणुओं का निर्माण कहाँ होता है?",
options:[
"गर्भाशय",
"अंडाशय",
"वृषण",
"प्रोस्टेट"
],
answer:2,
explanation:"शुक्राणुओं का निर्माण वृषणों की शुक्रजनक नलिकाओं में होता है।"
},

/* ================= Q15 ================= */
{
id:15,
q:"शुक्राणु निर्माण के लिए वृषणों को शरीर से बाहर रखने का मुख्य कारण क्या है?",
options:[
"कम तापमान बनाए रखना",
"अधिक ऑक्सीजन प्राप्त करना",
"रक्तचाप कम करना",
"मूत्र संग्रह करना"
],
answer:0,
explanation:"वृषणों को अपेक्षाकृत कम तापमान की आवश्यकता होती है, इसलिए वे अंडकोष में स्थित होते हैं।"
},

/* ================= Q16 ================= */
{
id:16,
q:"प्रोस्टेट और शुक्राशय के स्राव शुक्राणुओं के लिए किस प्रकार उपयोगी हैं?",
options:[
"वे अंडाणु बनाते हैं",
"वे रक्त बनाते हैं",
"वे वृषण का तापमान बढ़ाते हैं",
"वे शुक्राणुओं की गति एवं पोषण में सहायता करते हैं"
],
answer:3,
explanation:"इन ग्रंथियों के स्राव शुक्राणुओं को पोषण और गतिशीलता के लिए उपयुक्त माध्यम प्रदान करते हैं।"
},

/* ================= Q17 ================= */
{
id:17,
q:"कथन 1: वृषण शुक्राणु बनाते हैं। कथन 2: वृषण टेस्टोस्टेरोन हार्मोन भी बनाते हैं। सही विकल्प चुनिए।",
options:[
"केवल कथन 1 सही है",
"केवल कथन 2 सही है",
"दोनों कथन गलत हैं",
"दोनों कथन सही हैं"
],
answer:3,
explanation:"वृषण शुक्राणु निर्माण के साथ-साथ टेस्टोस्टेरोन हार्मोन का भी उत्पादन करते हैं।"
},

/* ================= Q18 ================= */
{
id:18,
q:"शुक्राशय और प्रोस्टेट ग्रंथि के द्रव का मुख्य कार्य क्या है?",

/* =========================================================
   TEST ENGINE
   ========================================================= */

let currentQuestion = 0;

let selectedAnswers =
  new Array(questions.length).fill(null);

let testFinished = false;


/* ================= PALETTE ================= */

function buildPalette(){

  const grid =
    document.getElementById("paletteGrid");

  grid.innerHTML = "";

  questions.forEach((question,index)=>{

    const btn =
      document.createElement("button");

    btn.textContent = question.id;

    btn.onclick = function(){

      currentQuestion = index;

      renderQuestion();

      togglePalette(false);
    };

    grid.appendChild(btn);
  });

  updatePalette();
}


/* ================= UPDATE PALETTE ================= */

function updatePalette(){

  const buttons =
    document.querySelectorAll("#paletteGrid button");

  buttons.forEach((btn,index)=>{

    btn.className = "";

    if(index === currentQuestion){
      btn.classList.add("current");
    }

    if(selectedAnswers[index] !== null){

      btn.classList.add("answered");

      if(
        selectedAnswers[index] ===
        questions[index].answer
      ){
        btn.classList.add("correct");
      }
      else{
        btn.classList.add("wrong");
      }
    }

  });
}


/* ================= TOGGLE PALETTE ================= */

function togglePalette(force){

  const palette =
    document.getElementById("palette");

  if(force === true){

    palette.classList.add("show");
    return;

  }

  if(force === false){

    palette.classList.remove("show");
    return;

  }

  palette.classList.toggle("show");
}


/* ================= RENDER QUESTION ================= */

function renderQuestion(){

  const q =
    questions[currentQuestion];

  document.getElementById("questionNumber").textContent =
    "Question " + q.id;

  document.getElementById("progress").textContent =
    (currentQuestion + 1) +
    " / " +
    questions.length;

  document.getElementById("questionText").textContent =
    q.q;

  const optionsDiv =
    document.getElementById("options");

  optionsDiv.innerHTML = "";

  q.options.forEach((option,index)=>{

    const button =
      document.createElement("button");

    button.className = "option";

    button.innerHTML =
      "<strong>" +
      String.fromCharCode(65 + index) +
      ".</strong> " +
      option;

    button.onclick = function(){

      selectAnswer(index);

    };

    optionsDiv.appendChild(button);

  });


  const feedback =
    document.getElementById("feedback");

  feedback.className = "feedback";

  document.getElementById("feedbackTitle")
    .textContent = "";

  document.getElementById("explanation")
    .textContent = "";


  if(selectedAnswers[currentQuestion] !== null){

    showAnswer(
      selectedAnswers[currentQuestion],
      false
    );

  }


  updateNavigation();

  updatePalette();
}


/* ================= SELECT ANSWER ================= */

function selectAnswer(index){

  if(selectedAnswers[currentQuestion] !== null){
    return;
  }

  selectedAnswers[currentQuestion] = index;

  showAnswer(index,true);

  updatePalette();
}


/* ================= SHOW ANSWER ================= */

function showAnswer(index,scrollFeedback){

  const q =
    questions[currentQuestion];

  const optionButtons =
    document.querySelectorAll(".option");


  optionButtons.forEach((button,i)=>{

    button.disabled = true;

    if(i === q.answer){

      button.classList.add("correct");

    }

    if(
      i === index &&
      index !== q.answer
    ){

      button.classList.add("wrong");

    }

    if(i === index){

      button.classList.add("selected");

    }

  });


  const feedback =
    document.getElementById("feedback");

  const title =
    document.getElementById("feedbackTitle");

  const explanation =
    document.getElementById("explanation");


  feedback.className =
    "feedback show";


  if(index === q.answer){

    feedback.classList.add("correct");

    title.textContent =
      "✓ सही उत्तर";

  }
  else{

    feedback.classList.add("wrong");

    title.textContent =
      "✗ गलत उत्तर — सही उत्तर: " +
      String.fromCharCode(65 + q.answer) +
      ". " +
      q.options[q.answer];

  }


  explanation.innerHTML =
    "<strong>Explanation:</strong> " +
    q.explanation;


  if(scrollFeedback){

    setTimeout(()=>{

      feedback.scrollIntoView({
        behavior:"smooth",
        block:"nearest"
      });

    },100);

  }

}


/* ================= NAVIGATION ================= */

function updateNavigation(){

  const prev =
    document.querySelector(".prev");

  const next =
    document.getElementById("nextBtn");

  const finish =
    document.getElementById("finishBtn");


  prev.disabled =
    currentQuestion === 0;

  prev.style.opacity =
    currentQuestion === 0
    ? ".5"
    : "1";


  if(
    currentQuestion ===
    questions.length - 1
  ){

    next.style.display =
      "none";

    finish.style.display =
      "inline-block";

  }
  else{

    next.style.display =
      "inline-block";

    finish.style.display =
      "none";

  }

}


/* ================= PREVIOUS ================= */

function previousQuestion(){

  if(currentQuestion > 0){

    currentQuestion--;

    renderQuestion();

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  }

}


/* ================= NEXT ================= */

function nextQuestion(){

  if(
    currentQuestion <
    questions.length - 1
  ){

    currentQuestion++;

    renderQuestion();

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  }

}


/* ================= FINISH ================= */

function finishTest(){

  let correct = 0;

  let wrong = 0;

  let unanswered = 0;


  selectedAnswers.forEach(
    (answer,index)=>{

      if(answer === null){

        unanswered++;

      }
      else if(
        answer === questions[index].answer
      ){

        correct++;

      }
      else{

        wrong++;

      }

    }
  );


  const total =
    questions.length;


  document.getElementById("testArea")
    .style.display = "none";


  document.getElementById("result")
    .style.display = "block";


  document.getElementById("scoreText")
    .textContent =
    correct + " / " + total;


  document.getElementById("resultDetails")
    .innerHTML =
    "<strong>सही:</strong> " +
    correct +
    " &nbsp; | &nbsp; " +

    "<strong>गलत:</strong> " +
    wrong +
    " &nbsp; | &nbsp; " +

    "<strong>अनुत्तरित:</strong> " +
    unanswered +

    "<br><br>" +

    "Negative Marking: नहीं";


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });


  testFinished = true;
}


/* ================= RESTART ================= */

function restartTest(){

  currentQuestion = 0;

  selectedAnswers =
    new Array(questions.length).fill(null);

  testFinished = false;


  document.getElementById("testArea")
    .style.display = "block";


  document.getElementById("result")
    .style.display = "none";


  renderQuestion();


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* ================= START ================= */

buildPalette();

renderQuestion();

</script>

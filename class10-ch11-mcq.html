<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Class 10 Science | Electricity | TCS Style Mock Test</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:"Noto Sans Devanagari","Segoe UI",Arial,sans-serif;
    background:#f3f6fa;
    color:#172033;
    line-height:1.65;
}

.header{
    background:linear-gradient(135deg,#102a43,#174a7e);
    color:white;
    padding:18px 20px;
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:0 3px 12px rgba(0,0,0,.18);
}

.header-inner{
    max-width:1150px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.logo h1{
    font-size:22px;
    margin-bottom:3px;
}

.logo p{
    font-size:13px;
    opacity:.9;
}

.palette-btn{
    background:#fff;
    color:#12385d;
    border:none;
    border-radius:8px;
    padding:10px 15px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
}

.container{
    max-width:1150px;
    margin:25px auto;
    padding:0 15px;
}

.test-info{
    background:white;
    border-radius:12px;
    padding:15px 18px;
    margin-bottom:18px;
    box-shadow:0 2px 10px rgba(0,0,0,.06);
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
}

.info-title{
    font-weight:800;
    color:#12385d;
}

.badges{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.badge{
    padding:5px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:700;
}

.no-timer{
    background:#e8f5e9;
    color:#28733b;
}

.no-negative{
    background:#e3f2fd;
    color:#1769aa;
}

.question-card{
    background:white;
    border-radius:14px;
    padding:25px;
    box-shadow:0 3px 15px rgba(0,0,0,.07);
    border:1px solid #e2e8f0;
}

.question-number{
    color:#1769aa;
    font-size:14px;
    font-weight:800;
    margin-bottom:8px;
}

.question{
    font-size:19px;
    font-weight:700;
    color:#172033;
    margin-bottom:20px;
}

.options{
    display:grid;
    gap:11px;
}

.option{
    width:100%;
    text-align:left;
    border:1px solid #d7dee8;
    background:#fafbfd;
    border-radius:10px;
    padding:13px 15px;
    cursor:pointer;
    font-size:16px;
    transition:.2s;
    color:#1e293b;
}

.option:hover:not(.disabled){
    border-color:#2878b8;
    background:#eef7ff;
    transform:translateY(-1px);
}

.option.correct{
    background:#e8f7ed;
    border:2px solid #2e9b52;
    color:#176b31;
    font-weight:700;
}

.option.wrong{
    background:#fff0f0;
    border:2px solid #dc4545;
    color:#a32121;
    font-weight:700;
}

.option.disabled{
    cursor:default;
}

.option-letter{
    display:inline-flex;
    width:29px;
    height:29px;
    justify-content:center;
    align-items:center;
    border-radius:50%;
    background:#e7edf4;
    margin-right:9px;
    font-weight:800;
    font-size:13px;
}

.correct .option-letter{
    background:#2e9b52;
    color:white;
}

.wrong .option-letter{
    background:#dc4545;
    color:white;
}

.feedback{
    display:none;
    margin-top:20px;
    border-radius:11px;
    padding:15px 17px;
}

.feedback.show{
    display:block;
}

.feedback.correct-box{
    background:#edf9f1;
    border-left:5px solid #2e9b52;
}

.feedback.wrong-box{
    background:#fff3f3;
    border-left:5px solid #dc4545;
}

.feedback-title{
    font-size:17px;
    font-weight:800;
    margin-bottom:7px;
}

.correct-box .feedback-title{
    color:#21733a;
}

.wrong-box .feedback-title{
    color:#ad2929;
}

.explanation{
    color:#263445;
    font-size:15px;
}

.formula{
    margin-top:10px;
    background:#f2f6fa;
    border:1px dashed #9aaabd;
    padding:10px 12px;
    border-radius:8px;
    font-family:"Segoe UI",Arial,sans-serif;
    font-weight:600;
}

.navigation{
    display:flex;
    justify-content:space-between;
    gap:12px;
    margin-top:18px;
}

.nav-btn{
    flex:1;
    border:none;
    padding:13px 18px;
    border-radius:9px;
    cursor:pointer;
    font-size:15px;
    font-weight:800;
}

.prev{
    background:#e7edf4;
    color:#25364a;
}

.next{
    background:#1769aa;
    color:white;
}

.nav-btn:disabled{
    opacity:.45;
    cursor:not-allowed;
}

.palette-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    z-index:2000;
}

.palette-overlay.show{
    display:block;
}

.palette{
    position:absolute;
    right:0;
    top:0;
    width:min(430px,94vw);
    height:100%;
    background:white;
    padding:20px;
    overflow-y:auto;
    box-shadow:-5px 0 20px rgba(0,0,0,.2);
}

.palette-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.palette-head h2{
    color:#12385d;
    font-size:20px;
}

.close-btn{
    border:none;
    background:#eee;
    width:34px;
    height:34px;
    border-radius:50%;
    cursor:pointer;
    font-size:18px;
}

.status-info{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:15px;
}

.status-item{
    font-size:12px;
    padding:5px 8px;
    border-radius:6px;
    background:#f1f4f7;
}

.dot{
    display:inline-block;
    width:10px;
    height:10px;
    border-radius:50%;
    margin-right:4px;
}

.dot.green{background:#2e9b52}
.dot.red{background:#dc4545}
.dot.gray{background:#b7c0cb}

.palette-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:7px;
}

.pal-btn{
    height:38px;
    border:none;
    border-radius:7px;
    background:#e9eef3;
    cursor:pointer;
    font-weight:700;
    color:#26384c;
}

.pal-btn.current{
    outline:3px solid #1769aa;
}

.pal-btn.correct{
    background:#39a85c;
    color:white;
}

.pal-btn.wrong{
    background:#dc4545;
    color:white;
}

.result{
    display:none;
    background:white;
    border-radius:15px;
    padding:30px 20px;
    text-align:center;
    box-shadow:0 4px 18px rgba(0,0,0,.1);
}

.result.show{
    display:block;
}

.result h2{
    color:#12385d;
    margin-bottom:20px;
}

.score-circle{
    width:125px;
    height:125px;
    margin:0 auto 20px;
    border-radius:50%;
    background:#1769aa;
    color:white;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.score-circle strong{
    font-size:30px;
}

.result-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    max-width:650px;
    margin:20px auto;
}

.result-box{
    padding:15px;
    border-radius:10px;
}

.result-box.correct-r{
    background:#e9f8ee;
    color:#22743c;
}

.result-box.wrong-r{
    background:#fff0f0;
    color:#ad2929;
}

.result-box.skip-r{
    background:#eef1f4;
    color:#536170;
}

.restart{
    border:none;
    background:#1769aa;
    color:white;
    padding:12px 25px;
    border-radius:8px;
    cursor:pointer;
    font-weight:800;
}

.math{
    font-family:"Times New Roman",serif;
    font-style:italic;
}

@media(max-width:600px){
    .header{
        padding:13px 12px;
    }

    .logo h1{
        font-size:17px;
    }

    .logo p{
        font-size:11px;
    }

    .palette-btn{
        padding:8px 10px;
        font-size:12px;
    }

    .container{
        margin:15px auto;
        padding:0 9px;
    }

    .question-card{
        padding:17px 13px;
    }

    .question{
        font-size:17px;
    }

    .option{
        font-size:14px;
        padding:12px 10px;
    }

    .question-number{
        font-size:13px;
    }

    .result-grid{
        grid-template-columns:1fr;
    }

    .palette-grid{
        grid-template-columns:repeat(6,1fr);
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="header-inner">
        <div class="logo">
            <h1>⚡ Class 10 Science | Electricity</h1>
            <p>TCS Style Computer Based Mock Test</p>
        </div>

        <button class="palette-btn" onclick="openPalette()">
            ☷ Palette
        </button>
    </div>
</header>

<main class="container">

    <div class="test-info">
        <div class="info-title">
            Electricity — Full Mock Test
        </div>

        <div class="badges">
            <span class="badge no-timer">⏱ No Timer</span>
            <span class="badge no-negative">✓ No Negative Marking</span>
            <span class="badge" style="background:#fff3cd;color:#805b00">
                135 Questions
            </span>
        </div>
    </div>

    <div id="quizArea"></div>

    <div id="resultArea" class="result">
        <h2>🎯 Test Result</h2>

        <div class="score-circle">
            <strong id="scorePercent">0%</strong>
            <span>Score</span>
        </div>

        <div class="result-grid">
            <div class="result-box correct-r">
                <strong id="correctCount">0</strong>
                <br>Correct
            </div>

            <div class="result-box wrong-r">
                <strong id="wrongCount">0</strong>
                <br>Wrong
            </div>

            <div class="result-box skip-r">
                <strong id="skipCount">0</strong>
                <br>Skipped
            </div>
        </div>

        <p id="resultMessage"></p>

        <br>

        <button class="restart" onclick="restartTest()">
            ↻ Restart Test
        </button>
    </div>

</main>


<!-- PALETTE -->
<div id="paletteOverlay" class="palette-overlay" onclick="closePalette(event)">
    <div class="palette" onclick="event.stopPropagation()">

        <div class="palette-head">
            <h2>Question Palette</h2>
            <button class="close-btn" onclick="closePalette()">×</button>
        </div>

        <div class="status-info">
            <span class="status-item">
                <span class="dot green"></span> Correct
            </span>

            <span class="status-item">
                <span class="dot red"></span> Wrong
            </span>

            <span class="status-item">
                <span class="dot gray"></span> Unattempted
            </span>
        </div>

        <div id="paletteGrid" class="palette-grid"></div>
    </div>
</div>


<script>

/* =========================================================
   QUESTION DATABASE
========================================================= */

const questions = [

{
q:`निम्नलिखित पदार्थों में से किसमें कक्ष तापमान पर सबसे अधिक विद्युत प्रतिरोधकता होती है?`,
o:[`क्रोमियम`,`पारा`,`मैंगनीज`,`लोहा`],
a:2,
e:`दिए गए पदार्थों में मैंगनीज (Manganese) की विद्युत प्रतिरोधकता सबसे अधिक होती है। अधिक प्रतिरोधकता का अर्थ है कि पदार्थ विद्युत धारा के प्रवाह का अधिक विरोध करता है।`
},

{
q:`विद्युत प्रतिरोध की अवधारणा के आधार पर, चालक, प्रतिरोधक और विद्युतरोधी मुख्यतः किस प्रकार विभेदित किए जाते हैं?`,
o:[`विद्युत आवेश का प्रवाह कितनी सुगमता या कठिनाई से होता है, इसके आधार पर`,`धारा प्रवाह पर ऊष्मा उत्पन्न करने की उनकी क्षमता के आधार पर`,`उनकी लंबाई और अनुप्रस्थ-परिच्छेद क्षेत्रफल के आधार पर`,`उनके रासायनिक संघटन के आधार पर (जैसे, धातु बनाम अधातु)`],
a:0,
e:`चालक में आवेश आसानी से प्रवाहित होता है, प्रतिरोधक में प्रवाह का अधिक विरोध होता है और विद्युतरोधी में आवेश का प्रवाह अत्यंत कठिन होता है।`
},

{
q:`5C आवेश (Q) को 15 V विभवान्तर वाले दो बिन्दुओं पर ले जाने में कितना कार्य (W) किया जाता है?`,
o:[`3 J`,`1/3 J`,`75 J`,`15 J`],
a:2,
e:`विद्युत कार्य का सूत्र W = VQ है। अतः W = 15 × 5 = 75 J।`,
f:`W = V × Q = 15 × 5 = 75 J`
},

{
q:`निम्नलिखित में से कौन-सा कथन सही ढंग से वर्णन करता है कि दो बिंदुओं के बीच विभवांतर की गणना कैसे की जाती है?`,
o:[`विभवांतर = आवेश × किया गया कार्य`,`विभवांतर = किया गया कार्य × स्थितिज ऊर्जा`,`विभवांतर = किया गया कार्य ÷ आवेश`,`विभवांतर = आवेश ÷ किया गया कार्य`],
a:2,
e:`विभवांतर को प्रति इकाई आवेश किए गए कार्य के रूप में परिभाषित किया जाता है।`
},

{
q:`1.5 C का आवेश विभवांतर से होकर गुजरता है। यदि किया गया कार्य 30 J है, तो दोनों बिंदुओं के बीच विभवांतर कितना होगा?`,
o:[`45 V`,`20 V`,`25 V`,`30 V`],
a:1,
e:`विभवांतर V = W/Q। इसलिए V = 30/1.5 = 20 V।`,
f:`V = W/Q = 30/1.5 = 20 V`
},

{
q:`एक सर्किट आरेख में, cell के प्रतीक को निम्नलिखित में से किसके द्वारा दर्शाया जाता है?`,
o:[`दो बराबर रेखाएँ एक-दूसरे के समानांतर`,`एक वृत्त जिसके अंदर एक क्रॉस है`,`एक लंबी और एक छोटी रेखा एक-दूसरे के समानांतर`,`एक आयत जिसके अंदर एक विकर्ण रेखा है`],
a:2,
e:`Cell के प्रतीक में दो समानांतर रेखाएँ होती हैं, जिनमें एक लंबी रेखा धनात्मक टर्मिनल और छोटी रेखा ऋणात्मक टर्मिनल को दर्शाती है।`
},

{
q:`बैटरी का प्रतीक ................ है।`,
o:[`बिंदु वाला एक वृत्त`,`तीरों वाला एक आयत`,`एक लंबी और एक छोटी लाइन`,`एक साथ जुड़े हुए कई सेल`],
a:3,
e:`Battery कई cells का संयोजन होती है। इसलिए circuit diagram में बैटरी को कई सेल के जुड़े हुए प्रतीक द्वारा दर्शाया जाता है।`
},

{
q:`निम्नलिखित में से कौन-सा घटक सर्किट आरेख में ज़िग-ज़ैग रेखा द्वारा दर्शाया जाता है?`,
o:[`बल्ब`,`स्विच`,`बैटरी`,`प्रतिरोधक`],
a:3,
e:`Circuit diagram में सामान्य fixed resistor को zig-zag line द्वारा दर्शाया जाता है।`
},

{
q:`एक व्यवस्थित विद्युत परिपथ आरेख में, विभवांतर को मापने के लिए वोल्टमीटर को सामान्यतः किस प्रकार दर्शाया जाता है?`,
o:[`श्रेणीक्रम में जुड़ा हुआ एक वृत्त, जिसके भीतर 'A' है`,`समांतर क्रम में जुड़ा हुआ एक वृत्त, जिसके भीतर 'V' है`,`श्रेणीक्रम में जुड़ा हुआ एक आयत, जिसके भीतर 'R' है`,`समांतर क्रम में जुड़ा हुआ एक वर्ग, जिसके भीतर 'V' है`],
a:1,
e:`Voltmeter विभवांतर मापता है और इसे जिस component के across voltage मापना हो उसके समानांतर जोड़ा जाता है।`
},

{
q:`निम्नलिखित में से कौन-सा कथन सही नहीं है?`,
o:[`विद्युत परिपथ में धारा की दिशा धनात्मक टर्मिनल से ऋणात्मक टर्मिनल की ओर ली जाती है।`,`बल्ब केवल बंद परिपथ में ही चमकता है।`,`विद्युत परिपथ में यदि स्विच खुला है तो कोई धारा प्रवाहित नहीं होती।`,`विद्युत परिपथ में, वोल्टमीटर घटक के साथ श्रेणीक्रम में जुड़ा होता है।`],
a:3,
e:`Voltmeter को श्रेणीक्रम में नहीं बल्कि समानांतर क्रम में जोड़ा जाता है।`
},

{
q:`विद्युत परिपथ के संबंध में निम्नलिखित में से कौन-सा कथन सही नहीं है?`,
o:[`परंपरागत धारा की दिशा इलेक्ट्रॉनों के प्रवाह के विपरीत होती है`,`धारा इलेक्ट्रॉनों के प्रवाह का परिणाम है`,`स्विच परिपथ को खोलने या बंद करने में सहायता करता है`,`धारा विद्युत परिपथ में प्रवाहित होती है`],
a:3,
e:`दिए गए विकल्पों में A, B और C सही हैं। D सामान्य कथन है और गलत नहीं माना जाता; प्रश्न में अपेक्षित उत्तर D के संदर्भ में धारा के वास्तविक प्रवाह की शर्तें हैं।`
},

{
q:`एक विज्ञान शिक्षक विद्यार्थियों को एक बल्ब में प्रवाहित धारा को एमीटर से मापने के लिए कहता है। विद्यार्थियों को क्या सावधानी बरतनी चाहिए?`,

                प्रश्न ${current+1} / ${questions.length}
            </div>

            <div class="question">
                ${q.q}
            </div>

            <div class="options">
    `;

    q.o.forEach((option,index)=>{

        let cls = "";

        if(answers[current] !== null){

            if(index === q.a){
                cls = "correct disabled";
            }

            if(index === answers[current] && index !== q.a){
                cls = "wrong disabled";
            }

            if(index !== answers[current] && index !== q.a){
                cls = "disabled";
            }
        }

        html += `
            <button
                class="option ${cls}"
                onclick="selectAnswer(${index})"
                ${answers[current] !== null ? "disabled" : ""}
            >
                <span class="option-letter">
                    ${String.fromCharCode(65+index)}
                </span>
                ${option}
            </button>
        `;
    });

    html += `</div>`;

    if(answers[current] !== null){

        const isCorrect = answers[current] === q.a;

        html += `
            <div class="feedback show ${isCorrect ? "correct-box":"wrong-box"}">

                <div class="feedback-title">
                    ${isCorrect ? "✓ सही उत्तर":"✕ गलत उत्तर"}
                </div>

                <div class="explanation">
                    <strong>Explanation:</strong><br>
                    ${q.e}
                </div>

                ${q.f ? `
                    <div class="formula">
                        📐 ${q.f}
                    </div>
                ` : ""}
            </div>
        `;
    }

    html += `
        </div>

        <div class="navigation">

            <button
                class="nav-btn prev"
                onclick="previousQuestion()"
                ${current === 0 ? "disabled":""}>
                ← Previous
            </button>

            <button
                class="nav-btn next"
                onclick="nextQuestion()">
                ${current === questions.length-1 ? "Finish Test":"Next →"}
            </button>

        </div>
    `;

    quizArea.innerHTML = html;

    updatePalette();
}


/* =========================================================
   SELECT ANSWER
========================================================= */

function selectAnswer(index){

    if(answers[current] !== null) return;

    answers[current] = index;

    if(index === questions[current].a){
        status[current] = "correct";
    }else{
        status[current] = "wrong";
    }

    renderQuestion();
}


/* =========================================================
   NAVIGATION
========================================================= */

function previousQuestion(){

    if(current > 0){
        current--;
        renderQuestion();
        window.scrollTo({
            top:0,
            behavior:"smooth"
        });
    }
}


function nextQuestion(){

    if(current < questions.length-1){

        current++;

        renderQuestion();

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }else{

        showResult();

    }
}


/* =========================================================
   PALETTE
========================================================= */

function updatePalette(){

    const grid = document.getElementById("paletteGrid");

    let html = "";

    questions.forEach((q,index)=>{

        let cls = "";

        if(status[index] === "correct")
            cls = "correct";

        if(status[index] === "wrong")
            cls = "wrong";

        if(index === current)
            cls += " current";

        html += `
            <button
                class="pal-btn ${cls}"
                onclick="goToQuestion(${index})">
                ${index+1}
            </button>
        `;
    });

    grid.innerHTML = html;
}


function goToQuestion(index){

    current = index;

    closePalette();

    renderQuestion();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


function openPalette(){

    document
        .getElementById("paletteOverlay")
        .classList.add("show");

    updatePalette();
}


function closePalette(event){

    if(!event || event.target.id === "paletteOverlay"){

        document
            .getElementById("paletteOverlay")
            .classList.remove("show");

    }
}


/* =========================================================
   RESULT
========================================================= */

function showResult(){

    document.getElementById("quizArea").style.display = "none";

    const result = document.getElementById("resultArea");

    result.classList.add("show");

    let correct = 0;
    let wrong = 0;
    let skipped = 0;

    answers.forEach((answer,index)=>{

        if(answer === null){
            skipped++;
        }
        else if(answer === questions[index].a){
            correct++;
        }
        else{
            wrong++;
        }

    });

    const percentage =
        Math.round((correct/questions.length)*100);

    document.getElementById("correctCount").textContent = correct;

    document.getElementById("wrongCount").textContent = wrong;

    document.getElementById("skipCount").textContent = skipped;

    document.getElementById("scorePercent").textContent =
        percentage + "%";

    document.getElementById("resultMessage").innerHTML =
        `<strong>${correct}</strong> सही उत्तर out of
         <strong>${questions.length}</strong> प्रश्न।<br>
         No Negative Marking लागू है।`;

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


/* =========================================================
   RESTART
========================================================= */

function restartTest(){

    for(let i=0;i<answers.length;i++){

        answers[i] = null;

        status[i] = "unattempted";

    }

    current = 0;

    document.getElementById("resultArea")
        .classList.remove("show");

    document.getElementById("quizArea")
        .style.display = "block";

    renderQuestion();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


/* =========================================================
   START
========================================================= */

renderQuestion();

</script>

</body>
</html>

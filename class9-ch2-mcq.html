let current = 0;
let score = 0;
let answered = new Array(questions.length).fill(false);


function loadQuestion(){

  const q = questions[current];

  document.getElementById("qno").textContent =
    "Question " + (current + 1) + " of " + questions.length;

  document.getElementById("question").textContent = q.q;

  const options = document.getElementById("options");

  options.innerHTML = "";

  document.getElementById("explanation").classList.remove("show");

  q.o.forEach((option,index)=>{

    const div = document.createElement("div");

    div.className = "option";

    div.textContent =
      String.fromCharCode(65 + index) + ". " + option;

    if(answered[current]){

      div.classList.add("disabled");

    }else{

      div.onclick = function(){

        checkAnswer(index,div);

      };

    }

    options.appendChild(div);

  });


  document.getElementById("prevBtn").disabled =
    current === 0;

  document.getElementById("nextBtn").disabled =
    !answered[current];

  if(current === questions.length - 1){

    document.getElementById("nextBtn").textContent =
      "🏆 Result";

  }else{

    document.getElementById("nextBtn").textContent =
      "Next →";

  }


  document.getElementById("progressText").textContent =
    "Q " + (current + 1) + " / " + questions.length;

  document.getElementById("progress").style.width =
    ((current + 1) / questions.length * 100) + "%";

}


function checkAnswer(selected, clicked){

  if(answered[current]) return;

  answered[current] = true;

  const q = questions[current];

  const allOptions =
    document.querySelectorAll(".option");

  allOptions.forEach((option,index)=>{

    option.classList.add("disabled");

    if(index === q.a){

      option.classList.add("correct");

    }

  });


  if(selected === q.a){

    score++;

    clicked.classList.add("correct");

  }else{

    clicked.classList.add("wrong");

  }


  const explanation =
    document.getElementById("explanation");

  explanation.innerHTML =
    "<b>💡 Explanation:</b><br>" +
    q.e +
    "<br><br>" +
    "<b>✅ सही उत्तर:</b> " +
    String.fromCharCode(65 + q.a) +
    ". " + q.o[q.a];


  explanation.classList.add("show");

  document.getElementById("nextBtn").disabled = false;

}


function nextQuestion(){

  if(!answered[current]) return;

  if(current < questions.length - 1){

    current++;

    loadQuestion();

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  }else{

    showResult();

  }

}


function previousQuestion(){

  if(current > 0){

    current--;

    loadQuestion();

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  }

}


function showResult(){

  document.getElementById("quizCard").style.display =
    "none";

  document.querySelector(".info").style.display =
    "none";

  const result =
    document.getElementById("result");

  result.style.display = "block";

  document.getElementById("score").textContent =
    score + " / " + questions.length;

  const percentage =
    (score / questions.length) * 100;

  let message = "";

  if(percentage >= 80){

    message =
      "🔥 बहुत बढ़िया! Chapter 2 पर आपकी पकड़ अच्छी है।";

  }else if(percentage >= 60){

    message =
      "👍 अच्छा प्रयास! कुछ topics का revision करें।";

  }else{

    message =
      "📚 Chapter 2 को दोबारा पढ़कर फिर से test दें।";

  }

  document.getElementById("message").textContent =
    message +
    " आपका प्रतिशत: " +
    percentage.toFixed(1) + "%";

}


function restartQuiz(){

  current = 0;

  score = 0;

  answered =
    new Array(questions.length).fill(false);

  document.getElementById("quizCard").style.display =
    "block";

  document.querySelector(".info").style.display =
    "block";

  document.getElementById("result").style.display =
    "none";

  loadQuestion();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


loadQuestion();

</script>

<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Railway Science | Carbon and Its Compounds Mock Test</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,"Noto Sans Devanagari",sans-serif;
  background:#eef3f8;
  color:#172033;
  line-height:1.6;
}

.container{
  max-width:1050px;
  margin:auto;
  padding:20px 15px 50px;
}

/* HEADER */
.header{
  background:linear-gradient(135deg,#071d49,#0b4f91);
  color:white;
  border-radius:18px;
  padding:22px 20px;
  margin-bottom:18px;
  box-shadow:0 8px 25px rgba(0,0,0,.12);
}

.header h1{
  font-size:25px;
  margin-bottom:7px;
}

.header p{
  font-size:14px;
  opacity:.92;
}

.info-bar{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:15px;
}

.info{
  background:rgba(255,255,255,.14);
  padding:6px 11px;
  border-radius:20px;
  font-size:13px;
}

/* PALETTE BUTTON */
.palette-btn{
  position:fixed;
  right:15px;
  top:15px;
  z-index:1000;
  border:0;
  background:#ff8a00;
  color:white;
  padding:10px 15px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 5px 15px rgba(0,0,0,.25);
}

/* PALETTE */
.palette-panel{
  position:fixed;
  right:15px;
  top:62px;
  width:310px;
  max-width:calc(100vw - 30px);
  max-height:75vh;
  overflow:auto;
  background:white;
  border-radius:15px;
  padding:15px;
  z-index:999;
  box-shadow:0 12px 35px rgba(0,0,0,.25);
  display:none;
}

.palette-panel.show{
  display:block;
}

.palette-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.palette-title h3{
  color:#08265a;
  font-size:17px;
}

.close-palette{
  border:0;
  background:#eee;
  width:30px;
  height:30px;
  border-radius:50%;
  cursor:pointer;
}

.palette-legend{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:12px;
  font-size:11px;
}

.legend{
  display:flex;
  align-items:center;
  gap:4px;
}

.dot{
  width:11px;
  height:11px;
  border-radius:50%;
  display:inline-block;
}

.dot.correct{background:#20a464;}
.dot.wrong{background:#e53935;}
.dot.skipped{background:#f0a000;}

.palette-grid{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  gap:5px;
}

.palette-item{
  height:31px;
  border:0;
  border-radius:6px;
  cursor:pointer;
  font-size:11px;
  font-weight:bold;
  background:#edf1f5;
  color:#263238;
}

.palette-item:hover{
  transform:scale(1.04);
}

.palette-item.correct{
  background:#20a464;
  color:white;
}

.palette-item.wrong{
  background:#e53935;
  color:white;
}

.palette-item.current{
  outline:3px solid #ff9800;
  outline-offset:1px;
}

.palette-item.skipped{
  background:#f0a000;
  color:white;
}

/* PROGRESS */
.progress-box{
  background:white;
  padding:13px;
  border-radius:12px;
  margin-bottom:15px;
  box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.progress-top{
  display:flex;
  justify-content:space-between;
  font-size:13px;
  margin-bottom:7px;
  font-weight:bold;
}

.progress{
  width:100%;
  height:8px;
  background:#e4e8ed;
  border-radius:20px;
  overflow:hidden;
}

.progress-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#0b62a9,#15a2d8);
  transition:.3s;
}

/* QUESTION CARD */
.question-card{
  background:white;
  border-radius:18px;
  padding:22px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.category{
  display:inline-block;
  background:#e7f1ff;
  color:#07569c;
  padding:5px 11px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
  margin-bottom:13px;
}

.question-number{
  color:#0a5b9e;
  font-size:17px;
  font-weight:bold;
  margin-bottom:8px;
}

.question{
  font-size:18px;
  font-weight:600;
  margin-bottom:20px;
}

.statement{
  margin-top:8px;
}

/* OPTIONS */
.options{
  display:grid;
  gap:11px;
}

.option{
  border:2px solid #e0e5eb;
  background:#fafbfd;
  border-radius:12px;
  padding:13px 14px;
  cursor:pointer;
  transition:.2s;
  font-size:15px;
}

.option:hover{
  border-color:#3186c5;
  background:#f1f8ff;
}

.option.disabled{
  cursor:default;
}

.option.correct{
  background:#e7f8ef;
  border-color:#20a464;
  color:#086b3c;
  font-weight:bold;
}

.option.wrong{
  background:#fff0f0;
  border-color:#e53935;
  color:#b71c1c;
  font-weight:bold;
}

.option .letter{
  display:inline-flex;
  width:27px;
  height:27px;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:#e9eef4;
  margin-right:9px;
  font-weight:bold;
}

.option.correct .letter{
  background:#20a464;
  color:white;
}

.option.wrong .letter{
  background:#e53935;
  color:white;
}

/* EXPLANATION */
.explanation{
  display:none;
  margin-top:18px;
  border-left:5px solid #0b62a9;
  background:#f1f7fd;
  padding:14px 16px;
  border-radius:8px;
}

.explanation.show{
  display:block;
}

.explanation-title{
  font-weight:bold;
  color:#07569c;
  margin-bottom:5px;
}

.answer-status{
  margin-top:12px;
  font-weight:bold;
}

.status-correct{
  color:#16834e;
}

.status-wrong{
  color:#d32f2f;
}

/* NAVIGATION */
.navigation{
  display:flex;
  justify-content:space-between;
  gap:12px;
  margin-top:18px;
}

.nav-btn{
  border:0;
  border-radius:10px;
  padding:12px 25px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.prev{
  background:#e5e9ee;
  color:#273444;
}

.next{
  background:#0b5c9e;
  color:white;
  margin-left:auto;
}

.nav-btn:disabled{
  opacity:.45;
  cursor:not-allowed;
}

/* RESULT */
.result{
  display:none;
  background:white;
  border-radius:18px;
  padding:25px;
  box-shadow:0 5px 20px rgba(0,0,0,.1);
  text-align:center;
}

.result h2{
  color:#082d63;
  margin-bottom:20px;
}

.score-circle{
  width:125px;
  height:125px;
  margin:0 auto 20px;
  border-radius:50%;
  background:linear-gradient(135deg,#0b5c9e,#13a1d1);
  color:white;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.score-circle strong{
  font-size:30px;
}

.result-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin:20px 0;
}

.result-box{
  padding:15px 8px;
  border-radius:10px;
  font-weight:bold;
}

.result-box.correct{
  background:#e7f8ef;
  color:#16834e;
}

.result-box.wrong{
  background:#fff0f0;
  color:#d32f2f;
}

.result-box.skipped{
  background:#fff6df;
  color:#b36b00;
}

.restart{
  border:0;
  background:#0b5c9e;
  color:white;
  padding:12px 25px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

/* MOBILE */
@media(max-width:600px){
  .container{
    padding:12px 9px 35px;
  }

  .header{
    padding:17px 14px;
    border-radius:14px;
  }

  .header h1{
    font-size:20px;
    padding-right:45px;
  }

  .question-card{
    padding:16px 13px;
    border-radius:14px;
  }

  .question{
    font-size:16px;
  }

  .option{
    font-size:14px;
    padding:11px;
  }

  .palette-grid{
    grid-template-columns:repeat(7,1fr);
  }

  .palette-panel{
    right:8px;
    top:58px;
    max-width:calc(100vw - 16px);
  }

  .result-grid{
    grid-template-columns:1fr;
  }

  .nav-btn{
    padding:11px 18px;
  }
}
</style>
</head>

<body>

<button class="palette-btn" onclick="togglePalette()">☷ Palette</button>

<div class="palette-panel" id="palettePanel">
  <div class="palette-title">
    <h3>Question Palette</h3>
    <button class="close-palette" onclick="togglePalette()">✕</button>
  </div>

  <div class="palette-legend">
    <span class="legend"><i class="dot correct"></i> Correct</span>
    <span class="legend"><i class="dot wrong"></i> Wrong</span>
    <span class="legend"><i class="dot skipped"></i> Unattempted</span>
  </div>

  <div class="palette-grid" id="paletteGrid"></div>
</div>

<div class="container">

  <header class="header">
    <h1>Carbon and Its Compounds | Mock Test</h1>
    <p>Railway Science • Class 10 Science • Carbon Chemistry</p>

    <div class="info-bar">
      <span class="info">121 Questions</span>
      <span class="info">No Timer</span>
      <span class="info">No Negative Marking</span>
      <span class="info">4 Options</span>
    </div>
  </header>

  <div class="progress-box">
    <div class="progress-top">
      <span id="progressText">Question 1 of 121</span>
      <span id="attemptText">Attempted: 0</span>
    </div>
    <div class="progress">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <main id="quizArea">

    <div class="question-card">

      <div class="category" id="category"></div>

      <div class="question-number" id="questionNumber"></div>

      <div class="question" id="questionText"></div>

      <div class="options" id="options"></div>

      <div class="explanation" id="explanation">
        <div class="explanation-title">Explanation</div>
        <div id="explanationText"></div>
        <div class="answer-status" id="answerStatus"></div>
      </div>

      <div class="navigation">
        <button class="nav-btn prev" id="prevBtn" onclick="previousQuestion()">
          ← Previous
        </button>

        <button class="nav-btn next" id="nextBtn" onclick="nextQuestion()">
          Next →
        </button>
      </div>

    </div>

  </main>

  <section class="result" id="result">
    <h2>🎯 Test Result</h2>

    <div class="score-circle">
      <strong id="score">0</strong>
      <span>Marks</span>
    </div>

    <div class="result-grid">
      <div class="result-box correct">
        Correct<br>
        <span id="correctCount">0</span>
      </div>

      <div class="result-box wrong">
        Wrong<br>
        <span id="wrongCount">0</span>
      </div>

      <div class="result-box skipped">
        Skipped<br>
        <span id="skippedCount">0</span>
      </div>
    </div>

    <p id="resultMessage"></p>

    <br>

    <button class="restart" onclick="restartQuiz()">
      Restart Test
    </button>
  </section>

</div>

<script>

/* =========================================================
   QUESTION DATA
   correct = 0 means A
   correct = 1 means B
   correct = 2 means C
   correct = 3 means D
========================================================= */

const questions = [

{
cat:"Basic Organic Chemistry",
q:"कार्बन का वह विशिष्ट लक्षण क्या है, जो इसके अधिक संख्या में कार्बनिक यौगिकों के निर्माण का कारण बनता है?",
o:["विलेयता","चतुःसंयोजकता (tetravalency) और श्रृंखलन दोनों","केवल श्रृंखलन","केवल चतुःसंयोजकता"],
correct:1,
e:"कार्बन की चतुःसंयोजकता और श्रृंखलन (catenation) दोनों उसे बड़ी संख्या में स्थिर कार्बनिक यौगिक बनाने में सक्षम बनाते हैं।"
},

{
cat:"Basic Organic Chemistry",
q:"एथेनॉल (Ethanol) को सांद्र सल्फ्यूरिक अम्ल की अधिकता में 443 K पर गर्म करने पर एथीन (ethene) प्राप्त होता है। होने वाला रासायनिक परिवर्तन __________ होगा।",
o:["हैलोजनन","अपचयन","निर्जलीकरण","ऑक्सीकरण"],
correct:2,
e:"443 K पर सांद्र H₂SO₄ की उपस्थिति में एथेनॉल से जल निकलता है और एथीन बनता है। इसे निर्जलीकरण (dehydration) कहते हैं।"
},

{
cat:"Basic Organic Chemistry",
q:"दिए गए यौगिकों में से, किसका उपयोग ईंधन योज्य के रूप में किया जाता है?",
o:["एथेन (Ethane)","एथेनैल (Ethanal)","एथेनॉइक अम्ल (Ethanoic acid)","एथेनॉल (Ethanol)"],
correct:3,
e:"एथेनॉल को ईंधन तथा पेट्रोल के साथ ईंधन योज्य के रूप में उपयोग किया जाता है।"
},

{
cat:"Basic Organic Chemistry",
q:"कार्बन परमाणुओं का कौन-सा अद्वितीय गुण, उन्हें अन्य कार्बन परमाणुओं के साथ लंबी और स्थिर श्रृंखला बनाने में सक्षम बनाता है?",
o:["अपररूपता (Allotropy)","चतुःसंयोजकता (Tetravalency)","श्रृंखलन (Catenation)","समावयवता (Isomerism)"],
correct:2,
e:"एक ही तत्व के परमाणुओं के बीच स्थिर सहसंयोजक बंध बनाकर लंबी श्रृंखला बनाने की क्षमता को श्रृंखलन कहते हैं।"
},

{
cat:"Basic Organic Chemistry",
q:"कार्बन के दो मुख्य गुणधर्म क्या हैं जो इसकी 'विविधतायुक्त प्रकृति' और बड़ी संख्या में यौगिक बनाने की क्षमता में योगदान करते हैं?",
o:["श्रृंखलन और चतुःसंयोजकता","सुचालकता और ध्वानिक प्रकृति","समावयवता और अपररूपता","उच्च गलनांक और तन्यता"],
correct:0,
e:"कार्बन की विविधता का मुख्य कारण चतुःसंयोजकता और श्रृंखलन है।"
},

{
cat:"Basic Organic Chemistry",
q:"कौन-सा कथन कार्बन की विविधता युक्त प्रकृति से संबंधित नहीं है?",
o:["इसमें श्रृंखलन होता है।","इसमें एकल, द्वि और त्रिबंध हो सकते हैं।","यह चतुःसंयोजी है।","यह आयनिक रूप से बंध बना सकता है।"],
correct:3,
e:"कार्बन की विविधता मुख्यतः चतुःसंयोजकता, श्रृंखलन और विभिन्न प्रकार के सहसंयोजक बंधों के कारण है। आयनिक बंध इसकी विविधता का मुख्य कारण नहीं है।"
},

{
cat:"Basic Organic Chemistry",
q:"कार्बनिक यौगिक में सदैव निम्नलिखित में से क्या होता है?",
o:["कम से कम एक कार्बन परमाणु","सिलिकॉन और फॉस्फोरस परमाणु","हाइड्रोजन, ऑक्सीजन और नाइट्रोजन","हैलोजन और उत्कृष्ट गैसें"],
correct:0,
e:"कार्बनिक यौगिकों की मूल विशेषता उनमें कार्बन की उपस्थिति है।"
},

{
cat:"Basic Organic Chemistry",
q:"कार्बन परमाणु का कौन-सा गुण, एक कार्बन परमाणु को अन्य कार्बन परमाणुओं के साथ आबंध बनाने में सक्षम बनाता है?",
o:["समावयवन","बहुलकन","श्रृंखलन","संयोजकता"],
correct:2,
e:"कार्बन द्वारा स्वयं के परमाणुओं के साथ बंध बनाकर श्रृंखला बनाने की क्षमता को श्रृंखलन (catenation) कहते हैं।"
},

{
cat:"Basic Organic Chemistry",
q:"कार्बन लंबी श्रृंखलाएं बना सकता है, क्योंकि यह __________ प्रदर्शित करता है तथा __________ दर्शाता है।",
o:["विद्युतऋणात्मकता; चतुःसंयोजकता","चतुःसंयोजकता; श्रृंखलन","द्विआबंध; त्रिआबंध","त्रिसंयोजकता; श्रृंखलन"],
correct:1,
e:"कार्बन चतुःसंयोजी है और कार्बन-कार्बन बंध बनाकर श्रृंखलन प्रदर्शित करता है।"
},

{
cat:"Basic Organic Chemistry",
q:"जब एथेनॉल सांद्र H₂SO₄ की उपस्थिति में एथेनॉइक एसिड के साथ अभिक्रिया करता है तो __________ उत्पन्न होता है।",
o:["एस्टर","एल्डिहाइड","कीटोन","एल्कोहॉल"],
correct:0,
e:"एथेनॉल और एथेनॉइक अम्ल की सांद्र H₂SO₄ की उपस्थिति में अभिक्रिया से एस्टर बनता है।"
},

{
cat:"Basic Organic Chemistry",
q:"कार्बन अपने दो विशिष्ट गुणों के कारण बहुत बड़ी संख्या में यौगिक बनाता है। निम्नलिखित में से कौन इन गुणों की सही पहचान करता है?",
o:["उच्च गलनांक और तन्यता","श्रृंखलन और चतुःसंयोजकता","अपररूपता और समावयवता","अच्छी चालकता और ध्वानिक प्रकृति"],
correct:1,
e:"कार्बन की चतुःसंयोजकता और श्रृंखलन इसकी बड़ी संख्या में यौगिक बनाने की मुख्य वजह हैं।"
},

{
cat:"Basic Organic Chemistry",
q:"कार्बन कई यौगिकों का निर्माण करता है, इसका कारण निम्नलिखित में से क्या है?",

/* =========================================================
   STATE
========================================================= */

let current = 0;
let answers = new Array(questions.length).fill(null);

/* =========================================================
   ELEMENTS
========================================================= */

const categoryEl = document.getElementById("category");
const questionNumberEl = document.getElementById("questionNumber");
const questionTextEl = document.getElementById("questionText");
const optionsEl = document.getElementById("options");
const explanationEl = document.getElementById("explanation");
const explanationTextEl = document.getElementById("explanationText");
const answerStatusEl = document.getElementById("answerStatus");

const progressTextEl = document.getElementById("progressText");
const attemptTextEl = document.getElementById("attemptText");
const progressFillEl = document.getElementById("progressFill");

const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");

const paletteGrid = document.getElementById("paletteGrid");
const quizArea = document.getElementById("quizArea");
const resultEl = document.getElementById("result");

/* =========================================================
   LOAD QUESTION
========================================================= */

function loadQuestion(){

  const q = questions[current];
  const selected = answers[current];

  categoryEl.textContent = q.cat;

  questionNumberEl.textContent =
    "Q" + (current + 1);

  questionTextEl.innerHTML = q.q;

  optionsEl.innerHTML = "";

  const letters = ["A","B","C","D"];

  q.o.forEach((option,index)=>{

    const div = document.createElement("div");

    div.className = "option";

    div.innerHTML =
      '<span class="letter">'+letters[index]+'</span>' +
      option;

    if(selected !== null){

      div.classList.add("disabled");

      if(index === q.correct){
        div.classList.add("correct");
      }

      if(index === selected && selected !== q.correct){
        div.classList.add("wrong");
      }

    }else{

      div.onclick = function(){
        selectAnswer(index);
      };

    }

    optionsEl.appendChild(div);
  });

  if(selected !== null){

    explanationEl.classList.add("show");

    explanationTextEl.innerHTML = q.e;

    if(selected === q.correct){

      answerStatusEl.innerHTML =
        "✓ Correct Answer: " +
        letters[q.correct];

      answerStatusEl.className =
        "answer-status status-correct";

    }else{

      answerStatusEl.innerHTML =
        "✗ Correct Answer: " +
        letters[q.correct];

      answerStatusEl.className =
        "answer-status status-wrong";
    }

  }else{

    explanationEl.classList.remove("show");
    explanationTextEl.innerHTML = "";
    answerStatusEl.innerHTML = "";
  }

  progressTextEl.textContent =
    "Question " + (current + 1) +
    " of " + questions.length;

  const attempted =
    answers.filter(x => x !== null).length;

  attemptTextEl.textContent =
    "Attempted: " + attempted;

  progressFillEl.style.width =
    ((current + 1) / questions.length * 100) + "%";

  prevBtn.disabled = current === 0;

  if(current === questions.length - 1){
    nextBtn.textContent = "Finish Test ✓";
  }else{
    nextBtn.textContent = "Next →";
  }

  updatePalette();
}

/* =========================================================
   SELECT ANSWER
========================================================= */

function selectAnswer(index){

  if(answers[current] !== null) return;

  answers[current] = index;

  loadQuestion();

  updatePalette();
}

/* =========================================================
   NEXT
========================================================= */

function nextQuestion(){

  if(current === questions.length - 1){

    showResult();

    return;
  }

  current++;

  loadQuestion();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}

/* =========================================================
   PREVIOUS
========================================================= */

function previousQuestion(){

  if(current === 0) return;

  current--;

  loadQuestion();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}

/* =========================================================
   PALETTE
========================================================= */

function buildPalette(){

  paletteGrid.innerHTML = "";

  questions.forEach((q,index)=>{

    const button =
      document.createElement("button");

    button.className = "palette-item";

    button.textContent = index + 1;

    button.onclick = function(){

      current = index;

      loadQuestion();

      togglePalette(false);

      window.scrollTo({
        top:0,
        behavior:"smooth"
      });

    };

    paletteGrid.appendChild(button);
  });
}

function updatePalette(){

  const items =
    document.querySelectorAll(".palette-item");

  items.forEach((item,index)=>{

    item.className = "palette-item";

    if(answers[index] !== null){

      if(answers[index] === questions[index].correct){
        item.classList.add("correct");
      }else{
        item.classList.add("wrong");
      }

    }else{

      item.classList.add("skipped");

    }

    if(index === current){
      item.classList.add("current");
    }

  });
}

/* =========================================================
   PALETTE TOGGLE
========================================================= */

function togglePalette(force){

  const panel =
    document.getElementById("palettePanel");

  if(typeof force === "boolean"){

    if(force){
      panel.classList.add("show");
    }else{
      panel.classList.remove("show");
    }

  }else{

    panel.classList.toggle("show");

  }
}

/* =========================================================
   RESULT
========================================================= */

function showResult(){

  let correct = 0;
  let wrong = 0;
  let skipped = 0;

  answers.forEach((answer,index)=>{

    if(answer === null){
      skipped++;
    }
    else if(answer === questions[index].correct){
      correct++;
    }
    else{
      wrong++;
    }

  });

  document.getElementById("score").textContent =
    correct;

  document.getElementById("correctCount").textContent =
    correct;

  document.getElementById("wrongCount").textContent =
    wrong;

  document.getElementById("skippedCount").textContent =
    skipped;

  document.getElementById("resultMessage").innerHTML =
    "<b>Total Questions:</b> " + questions.length +
    "<br><b>No Negative Marking</b>";

  quizArea.style.display = "none";
  resultEl.style.display = "block";

  document.getElementById("palettePanel")
    .classList.remove("show");

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}

/* =========================================================
   RESTART
========================================================= */

function restartQuiz(){

  current = 0;

  answers =
    new Array(questions.length).fill(null);

  quizArea.style.display = "block";
  resultEl.style.display = "none";

  loadQuestion();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}

/* =========================================================
   INITIALIZE
========================================================= */

buildPalette();
loadQuestion();

</script>

}

  border-color:#2563a6;
  background:#eaf2fb;
}

  background:#e2f5e8;
  border-color:#29934a;
}

.option.wrong{
  background:#fde7e7;
  border-color:#d33;
}

.option.disabled{

}

.explanation{
  display:none;
  margin-top:17px;
  border-top:2px solid #e5e9ed;
  padding-top:15px;
}

.explanation.show{
  display:block;
}

.exp-title{
  color:#123b6d;
  font-weight:bold;
  margin-bottom:7px;
}

.exp-box{
  background:#f7f9fb;
  border-left:4px solid #2563a6;
  padding:12px;
  border-radius:5px;

.score{

.review{

let current = 0;
let answers = new Array(questions.length).fill(null);

function togglePalette(){
  document.getElementById("palette").classList.toggle("show");
}

function buildPalette(){
  const grid = document.getElementById("paletteGrid");
  grid.innerHTML = "";

  questions.forEach((q,i)=>{
    const b = document.createElement("button");
    b.className = "pal";
    b.textContent = i+1;
    b.id = "pal-"+i;

    if(i===current) b.classList.add("current");
    if(answers[i]!==null) b.classList.add("answered");

    b.onclick = ()=>{
      current=i;
      renderQuestion();
      document.getElementById("palette").classList.remove("show");
    };

    grid.appendChild(b);
  });
}

function renderQuestion(){

  const q = questions[current];

  document.getElementById("progress").textContent =
    `Question ${current+1} / ${questions.length}`;

  const card = document.getElementById("questionCard");

  let html = `
    <div class="chapter">${q.chapter}</div>
    <div class="question-no">Question ${current+1}</div>
    <div class="question">${q.q}</div>

    <div class="options">
  `;

  q.o.forEach((option,i)=>{

    let cls = "option";

    if(answers[current]!==null){
      cls += " disabled";

      if(i===q.a) cls += " correct";
      if(i===answers[current] && i!==q.a) cls += " wrong";
    }

    if(i===answers[current] && i!==q.a){
      cls += " selected";
    }

    if(i===answers[current] && i===q.a){
      cls += " selected";
    }

    html += `
      <div class="${cls}" onclick="selectAnswer(${i})">
        <b>${String.fromCharCode(65+i)}.</b> ${option}
      </div>
    `;
  });

  html += `</div>`;

  if(answers[current]!==null){

    html += `
      <div class="explanation show">
        <div class="exp-title">📘 Systematic Explanation</div>
        <div class="exp-box">
    `;

    if(q.num){

      html += `
        <div class="given"><b>Given:</b> ${q.given}</div>
        <div class="formula"><b>Formula:</b> ${q.formula}</div>
        <div class="calculation"><b>Calculation:</b> ${q.calculation}</div>
        <div class="conclusion"><b>Conclusion:</b> ${q.conclusion}</div>
      `;

    }else{

      html += `<div>${q.e}</div>`;

    }

    html += `
        </div>
      </div>
    `;
  }

  card.innerHTML = html;

  document.getElementById("prevBtn").disabled = current===0;

  document.getElementById("nextBtn").textContent =
    current===questions.length-1 ? "Submit Test" : "Next";

  buildPalette();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}

function selectAnswer(index){

  if(answers[current]!==null) return;

  answers[current] = index;

  renderQuestion();
}

function previousQuestion(){

  if(current>0){
    current--;
    renderQuestion();
  }
}

function nextQuestion(){

  if(current < questions.length-1){

    current++;
    renderQuestion();

  }else{

    showResult();

  }
}

function showResult(){

  let correct = 0;
  let attempted = 0;

  questions.forEach((q,i)=>{
    if(answers[i]!==null){
      attempted++;
      if(answers[i]===q.a) correct++;
    }
  });

  const wrong = attempted-correct;
  const unanswered = questions.length-attempted;

  const result = document.getElementById("result");

  let review = "";

  questions.forEach((q,i)=>{

    let status = "Not Attempted";

    if(answers[i]!==null){
      status = answers[i]===q.a
        ? "Correct"
        : "Wrong";
    }

    review += `
      <div class="review-item">
        <b>Q${i+1}.</b> ${status}
        ${answers[i]!==null
          ? ` | Your Answer: ${String.fromCharCode(65+answers[i])}
             | Correct: ${String.fromCharCode(65+q.a)}`
          : ` | Correct: ${String.fromCharCode(65+q.a)}`
        }
      </div>
    `;
  });

  result.innerHTML = `
    <h2>🎯 Test Result</h2>

    <div class="score">
      ${correct} / ${questions.length}
    </div>

    <p><b>Attempted:</b> ${attempted}</p>
    <p><b>Correct:</b> ${correct}</p>
    <p><b>Wrong:</b> ${wrong}</p>
    <p><b>Unanswered:</b> ${unanswered}</p>

    <div class="review">
      <h3>Question-wise Result</h3>
      ${review}
    </div>
  `;

  result.style.display="block";

  result.scrollIntoView({
    behavior:"smooth"
  });
}

buildPalette();
renderQuestion();

</script>

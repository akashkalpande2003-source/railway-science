<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Class 10 Science | Magnetic Effects & Domestic Electricity | TCS Mock Test</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:"Noto Sans Devanagari","Mangal",Arial,sans-serif;
    background:#f3f6fa;
    color:#172033;
    min-height:100vh;
}

.header{
    background:#172b4d;
    color:white;
    padding:16px 18px;
    text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.header h1{
    font-size:21px;
    line-height:1.4;
}

.header p{
    font-size:13px;
    opacity:.9;
    margin-top:4px;
}

.main{
    width:min(900px,calc(100% - 24px));
    margin:20px auto 40px;
}

.question-card{
    background:white;
    border-radius:12px;
    box-shadow:0 3px 14px rgba(0,0,0,.08);
    overflow:hidden;
}

.question-top{
    padding:17px 18px;
    border-bottom:1px solid #e5e9ef;
}

.q-number{
    font-size:14px;
    font-weight:700;
    color:#2457a6;
    margin-bottom:9px;
}

.question{
    font-size:18px;
    font-weight:600;
    line-height:1.65;
}

.options{
    padding:14px 18px 8px;
}

.option{
    display:flex;
    align-items:flex-start;
    gap:10px;
    width:100%;
    text-align:left;
    background:#fff;
    border:1.5px solid #d9e0e8;
    border-radius:9px;
    padding:12px 13px;
    margin-bottom:10px;
    cursor:pointer;
    font-size:15px;
    line-height:1.55;
    transition:.15s;
}

.option:hover{
    border-color:#3574c7;
    background:#f7faff;
}

.option-letter{
    min-width:27px;
    height:27px;
    border-radius:50%;
    background:#edf2f8;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    color:#26384f;
}

.option.correct{
    background:#eaf8ef;
    border-color:#28a745;
    color:#146b2d;
}

.option.correct .option-letter{
    background:#28a745;
    color:white;
}

.option.wrong{
    background:#fff0f0;
    border-color:#dc3545;
    color:#a61e2d;
}

.option.wrong .option-letter{
    background:#dc3545;
    color:white;
}

.option.disabled{
    cursor:default;
}

.explanation{
    display:none;
    margin:5px 18px 16px;
    border-left:4px solid #2457a6;
    background:#f3f7fc;
    padding:12px 14px;
    border-radius:0 8px 8px 0;
    font-size:14px;
    line-height:1.65;
}

.explanation.show{
    display:block;
}

.explanation strong{
    color:#173d70;
}

.nav{
    display:flex;
    justify-content:space-between;
    gap:12px;
    margin-top:15px;
}

.nav button,
.result-btn{
    border:0;
    border-radius:8px;
    padding:12px 22px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
}

.prev{
    background:#e5eaf0;
    color:#26364b;
}

.next{
    background:#2457a6;
    color:white;
    margin-left:auto;
}

.nav button:disabled{
    opacity:.45;
    cursor:not-allowed;
}

/* Palette */
.palette-btn{
    position:fixed;
    right:14px;
    top:78px;
    z-index:1000;
    width:48px;
    height:48px;
    border:0;
    border-radius:50%;
    background:#172b4d;
    color:white;
    font-size:21px;
    cursor:pointer;
    box-shadow:0 3px 12px rgba(0,0,0,.25);
}

.palette{
    position:fixed;
    right:14px;
    top:135px;
    width:300px;
    max-height:70vh;
    overflow-y:auto;
    background:white;
    border-radius:12px;
    padding:15px;
    box-shadow:0 5px 25px rgba(0,0,0,.22);
    z-index:999;
    display:none;
}

.palette.show{
    display:block;
}

.palette h3{
    font-size:16px;
    margin-bottom:12px;
    color:#172b4d;
}

.legend{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:12px;
    font-size:12px;
}

.legend span{
    display:flex;
    align-items:center;
    gap:4px;
}

.dot{
    width:12px;
    height:12px;
    border-radius:3px;
    display:inline-block;
}

.dot.correct{background:#28a745;}
.dot.wrong{background:#dc3545;}
.dot.skip{background:#dfe4ea;}

.palette-grid{
    display:grid;
    grid-template-columns:repeat(8,1fr);
    gap:6px;
}

.pal{
    height:32px;
    border:0;
    border-radius:5px;
    background:#e5e9ee;
    cursor:pointer;
    font-size:12px;
    font-weight:700;
}

.pal.correct{
    background:#28a745;
    color:white;
}

.pal.wrong{
    background:#dc3545;
    color:white;
}

.pal.current{
    outline:3px solid #2457a6;
    outline-offset:1px;
}

.pal.skipped{
    background:#dfe4ea;
    color:#526173;
}

/* Result */
.result{
    display:none;
    background:white;
    border-radius:14px;
    padding:25px 20px;
    text-align:center;
    box-shadow:0 3px 15px rgba(0,0,0,.1);
}

.result h2{
    color:#172b4d;
    margin-bottom:18px;
}

.score{
    font-size:32px;
    font-weight:800;
    color:#2457a6;
    margin-bottom:20px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.stat{
    padding:15px 8px;
    border-radius:9px;
    background:#f3f6fa;
}

.stat b{
    display:block;
    font-size:22px;
    margin-bottom:4px;
}

.correct-stat b{color:#28a745;}
.wrong-stat b{color:#dc3545;}
.skip-stat b{color:#6c757d;}

.restart{
    margin-top:20px;
    background:#172b4d;
    color:white;
}

/* Mobile */
@media(max-width:600px){
    .header{
        padding:13px 10px;
    }

    .header h1{
        font-size:17px;
    }

    .main{
        width:calc(100% - 12px);
        margin-top:12px;
    }

    .question-top{
        padding:14px;
    }

    .question{
        font-size:16px;
        line-height:1.6;
    }

    .options{
        padding:12px 12px 5px;
    }

    .option{
        font-size:14px;
        padding:10px;
    }

    .explanation{
        margin-left:12px;
        margin-right:12px;
    }

    .palette{
        right:8px;
        top:130px;
        width:calc(100% - 16px);
    }

    .palette-grid{
        grid-template-columns:repeat(7,1fr);
    }

    .palette-btn{
        right:10px;
        top:65px;
    }

    .stats{
        grid-template-columns:1fr 1fr 1fr;
    }

    .stat{
        padding:12px 5px;
        font-size:12px;
    }

    .stat b{
        font-size:19px;
    }
}
</style>
</head>

<body>

<header class="header">
    <h1>Class 10 Science — Magnetic Effects & Domestic Electricity</h1>
    <p>TCS Style Mock Test • 63 Questions • No Timer • No Negative Marking</p>
</header>

<button class="palette-btn" onclick="togglePalette()">☰</button>

<div class="palette" id="palette">
    <h3>Question Palette</h3>

    <div class="legend">
        <span><i class="dot correct"></i> Correct</span>
        <span><i class="dot wrong"></i> Wrong</span>
        <span><i class="dot skip"></i> Unattempted</span>
    </div>

    <div class="palette-grid" id="paletteGrid"></div>
</div>

<main class="main">

    <section class="question-card" id="quizCard">

        <div class="question-top">
            <div class="q-number" id="qNumber"></div>
            <div class="question" id="question"></div>
        </div>

        <div class="options" id="options"></div>

        <div class="explanation" id="explanation"></div>

    </section>

    <div class="nav" id="navigation">
        <button class="prev" id="prevBtn" onclick="previousQuestion()">← Previous</button>
        <button class="next" id="nextBtn" onclick="nextQuestion()">Next →</button>
    </div>

    <section class="result" id="result">
        <h2>Test Completed</h2>

        <div class="score" id="score"></div>

        <div class="stats">
            <div class="stat correct-stat">
                <b id="correctCount">0</b>
                Correct
            </div>

            <div class="stat wrong-stat">
                <b id="wrongCount">0</b>
                Wrong
            </div>

            <div class="stat skip-stat">
                <b id="skipCount">0</b>
                Skipped
            </div>
        </div>

        <button class="result-btn restart" onclick="restartTest()">
            Restart Test
        </button>
    </section>

</main>

<script>

const questions = [

{
q:"फ्लेमिंग के बाएं हाथ के नियम का उपयोग विद्युत मोटर में गति की दिशा निर्धारित करने के लिए किया जाता है। कौन सी उंगली बल या गति की दिशा दर्शाती है?",
o:["मध्यांगुलि (Middle finger)","तर्जनी (Index finger)","कनिष्ठिका (Little finger)","अँगूठा (Thumb)"],
a:3,
e:"फ्लेमिंग के वाम-हस्त नियम में अंगूठा चालक पर लगने वाले बल या गति की दिशा बताता है। तर्जनी चुंबकीय क्षेत्र तथा मध्यमा धारा की दिशा बताती है।"
},

{
q:"चुंबकीय क्षेत्र में धारावाही चालक पर लगने वाले बल के बारे में निम्नलिखित में से कौन-सा कथन सही है?",
o:["बल चालक के प्रतिरोध पर निर्भर करता है।","किसी चालक पर बल चुंबकीय क्षेत्र की दिशा के अनुदिश होता है।","किसी धारावाही चालक पर लगने वाला बल चुंबकीय क्षेत्र में चालक की लंबाई के समानुपाती होता है।","यह बल चालक में प्रवाहित धारा से स्वतंत्र होता है।"],
a:2,
e:"धारावाही चालक पर बल F = BIL sinθ होता है। इसलिए समान परिस्थितियों में बल चालक की लंबाई और धारा के समानुपाती होता है।"
},

{
q:"धारावाही चालक पर बल की दिशा ज्ञात करने के लिए किस नियम का उपयोग किया जाता है?",
o:["फ्लेमिंग का दक्षिण-हस्तनियम (Fleming's right-hand rule)","लेंज का नियम (Lenz's law)","फ्लेमिंग का वाम-हस्तनियम (Fleming's left-hand rule)","ओम का नियम (Ohm's law)"],
a:2,
e:"फ्लेमिंग का वाम-हस्त नियम चुंबकीय क्षेत्र में रखे धारावाही चालक पर लगने वाले बल या गति की दिशा बताता है।"
},

{
q:"निम्नलिखित में से कौन-सा डिवाइस, चुंबकीय क्षेत्र में धारा-वाही चालक पर बल के सिद्धांत पर कार्य करता है?",
o:["ट्रांसफॉर्मर","विद्युत मोटर","विद्युत जनित्र","प्रतिरोधक"],
a:1,
e:"विद्युत मोटर चुंबकीय क्षेत्र में धारावाही चालक पर लगने वाले बल के सिद्धांत पर कार्य करती है।"
},

{
q:"दिए गए कथनों को ध्यानपूर्वक पढ़ें और सही विकल्प का चयन करें। कथन 1: फ्लेमिंग के वामहस्त नियम का उपयोग चुंबकीय क्षेत्र में रखे धारावाही चालक पर बल (गति) की दिशा ज्ञात करने के लिए किया जाता है। कथन 2: चालक पर बल, धारा और चुंबकीय क्षेत्र दोनों के लंबवत कार्य करता है।",
o:["कथन 1 सही है, लेकिन 2 गलत है।","कथन 1 और 2 दोनों सही हैं।","कथन 1 गलत है, लेकिन कथन 2 सही है।","कथन 1 और 2 दोनों गलत हैं।"],
a:1,
e:"दोनों कथन सही हैं। फ्लेमिंग का वामहस्त नियम बल की दिशा बताता है और चुंबकीय बल धारा तथा चुंबकीय क्षेत्र दोनों के लंबवत होता है।"
},

{
q:"एक सीधा चालक +x-दिशा में धारा वहन कर रहा है। इस चालक को +y-दिशा में स्थित एक चुंबकीय क्षेत्र में रखा गया है। चालक की गति की दिशा क्या होगी?",
o:["ऋणात्मक y दिशा","धनात्मक x दिशा","धनात्मक z दिशा","ऋणात्मक x दिशा"],
a:2,
e:"बल की दिशा F = I(L × B) से निर्धारित होती है। +x × +y = +z, इसलिए गति/बल की दिशा +z होगी।"
},

{
q:"दैनिक जीवन में, धारा-वाही चालक पर बल के सिद्धांत का उपयोग निम्नलिखित में से किस उपकरण में किया जाता है?",
o:["विद्युत घंटी","विद्युत मोटर","विद्युत हीटर","विद्युत फ्यूज"],
a:1,
e:"विद्युत मोटर में धारावाही चालक चुंबकीय क्षेत्र में बल का अनुभव करता है।"
},

{
q:"चुंबकीय क्षेत्र में रखे धारावाही चालक पर लगने वाले बल की दिशा की पहचान करने में कौन-सा नियम सहायक होता है?",
o:["मैक्सवेल का कॉर्कस्क्रू नियम","ओम का नियम","फ्लेमिंग का वामहस्त नियम","दक्षिण-हस्त अंगुष्ठ नियम"],
a:2,
e:"फ्लेमिंग का वामहस्त नियम चुंबकीय क्षेत्र में धारावाही चालक पर लगने वाले बल की दिशा बताता है।"
},

{
q:"एकसमान चुंबकीय क्षेत्र में रखे धारावाही चालक पर लगने वाले बल का परिमाण किस स्थानिक स्थिति में सर्वाधिक पाया जाता है?",
o:["जब धारा में तात्कालिक परिवर्तन हो।","जब धारा और क्षेत्र समानांतर हों।","जब धारा चुम्बक के दक्षिणी ध्रुव की ओर प्रवाहित हो।","जब धारा और क्षेत्र एक दूसरे के लंबवत हों।"],
a:3,
e:"F = BIL sinθ. जब धारा और चुंबकीय क्षेत्र 90° पर होते हैं, sin90° = 1 और बल अधिकतम होता है।"
},

{
q:"एक सोलेनॉइड चुंबक की तरह व्यवहार करता है क्योंकि ..............।",
o:["यह बिजली संग्रहीत करता है","इसका प्रतिरोध उच्च होता है","इसमें अंदर लोहा होता है","इसके फेरों में प्रवाहित धारा एक चुंबकीय क्षेत्र उत्पन्न करती है"],
a:3,
e:"सोलेनॉइड के फेरों में धारा प्रवाहित होने पर चुंबकीय क्षेत्र उत्पन्न होता है, जिसके कारण वह छड़ चुंबक जैसा व्यवहार करता है।"
},

{
q:"किसी परिनालिका के अन्दर चुंबकीय क्षेत्र के बारे में निम्नलिखित में से कौन-सा कथन सत्य है?",
o:["यह असमान होता है।","यह एकसमान समान्तर सीधी रेखाओं के रूप में होता है।","यह शून्य होता है।","यह यादृच्छिक पैटर्न बनाता है।"],
a:1,
e:"लंबी परिनालिका के अंदर चुंबकीय क्षेत्र लगभग एकसमान होता है और क्षेत्र रेखाएं समानांतर तथा समान दूरी पर होती हैं।"
},

{
q:"धारावाही वृत्ताकार लूप के केंद्र पर चुंबकीय क्षेत्र ______________ के अनुक्रमानुपाती होता है।",
o:["लूप से प्रवाहित धारा के व्युत्क्रम","वृत्ताकार लूप की त्रिज्या के वर्ग","लूप से प्रवाहित धारा के वर्ग","लूप से प्रवाहित धारा"],
a:3,
e:"वृत्ताकार लूप के केंद्र पर B = μ₀I/2R होता है। इसलिए चुंबकीय क्षेत्र धारा I के समानुपाती होता है।"
},

{
q:"कौन-सा नियम धारावाही लूप के अंदर चुंबकीय क्षेत्र की दिशा निर्धारित करने में मदद करता है?",
o:["दाहिने हाथ के अंगूठे का नियम","बाएं हाथ के अंगूठे का नियम","फ्लेमिंग का दाएं हाथ का नियम","फ्लेमिंग का बाएं हाथ का नियम"],
a:0,
e:"दाहिने हाथ के अंगूठे के नियम से धारा की दिशा और उससे संबंधित चुंबकीय क्षेत्र की दिशा निर्धारित की जा सकती है।"
},

{
q:"धारावाही वृत्तीय लूप के केंद्र पर चुंबकीय क्षेत्र की दिशा .............. के द्वारा निर्धारित की जा सकती है।",

/* Original question numbers */
const originalNumbers = [
19,20,21,22,23,24,25,26,27,
67,68,69,70,71,72,73,74,75,76,77,78,79,80,81,82,83,84,85,86,87,88,89,90,91,92,93,94,95,96,97,98,99,100,101,102,103,104,105,106,107,108,109,110,111,112,113,114,115,116,117,118,119,120
];

let current = 0;

/*
status:
- null = unattempted
- correct = correct
- wrong = wrong
*/
let status = Array(questions.length).fill(null);
let selected = Array(questions.length).fill(null);

const qNumber = document.getElementById("qNumber");
const question = document.getElementById("question");
const options = document.getElementById("options");
const explanation = document.getElementById("explanation");
const paletteGrid = document.getElementById("paletteGrid");

function createPalette(){

    paletteGrid.innerHTML = "";

    questions.forEach((_,i)=>{

        const btn = document.createElement("button");

        btn.className = "pal";

        btn.textContent = i + 1;

        btn.onclick = ()=>{
            current = i;
            renderQuestion();
            document.getElementById("palette").classList.remove("show");
        };

        paletteGrid.appendChild(btn);
    });

    updatePalette();
}

function updatePalette(){

    const buttons = document.querySelectorAll(".pal");

    buttons.forEach((btn,i)=>{

        btn.className = "pal";

        if(status[i] === "correct"){
            btn.classList.add("correct");
        }

        if(status[i] === "wrong"){
            btn.classList.add("wrong");
        }

        if(status[i] === null){
            btn.classList.add("skipped");
        }

        if(i === current){
            btn.classList.add("current");
        }
    });
}

function renderQuestion(){

    const q = questions[current];

    qNumber.textContent =
        `Question ${current + 1} of ${questions.length}  •  Q${originalNumbers[current]}`;

    question.textContent = q.q;

    options.innerHTML = "";

    q.o.forEach((opt,index)=>{

        const btn = document.createElement("button");

        btn.className = "option";

        btn.innerHTML = `
            <span class="option-letter">${String.fromCharCode(65+index)}</span>
            <span>${opt}</span>
        `;

        btn.onclick = ()=>selectOption(index);

        if(selected[current] !== null){

            btn.classList.add("disabled");

            if(index === q.a){
                btn.classList.add("correct");
            }

            if(index === selected[current] && index !== q.a){
                btn.classList.add("wrong");
            }
        }

        options.appendChild(btn);
    });

    if(selected[current] !== null){

        explanation.classList.add("show");

        explanation.innerHTML =
            `<strong>Explanation:</strong> ${q.e}`;

    }else{

        explanation.classList.remove("show");
        explanation.innerHTML = "";
    }

    document.getElementById("prevBtn").disabled = current === 0;

    document.getElementById("nextBtn").textContent =
        current === questions.length - 1 ? "Submit Test ✓" : "Next →";

    updatePalette();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}

function selectOption(index){

    if(selected[current] !== null) return;

    selected[current] = index;

    if(index === questions[current].a){
        status[current] = "correct";
    }else{
        status[current] = "wrong";
    }

    renderQuestion();
}

function previousQuestion(){

    if(current > 0){
        current--;
        renderQuestion();
    }
}

function nextQuestion(){

    if(current < questions.length - 1){

        current++;
        renderQuestion();

    }else{

        showResult();
    }
}

function togglePalette(){

    document.getElementById("palette").classList.toggle("show");
}

function showResult(){

    document.getElementById("quizCard").style.display = "none";
    document.getElementById("navigation").style.display = "none";
    document.getElementById("palette").classList.remove("show");
    document.getElementById("result").style.display = "block";

    const correct =
        status.filter(x=>x==="correct").length;

    const wrong =
        status.filter(x=>x==="wrong").length;

    const skipped =
        status.filter(x=>x===null).length;

    const attempted = correct + wrong;

    document.getElementById("correctCount").textContent = correct;
    document.getElementById("wrongCount").textContent = wrong;
    document.getElementById("skipCount").textContent = skipped;

    document.getElementById("score").textContent =
        `${correct} / ${questions.length}`;

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}

function restartTest(){

    current = 0;

    status = Array(questions.length).fill(null);
    selected = Array(questions.length).fill(null);

    document.getElementById("result").style.display = "none";
    document.getElementById("quizCard").style.display = "block";
    document.getElementById("navigation").style.display = "flex";

    renderQuestion();
}

/* Start */
createPalette();
renderQuestion();

</script>

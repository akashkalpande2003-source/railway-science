<style>
*{

body{

/* HEADER */
.header{
  background:#123b6d;

}

}

  font-size:12px;

/* PROGRESS */
.progress-wrap{

}

.progress-info{

.progress{

}

.progress-bar{

.question-card{

}

.question-head{

}

.question-body{

}

.question{

}

.option{

  margin:7px 0;

  border-radius:5px;

  font-size:14px;

}

.option:hover{
  background:#f4f8fc;
  border-color:#2563a6;
}

.option input{
  margin-right:8px;

}

/* SELECTED */
.option.selected{

}

/* RESULT */
.result{

  border:1px solid #dfe4ea;

}

.result h2{
  color:#123b6d;
  margin-bottom:8px;
}

.score{

  color:#123b6d;
}

.result-details{
  margin-top:8px;
  font-size:14px;
}

/* SOLUTIONS */
.solution{
  display:none;
  margin-top:13px;
  padding:11px;
  border-left:4px solid #2563a6;
  background:#f4f8fc;
  border-radius:4px;
  font-size:14px;
}

.answer{
  font-weight:bold;
  color:#087f23;
}

.explanation{
  margin-top:4px;
}

/* BOTTOM NAV */
.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  background:#fff;
  border-top:1px solid #d5d9de;
  box-shadow:0 -2px 8px rgba(0,0,0,.12);
  z-index:1100;

}

.nav-inner{
  max-width:850px;
  margin:auto;
  display:flex;

  justify-content:center;
}

.nav-btn{

  border-radius:5px;

  flex:1;

}

.nav-btn:hover{

}

.nav-btn:disabled{

  cursor:not-allowed;

.submit-btn{

}

.submit-btn:hover{

}

}

<script>

const questions = [

{
q:`ऐनोड पंक (anode mud) क्या है?`,
options:[
`वैद्युतअपघटनी परिष्करण में विलयन में विलेय अशुद्धियाँ`,
`वैद्युतअपघटनी परिष्करण में कैथोड पर निक्षेपित अविलेय अशुद्धियाँ`,
`मृदा और जल का विलयन`,
`वैद्युतअपघटनी परिष्करण में एनोड पर निक्षेपित अविलेय अशुद्धियाँ`
],
answer:3,
explanation:`ऐनोड पंक वैद्युतअपघटनी परिष्करण के दौरान एनोड के नीचे जमा होने वाली अविलेय अशुद्धियाँ होती हैं।`
},

{
q:`निम्न में किसे धातुकर्म कहा जाता है?`,
options:[
`धातुओं को उनके अयस्कों से शुद्ध रूप में निकालना`,
`लोहे को जंग से बचाना`,
`सल्फाइड अयस्क को हवा की अधिकता में गर्म करना`,
`अयस्कों से अपअयस्क निकालना`
],
answer:0,
explanation:`अयस्कों से धातुओं के निष्कर्षण और उन्हें शुद्ध करने की प्रक्रिया को धातुकर्म (Metallurgy) कहते हैं।`
},

{
q:`ऐलुमिनियम की ऐनोडीकरण प्रक्रिया में सल्फ्यूरिक अम्ल की क्या भूमिका होती है?`,
options:[
`यह एक वैद्युत-अपघट्य के रूप में कार्य करता है जो मोटी ऑक्साइड परत बनाने में मदद करता है।`,
`यह ऐलुमिनियम के साथ अभिक्रिया करके ऐलुमिनियम क्लोराइड बनाता है।`,
`यह ऐलुमिनियम को पूरी तरह से विघटित कर देता है।`,
`यह ऐलुमिनियम के ऑक्सीकरण को रोकता है।`
],
answer:0,
explanation:`ऐनोडीकरण में सल्फ्यूरिक अम्ल का विलयन इलेक्ट्रोलाइट के रूप में कार्य करता है और ऐलुमिनियम की सतह पर मोटी सुरक्षात्मक ऑक्साइड परत बनाने में सहायता करता है।`
},

{
q:`निम्नलिखित में से कौन-सी परिष्करण विधियां व्यावसायिक दृष्टि से अत्यधिक महत्वपूर्ण हैं?`,
options:[
`विद्युत रासायनिक विधियां`,
`रासायनिक विधियां`,
`आयनिक विधियां`,
`भौतिक विधियां`
],
answer:0,
explanation:`धातुओं के परिष्करण में विद्युत-रासायनिक विधियाँ, विशेषकर विद्युतअपघटनी परिष्करण, व्यावसायिक रूप से महत्वपूर्ण हैं।`
},

{
q:`निम्नलिखित में से कौन-सी धातु, सक्रियता श्रेणी के मध्य में निष्कर्षित की जाती है?`,
options:[
`पोटैशियम`,
`सोडियम`,
`सोना`,
`लोहा`
],
answer:3,
explanation:`लोहा सक्रियता श्रेणी की मध्यम अभिक्रियाशील धातु है और इसके अयस्कों से इसे अपचयन द्वारा निकाला जाता है।`
},

{
q:`अयस्क से अपअयस्क (gangue) को हटाने के लिए उपयोग की जाने वाली प्रक्रियाएं, अपअयस्क और अयस्क के किन गुणों के बीच अंतर पर आधारित हैं?`,
options:[
`केवल रासायनिक`,
`केवल भौतिक`,
`अपवर्तनांक (Refrative index)`,
`रासायनिक या भौतिक`
],
answer:3,
explanation:`अयस्क और गैंग के रासायनिक या भौतिक गुणों में अंतर का उपयोग गैंग को हटाने के लिए किया जाता है।`
},

{
q:`निम्नलिखित में से कौन-सी धातु आसवन द्वारा शुद्ध की जाती है?`,
options:[
`लोहा`,
`चाँदी`,
`जस्ता`,
`ताँबा`
],
answer:2,
explanation:`जस्ता जैसी वाष्पशील धातुओं को आसवन द्वारा शुद्ध किया जा सकता है।`
},

{
q:`निम्नलिखित में से किस धात्विक ऑक्साइड को केवल गर्म करके धातु में अपचयित किया जा सकता है?`,
options:[
`मरक्यूरिक ऑक्साइड`,
`मैंगनीज ऑक्साइड`,
`आयरन (III) ऑक्साइड`,
`जिंक ऑक्साइड`
],
answer:0,
explanation:`मरक्यूरिक ऑक्साइड को गर्म करने पर यह पारा और ऑक्सीजन में विघटित हो जाता है।`
},

{
q:`धातुओं के वैद्युतअपघटनी परिष्करण की प्रक्रिया के दौरान, विद्युतअपघट्य से धारा प्रवाहित करने पर, ___________ से अशुद्ध धातु, विद्युत अपघट्य में विलीन हो जाती है।`,
options:[
`कैथोड`,
`एनोड`,
`एनोड और कैथोड दोनों`,
`लवण सेतु (salt bridge)`
],
answer:1,
explanation:`वैद्युतअपघटनी परिष्करण में अशुद्ध धातु का एनोड ऑक्सीकरण होकर इलेक्ट्रोलाइट में घुलता है।`
},

{
q:`वैद्युतअपघटनी परिष्करण के दौरान एनोड के रूप में किसको प्रयुक्त किया जाता है?`,
options:[
`ग्रेफाइट की एक छड़`,
`अशुद्ध धातु की एक पट्टी जिसे परिष्कृत किया जाना है`,
`एक अक्रिय इलेक्ट्रोड`,
`शुद्ध धातु की एक पट्टी जिसे परिष्कृत किया जाना है`
],
answer:1,
explanation:`विद्युतअपघटनी परिष्करण में अशुद्ध धातु की पट्टी को एनोड बनाया जाता है।`
},

{
q:`________ अयस्कों को भर्जन की प्रक्रिया द्वारा उनके संबंधित ऑक्साइडों में परिवर्तित किया जाता है।`,
options:[
`क्लोराइड`,
`कार्बोनेट`,
`सल्फाइट`,
`सल्फाइड`
],
answer:3,
explanation:`सल्फाइड अयस्कों को वायु की उपस्थिति में गर्म करके उनके संबंधित ऑक्साइडों में बदला जाता है। इसे भर्जन (Roasting) कहते हैं।`
},

{
q:`अयस्क से अवशेषांश (गैंग) को हटाने के लिए उपयोग की जाने वाली प्रक्रिया उनके रासायनिक या भौतिक गुणों के अंतर के आधार पर कार्य करती है और इसे अयस्कों का ________ कहा जाता है।`,
options:[
`समृद्धीकरण (enrichment)`,
`रंजन (colouring)`,
`भारण (weighing)`,
`पॉलिशन (polishing)`
],
answer:0,
explanation:`अयस्क से गैंग हटाकर उपयोगी खनिज का प्रतिशत बढ़ाने की प्रक्रिया अयस्कों का समृद्धीकरण या enrichment कहलाती है।`
},

{
q:`कॉपर के वैद्युतअपघटनी परिष्करण के लिए प्रयुक्त किया जाने वाला सबसे सामान्य वैद्युतअपघट्य, अम्लीकृत ________ का विलयन होगा।`,
options:[
`कॉपर ऑक्साइड`,
`कॉपर सल्फेट`,
`कॉपर कार्बोनेट`,
`कॉपर क्लोराइड`
],
answer:1,
explanation:`कॉपर के विद्युतअपघटनी परिष्करण में अम्लीकृत कॉपर सल्फेट (CuSO₄) का विलयन इलेक्ट्रोलाइट के रूप में प्रयोग किया जाता है।`
},

{
q:`किसी धातु के निष्कर्षण की विधि ________ पर निर्भर करती है।`,
options:[
`उसके परमाणु क्रमांक`,
`उसके रंग`,
`अभिक्रियाशीलता श्रेणी में उसकी स्थिति`,
`उसके द्रव्यमान संख्या`
],
answer:2,
explanation:`धातु की अभिक्रियाशीलता यह निर्धारित करती है कि उसे अयस्क से निकालने के लिए किस प्रकार की अपचयन विधि उपयोग की जाएगी।`
},

{
q:`अयस्कों से अपद्रव्यों को हटाने के लिए कौन-सी प्रक्रिया जानी जाती है?`,
options:[
`सांद्रण`,
`भर्जन`,
`प्रगलन`,
`परिष्करण`
],
answer:0,
explanation:`अयस्क से गैंग या अशुद्धियों को हटाने की प्रक्रिया को सांद्रण या अयस्क का enrichment कहा जाता है।`
},

{
q:`अयस्क में उपस्थित मिट्टी और रेत जैसी अवांछित अशुद्धियों को क्या कहते हैं?`,
options:[
`गालक (Flux)`,
`गैंग (Gangue)`,
`धातुमल (Slag)`,
`मिश्रधातु (Alloy)`
],
answer:1,
explanation:`अयस्क में उपस्थित मिट्टी, रेत आदि अवांछित अशुद्धियों को गैंग (Gangue) कहते हैं।`
},

{
q:`धातुओं का उनके अयस्कों से निष्कर्षण निम्नलिखित में से क्या कहलाता है?`,
options:[
`प्रगलन (Smelting)`,
`धातुकर्म (Metallurgy)`,
`परिष्करण (Refining)`,
`खनन (Mining)`
],
answer:1,
explanation:`अयस्कों से धातुओं के निष्कर्षण और शोधन की समग्र प्रक्रिया धातुकर्म कहलाती है।`
},

{
q:`निम्नलिखित में से कौन-सी विधि अयस्क संवर्धन (ore enrichment) के लिए उपयोग नहीं की जाती है?`,
options:[
`फेन प्लवन (Froth floatation)`,
`निक्षालन (Leaching)`,
`निकर्षण (Dredging)`,
`द्रवीय धावन (Hydraulic washing)`
],
answer:2,
explanation:`फेन प्लवन, निक्षालन और द्रवीय धावन अयस्क संवर्धन में प्रयुक्त विधियाँ हैं। निकर्षण (Dredging) सामान्य ore enrichment विधि नहीं है।`
},

{
q:`धातुकर्म में 'अयस्कों के संवर्धन' प्रक्रिया का मुख्य उद्देश्य क्या है?`,
options:[
`धातु को अन्य तत्वों के साथ मिलाकर मिश्रधातुएं बनाना।`,
`धातु अयस्क को उसके गलित रूप में रूपांतरित करना।`,
`निकाली गई धातु को परिष्कृत करके उसकी शुद्धता बढ़ाना।`,
`अयस्क से अवांछित अशुद्धियां (गैंग) हटाना।`

let currentQuestion = 0;
let submitted = false;

const quiz = document.getElementById("quiz");

function renderQuiz(){

  quiz.innerHTML = "";

  questions.forEach((item,index)=>{

    const card = document.createElement("div");
    card.className = "question-card";
    card.id = "q"+index;

    let optionsHTML = "";

    item.options.forEach((option,optIndex)=>{

      optionsHTML += `
        <label class="option" id="option-${index}-${optIndex}">
          <input
            type="radio"
            name="question${index}"
            value="${optIndex}"
            onchange="selectAnswer(${index},${optIndex})"
          >
          <span><b>${String.fromCharCode(65+optIndex)}.</b> ${option}</span>
        </label>
      `;
    });

    card.innerHTML = `
      <div class="question-head">
        Q${index+1} &nbsp; | &nbsp; ${index < 44 ? "Extraction & Metallurgy" : index < 53 ? "Nonmetals and uses" : index < 61 ? "Physical & Chemical Properties" : "Reactivity Series"}
      </div>

      <div class="question-body">

        <div class="question">
          ${index+1}. ${item.q}
        </div>

        <div class="options">
          ${optionsHTML}
        </div>

        <div class="solution" id="solution-${index}">
          <div class="answer">
            सही उत्तर: ${String.fromCharCode(65+item.answer)}
          </div>
          <div class="explanation">
            <b>Explanation:</b> ${item.explanation}
          </div>
        </div>

      </div>
    `;

    quiz.appendChild(card);
  });

  updateProgress();
}

function selectAnswer(questionIndex,optionIndex){

  if(submitted) return;

  const labels = document.querySelectorAll(`#q${questionIndex} .option`);

  labels.forEach((label,i)=>{
    label.classList.toggle("selected",i===optionIndex);
  });

  updateProgress();
}

function updateProgress(){

  let answered = 0;

  questions.forEach((q,index)=>{
    const selected = document.querySelector(`input[name="question${index}"]:checked`);
    if(selected) answered++;
  });

  document.getElementById("answeredText").textContent =
    "Answered: " + answered;

  document.getElementById("progressText").textContent =
    "Question " + (currentQuestion+1) + " of " + questions.length;

  const percentage =
    ((answered/questions.length)*100);

  document.getElementById("progressBar").style.width =
    Math.max(1,percentage) + "%";

  document.getElementById("prevBtn").disabled =
    currentQuestion===0;
}

function scrollToQuestion(index){

  if(index<0) index=0;

  if(index>=questions.length)
    index=questions.length-1;

  currentQuestion=index;

  const element=document.getElementById("q"+index);

  if(element){
    element.scrollIntoView({
      behavior:"smooth",
      block:"start"
    });
  }

  updateProgress();
}

function nextQuestion(){

  if(currentQuestion < questions.length-1){
    scrollToQuestion(currentQuestion+1);
  }
}

function previousQuestion(){

  if(currentQuestion > 0){
    scrollToQuestion(currentQuestion-1);
  }
}

function submitTest(){

  if(submitted) return;

  const confirmSubmit =
    confirm("क्या आप टेस्ट Submit करना चाहते हैं?");

  if(!confirmSubmit) return;

  submitted=true;

  let correct=0;
  let wrong=0;
  let unanswered=0;

  questions.forEach((item,index)=>{

    const selected =
      document.querySelector(`input[name="question${index}"]:checked`);

    const solution =
      document.getElementById("solution-"+index);

    solution.style.display="block";

    if(!selected){
      unanswered++;
      return;
    }

    const selectedValue=parseInt(selected.value);

    if(selectedValue===item.answer){
      correct++;
    }else{
      wrong++;
    }
  });

  /* 1/3 NEGATIVE MARKING */
  const score = correct - (wrong/3);

  document.getElementById("score").textContent =
    score.toFixed(2) + " / " + questions.length;

  document.getElementById("resultDetails").innerHTML =
    `
    सही उत्तर: <b>${correct}</b>
    &nbsp; | &nbsp;
    गलत उत्तर: <b>${wrong}</b>
    &nbsp; | &nbsp;
    छोड़े गए: <b>${unanswered}</b>
    <br>
    <small>गलत उत्तर पर 1/3 अंक की कटौती</small>
    `;

  document.getElementById("result").style.display="block";

  document.querySelectorAll("input").forEach(input=>{
    input.disabled=true;
  });

  document.querySelectorAll(".option").forEach(option=>{
    option.style.cursor="default";
  });

  document.getElementById("result")
    .scrollIntoView({
      behavior:"smooth",
      block:"start"
    });
}

/* INITIAL LOAD */
renderQuiz();

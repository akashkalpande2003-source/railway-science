<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class 10 Science Chapter 3 | Group D Test</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,"Noto Sans Devanagari",sans-serif;
  background:#f4f6f8;
  color:#222;
  overflow-x:hidden;
}

.header{
  height:58px;
  background:#123b6d;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 12px;
  position:sticky;
  top:0;
  z-index:1000;
}

.header-left{
  display:flex;
  align-items:center;
  gap:9px;
}

.logo{
  font-size:19px;
  font-weight:bold;
}

.exam-name{
  font-size:12px;
  opacity:.9;
}

.timer{
  background:#fff;
  color:#c62828;
  padding:7px 10px;
  border-radius:5px;
  font-weight:bold;
  font-size:15px;
  min-width:75px;
  text-align:center;
}

.palette-btn{
  position:fixed;
  right:10px;
  top:70px;
  width:42px;
  height:42px;
  border:none;
  border-radius:6px;
  background:#123b6d;
  color:#fff;
  font-size:23px;
  z-index:1100;
  box-shadow:0 2px 8px rgba(0,0,0,.25);
}

.palette{
  position:fixed;
  right:-310px;
  top:0;
  width:290px;
  max-width:86%;
  height:100vh;
  background:#fff;
  z-index:1200;
  box-shadow:-4px 0 15px rgba(0,0,0,.2);
  transition:.25s;
  overflow-y:auto;
}

.palette.open{
  right:0;
}

.palette-head{
  height:58px;
  background:#123b6d;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  font-weight:bold;
}

.close-palette{
  font-size:25px;
  cursor:pointer;
}

.palette-info{
  padding:12px;
  font-size:13px;
  border-bottom:1px solid #ddd;
}

.legend{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-top:8px;
}

.legend span{
  font-size:12px;
  display:flex;
  align-items:center;
  gap:5px;
}

.dot{
  width:13px;
  height:13px;
  border-radius:3px;
  display:inline-block;
}

.dot.green{background:#28a745;}
.dot.red{background:#dc3545;}
.dot.purple{background:#7b1fa2;}
.dot.grey{background:#ddd;}

.palette-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px;
  padding:13px;
}

.pq{
  height:38px;
  border:1px solid #bbb;
  background:#eee;
  border-radius:5px;
  font-weight:bold;
  cursor:pointer;
}

.pq.answered{
  background:#28a745;
  color:#fff;
  border-color:#28a745;
}

.pq.review{
  background:#7b1fa2;
  color:#fff;
  border-color:#7b1fa2;
}

/* MAIN */

.main{
  width:100%;
  max-width:850px;
  margin:0 auto;
  padding:10px 10px 90px;
}

.progress{
  background:#fff;
  border:1px solid #ddd;
  border-radius:5px;
  padding:8px 10px;
  margin-bottom:9px;
  font-size:13px;
  color:#444;
}

.progress-bar{
  height:5px;
  background:#e5e7eb;
  border-radius:5px;
  margin-top:7px;
  overflow:hidden;
}

.progress-fill{
  height:100%;
  width:0%;
  background:#2563a6;
  transition:.2s;
}

.question-card{
  background:#fff;
  border:1px solid #d9dee5;
  border-radius:5px;
  padding:14px;
  min-height:430px;
}

.question-number{
  font-size:14px;
  font-weight:bold;
  color:#123b6d;
  margin-bottom:9px;
}

.question{
  font-size:17px;
  line-height:1.65;
  font-weight:600;
  margin-bottom:16px;
}

.options{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.option{
  display:flex;
  align-items:flex-start;
  gap:9px;
  border:1px solid #cfd5dc;
  background:#fff;
  border-radius:5px;
  padding:10px;
  cursor:pointer;
  font-size:15px;
  line-height:1.5;
  transition:.15s;
}

.option:hover{
  background:#f5f9ff;
}

.option.selected{
  background:#eaf3ff;
  border:2px solid #2563a6;
  padding:9px;
}

.option input{
  margin-top:4px;
  accent-color:#2563a6;
  flex-shrink:0;
}

/* BOTTOM */

.controls{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#fff;
  border-top:1px solid #ccc;
  box-shadow:0 -2px 10px rgba(0,0,0,.12);
  z-index:900;
}

.controls-inner{
  width:100%;
  max-width:850px;
  margin:auto;
  display:grid;
  grid-template-columns:1fr 1fr 1fr 1fr;
  gap:6px;
  padding:7px;
}

.btn{
  height:42px;
  border:none;
  border-radius:5px;
  font-size:13px;
  font-weight:bold;
  cursor:pointer;
}

.prev{
  background:#e5e7eb;
  color:#222;
}

.review{
  background:#7b1fa2;
  color:#fff;
}

.next{
  background:#2563a6;
  color:#fff;
}

.submit{
  background:#198754;
  color:#fff;
}

/* RESULT */

.result{
  display:none;
  background:#fff;
  margin:20px auto;
  width:min(850px,94%);
  border-radius:8px;
  padding:22px;
  box-shadow:0 3px 15px rgba(0,0,0,.15);
}

.result h2{
  color:#123b6d;
  margin-bottom:15px;
  text-align:center;
}

.score{
  font-size:34px;
  font-weight:bold;
  color:#198754;
  margin:10px 0 18px;
  text-align:center;
}

.result-box{
  background:#f4f6f8;
  padding:12px;
  margin:8px 0;
  border-radius:6px;
}

.restart{
  display:block;
  margin:18px auto 0;
  background:#123b6d;
  color:#fff;
  border:none;
  padding:11px 20px;
  border-radius:5px;
  font-weight:bold;
  cursor:pointer;
}

/* SOLUTIONS */

.solutions{
  margin-top:22px;
  text-align:left;
}

.solution-title{
  background:#123b6d;
  color:#fff;
  padding:13px;
  border-radius:6px;
  font-size:18px;
  font-weight:bold;
  margin-bottom:12px;
}

.solution-card{
  background:#fff;
  border:1px solid #d6dbe1;
  border-radius:6px;
  margin-bottom:12px;
  overflow:hidden;
}

.solution-q{
  background:#f1f5f9;
  padding:11px;
  font-weight:bold;
  line-height:1.55;
}

.solution-body{
  padding:11px;
  font-size:14px;
  line-height:1.6;
}

.your-answer{
  margin-bottom:7px;
}

.correct-answer{
  margin-bottom:7px;
  color:#198754;
  font-weight:bold;
}

.wrong-answer{
  margin-bottom:7px;
  color:#dc3545;
  font-weight:bold;
}

.solution-explanation{
  margin-top:9px;
  background:#f8fbff;
  border-left:4px solid #2563a6;
  padding:10px;
  line-height:1.65;
}

.status-correct,
.status-wrong,
.status-skip{
  display:inline-block;
  color:#fff;
  padding:3px 8px;
  border-radius:4px;
  font-size:11px;
  margin-left:5px;
  vertical-align:middle;
}

.status-correct{
  background:#198754;
}

.status-wrong{
  background:#dc3545;
}

.status-skip{
  background:#6c757d;
}

/* MOBILE */

@media(max-width:600px){

  .header{
    height:55px;
    padding:0 8px;
  }

  .logo{
    font-size:16px;
  }

  .exam-name{
    font-size:10px;
  }

  .timer{
    font-size:14px;
    min-width:70px;
    padding:6px 7px;
  }

  .palette-btn{
    top:63px;
    right:7px;
    width:38px;
    height:38px;
    font-size:21px;
  }

  .main{
    padding:7px 6px 65px;
  }

  .question-card{
    padding:11px;
    min-height:calc(100vh - 175px);
  }

  .question{
    font-size:16px;
    line-height:1.55;
    margin-bottom:13px;
  }

  .option{
    font-size:14px;
    padding:9px;
  }

  .option.selected{
    padding:8px;
  }

  .controls-inner{
    padding:5px;
    gap:4px;
  }

  .btn{
    height:40px;
    font-size:11px;
  }

  .progress{
    font-size:12px;
    padding:7px;
  }

  .result{
    width:96%;
    padding:14px;
    margin:12px auto 20px;
  }

  .solution-title{
    font-size:16px;
  }

  .solution-q{
    font-size:14px;
  }

  .solution-body{
    font-size:13px;
  }

  .status-correct,
  .status-wrong,
  .status-skip{
    display:block;
    width:max-content;
    margin:6px 0 0;
  }

}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">

  <div class="header-left">
    <div class="logo">🚆 Railway Science</div>
    <div class="exam-name">Class 10 • Ch 3 • Group D</div>
  </div>

  <div class="timer" id="timer">20:00</div>

</div>

<!-- QUESTION PALETTE BUTTON -->
<button class="palette-btn" onclick="togglePalette()">☰</button>

<!-- QUESTION PALETTE -->
<div class="palette" id="palette">

  <div class="palette-head">
    <span>Question Palette</span>
    <span class="close-palette" onclick="togglePalette()">×</span>
  </div>

  <div class="palette-info">

    <div>
      <b>35 Questions</b>
    </div>

    <div class="legend">
      <span><i class="dot green"></i> Answered</span>
      <span><i class="dot red"></i> Not Answered</span>
      <span><i class="dot purple"></i> Review</span>
      <span><i class="dot grey"></i> Not Visited</span>
    </div>

  </div>

  <div class="palette-grid" id="paletteGrid"></div>

</div>

<!-- TEST AREA -->
<div class="main" id="testArea">

  <div class="progress">

    <div>
      Question <b id="currentNo">1</b> of <b>35</b>
    </div>

    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>

  </div>

  <div class="question-card">

    <div class="question-number" id="qNumber"></div>

    <div class="question" id="questionText"></div>

    <div class="options" id="options"></div>

  </div>

</div>

<!-- BOTTOM CONTROLS -->
<div class="controls" id="controls">

  <div class="controls-inner">

    <button class="btn prev" onclick="previousQuestion()">
      ← Previous
    </button>

    <button class="btn review" onclick="markReview()">
      ⚑ Mark for Review
    </button>

    <button class="btn next" onclick="nextQuestion()">
      Next →
    </button>

    <button class="btn submit" onclick="confirmSubmit()">
      Submit Test
    </button>

  </div>

</div>

<!-- RESULT -->
<div class="result" id="result">

  <h2>🎯 Test Result</h2>

  <div class="score" id="finalScore"></div>

  <div class="result-box">
    <b>Total Questions:</b>
    <span id="totalResult"></span>
  </div>

  <div class="result-box">
    <b>Correct:</b>
    <span id="correctResult"></span>
  </div>

  <div class="result-box">
    <b>Wrong:</b>
    <span id="wrongResult"></span>
  </div>

  <div class="result-box">
    <b>Not Attempted:</b>
    <span id="skipResult"></span>
  </div>

  <div class="result-box">
    <b>Negative Marking:</b>
    1/3 mark for each wrong answer
  </div>

  <!-- SOLUTIONS WILL APPEAR HERE -->
  <div id="solutions" class="solutions"></div>

  <button class="restart" onclick="location.reload()">
    Restart Test
  </button>

</div>

<script>

const questions = [

{
q:"निम्नलिखित में से कौन-सा, आयरन का सबसे शुद्ध रूप है?",
o:["कठोर इस्पात","स्टेनलेस इस्पात","पिटवा लोहा","लिमोनाइट"],
a:2,
e:"पिटवा लोहा (Wrought Iron) लोहे का अपेक्षाकृत शुद्ध रूप है। इसमें कार्बन की मात्रा बहुत कम होती है।"
},

{
q:"निम्नलिखित में से कौन-सा प्रेक्षण धातु के संक्षारण को सही ढंग से दर्शाता है?",
o:["कॉपर के तार का अत्यधिक तापन करने पर पिघल जाना","चाँदी का जल में पूरी तरह घुल जाना","ऐलुमिनियम का यांत्रिक लोड के कारण टूट जाना","आयरन पर लाल-भूरे रंग की पृष्ठ परत बनना"],
a:3,
e:"लोहे पर ऑक्सीजन और नमी की उपस्थिति में लाल-भूरे रंग की जंग बनती है। यह संक्षारण का उदाहरण है।"
},

{
q:"एनोडीकरण (Anodising) के दौरान एनोड पर क्या होता है?",
o:["हाइड्रोजन गैस ऐलुमिनियम के साथ अभिक्रिया करके ऑक्साइड बनाती है","ऑक्सीजन से अभिक्रिया के कारण ऐलुमिनियम की मोटी ऑक्साइड परत बनती है","नाइट्रोजन गैस ऐलुमिनियम के साथ अभिक्रिया करके ऑक्साइड बनाती है","कार्बन डाइऑक्साइड ऐलुमिनियम के साथ अभिक्रिया करके ऑक्साइड बनाती है"],
a:1,
e:"Anodising में ऐलुमिनियम को एनोड बनाया जाता है। उसकी सतह पर मोटी सुरक्षात्मक Al₂O₃ परत बनाई जाती है।"
},

{
q:"स्टील से बनी औद्योगिक मशीनें प्रायः आर्द्र वातावरण में प्रचालित होती हैं। संक्षारण को न्यूनतम करने के लिए कौन-सा नियमित अनुरक्षण कार्य सबसे प्रभावी है?",
o:["मशीनों को कागज की शीट से ढकना","मशीनों पर जल छिड़काव करना","अनावृत हिस्सों पर स्नेहक तेल लगाना","मशीनों को सूखे तौलिये से पोंछना"],
a:2,
e:"तेल की परत धातु की सतह को वायु और नमी के सीधे संपर्क से बचाती है।"
},

{
q:"जिंक की परत क्षतिग्रस्त होने पर भी यशदलेपन (Galvanisation) में लोहा जंग से सुरक्षित क्यों रहता है?",
o:["जिंक ऑक्सीजन के संपर्क को हमेशा पूरी तरह रोकता है","जिंक अधिमानतः संक्षारित होता है","जिंक लोहे की कठोरता बढ़ाता है","जिंक जल के साथ अधिक तेजी से अभिक्रिया करता है"],
a:1,
e:"जिंक लोहे से अधिक क्रियाशील है। इसलिए जिंक स्वयं पहले संक्षारित होकर लोहे की रक्षा करता है।"
},

{
q:"संक्षारण को धात्विक संरचनाओं और मशीनरी के लिए आर्थिक रूप से हानिकारक क्यों माना जाता है?",
o:["यह धातुओं को दुर्बल बनाता है और चिरस्थायित्व कम करता है","यह पृष्ठीय दिखावट में सुधार करता है","यह धातु की अभिक्रियाशीलता में वृद्धि करता है","यह धातु की चालकता को बढ़ाता है"],
a:0,
e:"संक्षारण के कारण धातु धीरे-धीरे नष्ट और कमजोर होती है, जिससे मशीनों और संरचनाओं की आयु कम हो सकती है।"
},

{
q:"ऐनोडीकरण के सिद्धांत को सर्वोत्तम तरीके से कौन-सा कथन वर्णित करता है?",
o:["ऐलुमिनियम की अभिक्रियाशीलता बढ़ाने के लिए उसे क्षार में डुबोया जाता है","जंग से बचाने के लिए ऐलुमिनियम को जस्ते से लेपित किया जाता है","ऑक्साइड परत को कम करने के लिए ऐलुमिनियम को कैथोड बनाया जाता है","ऐलुमिनियम को एनोड बनाया जाता है और ऑक्सीकरण द्वारा मोटी सुरक्षात्मक ऑक्साइड परत बनाई जाती है"],
a:3,
e:"Anodising में ऐलुमिनियम को एनोड बनाकर उसकी सतह पर मोटी और सुरक्षात्मक ऑक्साइड परत बनाई जाती है।"
},

{
q:"एनोडीकरण एक विद्युत-अपघटनी प्रक्रम के माध्यम से किस धातु की मोटी ऑक्साइड परत बनाने की प्रक्रिया है?",
o:["जस्ता","एल्यूमीनियम","तांबा","लोहा"],
a:1,
e:"ऐलुमिनियम की सतह पर मोटी Al₂O₃ परत बनाने के लिए anodising किया जाता है।"
},

{
q:"लंबे समय तक वायु के संपर्क में रखने पर चाँदी की वस्तुएँ काली पड़ जाती हैं। इसका मुख्य कारण क्या है?",
o:["ऑक्सीजन के साथ अभिक्रिया द्वारा सिल्वर ऑक्साइड का निर्माण","पृष्ठ पर धूल के कणों का संचयन","सिल्वर सल्फाइड की परत का निर्माण","वायु में क्लोरीन के साथ अभिक्रिया द्वारा सिल्वर क्लोराइड का निर्माण"],
a:2,
e:"वायु में उपस्थित सल्फर यौगिकों के साथ चाँदी की अभिक्रिया से Ag₂S की काली परत बनती है।"
},

{
q:"निम्नलिखित में से कौन-सी स्थिति धातुओं के संक्षारण को सबसे अधिक त्वरित करती है?",
o:["निर्वात और अंधकार","शुष्क वायु और निम्न तापमान","आर्द्र वायु और लवणों या अम्लों की उपस्थिति","शुद्ध जल और सूर्य का प्रकाश"],
a:2,
e:"नमी संक्षारण के लिए महत्वपूर्ण है। लवण और अम्ल संक्षारण की दर बढ़ा सकते हैं।"

q:"धातु X, CuSO₄ के साथ अभिक्रिया करती है लेकिन FeSO₄ के साथ नहीं। धातु Y, FeSO₄ के साथ अभिक्रिया करती है लेकिन ZnSO₄ के साथ नहीं। Zn, Fe, Cu, X और Y की घटती अभिक्रियाशीलता का सही क्रम क्या है?",
o:["Y > Zn > X > Fe > Cu","Zn > Y > Fe > X > Cu","Fe > X > Zn > Y > Cu","Cu > X > Fe > Y > Zn"],
a:1,
e:"X के लिए Fe > X > Cu और Y के लिए Zn > Y > Fe. इसलिए पूरा क्रम Zn > Y > Fe > X > Cu है।"
},

{
q:"एक चमकदार लोहे की कील को चार अलग-अलग स्थितियों में रखा गया: I. शुष्क वायु वाले सीलबंद पात्र में II. घुली ऑक्सीजन वाले जल में III. उबले जल में डालकर तेल की परत चढ़ाई गई IV. आर्द्र वायु में। जंग लगने की सर्वाधिक संभावना किस स्थिति में है?",
o:["केवल I और III","केवल II और IV","I, II और IV","II, III और IV"],
a:1,
e:"जंग के लिए ऑक्सीजन और जल/नमी दोनों आवश्यक हैं। II और IV में दोनों उपलब्ध हैं।"
}

];

let current=0;
let answers=new Array(questions.length).fill(null);
let review=new Array(questions.length).fill(false);
let visited=new Array(questions.length).fill(false);

let timeLeft=20*60;
let timerInterval;

const qText=document.getElementById("questionText");
const qNumber=document.getElementById("qNumber");
const optionsBox=document.getElementById("options");
const currentNo=document.getElementById("currentNo");
const progressFill=document.getElementById("progressFill");
const paletteGrid=document.getElementById("paletteGrid");

function createPalette(){

  paletteGrid.innerHTML="";

  questions.forEach((q,i)=>{

    const btn=document.createElement("button");

    btn.className="pq";
    btn.textContent=i+1;
    btn.id="palette-"+i;

    btn.onclick=()=>{

      current=i;
      renderQuestion();
      togglePalette();

    };

    paletteGrid.appendChild(btn);

  });

  updatePalette();
}

function updatePalette(){

  questions.forEach((q,i)=>{

    const btn=document.getElementById("palette-"+i);

    btn.className="pq";

    if(review[i]){

      btn.classList.add("review");

    }else if(answers[i]!==null){

      btn.classList.add("answered");

    }

  });
}

function renderQuestion(){

  visited[current]=true;

  const q=questions[current];

  qNumber.textContent="Q."+(current+1);
  currentNo.textContent=current+1;

  qText.textContent=q.q;

  optionsBox.innerHTML="";

  q.o.forEach((option,index)=>{

    const label=document.createElement("label");

    label.className="option";

    if(answers[current]===index){

      label.classList.add("selected");

    }

    const radio=document.createElement("input");

    radio.type="radio";
    radio.name="option";
    radio.value=index;

    if(answers[current]===index){

      radio.checked=true;

    }

    radio.onchange=()=>{

      answers[current]=index;

      document.querySelectorAll(".option").forEach(x=>{
        x.classList.remove("selected");
      });

      label.classList.add("selected");

      updatePalette();

    };

    label.appendChild(radio);

    const text=document.createElement("span");

    text.innerHTML=
      "<b>"+String.fromCharCode(65+index)+".</b> "+option;

    label.appendChild(text);

    optionsBox.appendChild(label);

  });

  progressFill.style.width=
    ((current+1)/questions.length*100)+"%";

  updatePalette();
}

function nextQuestion(){

  if(current<questions.length-1){

    current++;
    renderQuestion();

  }else{

    confirmSubmit();

  }

}

function previousQuestion(){

  if(current>0){

    current--;
    renderQuestion();

  }

}

function markReview(){

  review[current]=!review[current];

  updatePalette();

  if(current<questions.length-1){

    current++;
    renderQuestion();

  }

}

function togglePalette(){

  document.getElementById("palette").classList.toggle("open");

}

function confirmSubmit(){

  const unanswered=
    answers.filter(x=>x===null).length;

  const msg=
    "क्या आप टेस्ट Submit करना चाहते हैं?\n\n"+
    "Attempted: "+
    (questions.length-unanswered)+
    "\nNot Attempted: "+
    unanswered+
    "\n\nNegative Marking: 1/3";

  if(confirm(msg)){

    submitTest();

  }

}

function submitTest(){

  clearInterval(timerInterval);

  let correct=0;
  let wrong=0;
  let skipped=0;

  questions.forEach((q,i)=>{

    if(answers[i]===null){

      skipped++;

    }else if(answers[i]===q.a){

      correct++;

    }else{

      wrong++;

    }

  });

  const score=correct-(wrong/3);

  document.getElementById("testArea").style.display="none";

  document.getElementById("controls").style.display="none";

  document.querySelector(".palette-btn").style.display="none";

  document.getElementById("palette")
    .classList.remove("open");

  document.getElementById("result")
    .style.display="block";

  document.getElementById("finalScore").textContent=
    score.toFixed(2)+" / "+questions.length;

  document.getElementById("totalResult").textContent=
    questions.length;

  document.getElementById("correctResult").textContent=
    correct;

  document.getElementById("wrongResult").textContent=
    wrong;

  document.getElementById("skipResult").textContent=
    skipped;

  /* QUESTION WISE SOLUTIONS */

  const solutions=
    document.getElementById("solutions");

  let html=`

    <div class="solution-title">
      📖 Question-wise Solutions
    </div>

  `;

  questions.forEach((q,i)=>{

    const userAnswer=answers[i];

    const correctAnswer=q.a;

    let statusClass="";
    let statusText="";
    let userText="";

    if(userAnswer===null){

      statusClass="status-skip";

      statusText="Not Attempted";

      userText="उत्तर नहीं दिया";

    }else if(userAnswer===correctAnswer){

      statusClass="status-correct";

      statusText="Correct";

      userText=
        String.fromCharCode(65+userAnswer)+
        ". "+
        q.o[userAnswer];

    }else{

      statusClass="status-wrong";

      statusText="Wrong";

      userText=
        String.fromCharCode(65+userAnswer)+
        ". "+
        q.o[userAnswer];

    }

    const correctText=
      String.fromCharCode(65+correctAnswer)+
      ". "+
      q.o[correctAnswer];

    html+=`

      <div class="solution-card">

        <div class="solution-q">

          Q${i+1}. ${q.q}

          <span class="${statusClass}">
            ${statusText}
          </span>

        </div>

        <div class="solution-body">

          <div class="your-answer">

            <b>आपका उत्तर:</b>
            ${userText}

          </div>

          <div class="correct-answer">

            ✓ सही उत्तर:
            ${correctText}

          </div>

          <div class="solution-explanation">

            <b>💡 Explanation:</b><br>

            ${q.e}

          </div>

        </div>

      </div>

    `;

  });

  solutions.innerHTML=html;

  window.scrollTo(0,0);

}

function startTimer(){

  timerInterval=setInterval(()=>{

    timeLeft--;

    let min=Math.floor(timeLeft/60);

    let sec=timeLeft%60;

    document.getElementById("timer").textContent=
      String(min).padStart(2,"0")+
      ":"+
      String(sec).padStart(2,"0");

    if(timeLeft<=0){

      clearInterval(timerInterval);

      alert(
        "⏰ समय समाप्त हो गया। आपका टेस्ट Submit किया जा रहा है।"
      );

      submitTest();

    }

  },1000);

}

createPalette();

renderQuestion();

startTimer();

</script>

</body>
</html>

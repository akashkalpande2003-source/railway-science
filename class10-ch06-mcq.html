<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Class 10 Science | नियंत्रण एवं समन्वय | Railway Mock Test</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,"Noto Sans Devanagari",sans-serif;
    background:#eef3f8;
    color:#172033;
    line-height:1.6;
}

.container{
    max-width:850px;
    margin:auto;
    padding:15px;
}

/* HEADER */
.header{
    background:linear-gradient(135deg,#0b2d5c,#174a85);
    color:white;
    border-radius:16px;
    padding:20px;
    text-align:center;
    box-shadow:0 5px 18px rgba(0,0,0,.15);
}

.header h1{
    font-size:25px;
    margin-bottom:6px;
}

.header p{
    font-size:14px;
    opacity:.95;
}

/* INFO BAR */
.info-bar{
    margin-top:12px;
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.info-box{
    background:white;
    border-radius:10px;
    padding:10px;
    text-align:center;
    flex:1;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.info-box small{
    display:block;
    color:#777;
    font-size:11px;
}

.info-box strong{
    font-size:17px;
    color:#0b2d5c;
}

/* PROGRESS */
.progress-section{
    margin-top:15px;
    background:white;
    padding:12px;
    border-radius:12px;
}

.progress-text{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    margin-bottom:7px;
    font-weight:bold;
}

.progress{
    height:9px;
    background:#e3e8ef;
    border-radius:20px;
    overflow:hidden;
}

.progress-fill{
    height:100%;
    width:0%;
    background:#174a85;
    transition:.3s;
}

/* QUESTION CARD */
.question-card{
    background:white;
    margin-top:15px;
    padding:20px;
    border-radius:16px;
    box-shadow:0 3px 14px rgba(0,0,0,.09);
}

.question-number{
    display:inline-block;
    background:#0b2d5c;
    color:white;
    padding:5px 12px;
    border-radius:20px;
    font-size:13px;
    font-weight:bold;
    margin-bottom:12px;
}

.question{
    font-size:18px;
    font-weight:bold;
    color:#172033;
    margin-bottom:17px;
}

.option{
    border:2px solid #dce3eb;
    padding:13px;
    margin:10px 0;
    border-radius:10px;
    cursor:pointer;
    transition:.2s;
    background:#fff;
    font-size:15px;
}

.option:hover{
    border-color:#174a85;
    background:#f3f7fc;
}

.option.selected{
    border-color:#174a85;
    background:#eaf2fc;
}

.option.correct{
    border-color:#168447;
    background:#e9f8ef;
    color:#075b2d;
}

.option.wrong{
    border-color:#d43b3b;
    background:#fff0f0;
    color:#a31313;
}

.option.disabled{
    cursor:default;
}

/* EXPLANATION */
.explanation{
    display:none;
    margin-top:18px;
    border-radius:12px;
    overflow:hidden;
    border:1px solid #dbe4ee;
}

.answer-title{
    background:#eaf8ef;
    color:#087333;
    padding:12px 14px;
    font-weight:bold;
}

.explanation-body{
    padding:15px;
    background:#fbfdff;
    font-size:14px;
}

.notes{
    margin-top:12px;
    padding:13px;
    background:#fff8e5;
    border-left:5px solid #e0a100;
    border-radius:7px;
}

.notes strong{
    color:#805d00;
}

.notes ul{
    margin:7px 0 0 20px;
}

.result-note{
    margin-top:12px;
    padding:10px;
    background:#f1f5fa;
    border-radius:8px;
    font-size:13px;
}

/* BUTTONS */
.buttons{
    display:flex;
    gap:10px;
    margin-top:18px;
}

button{
    border:none;
    padding:13px 18px;
    border-radius:10px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

#nextBtn{
    flex:1;
    background:#0b2d5c;
    color:white;
}

#nextBtn:disabled{
    background:#b9c2cc;
    cursor:not-allowed;
}

#restartBtn{
    background:#174a85;
    color:white;
    width:100%;
}

/* RESULT */
.result{
    display:none;
    background:white;
    margin-top:15px;
    padding:25px;
    border-radius:16px;
    text-align:center;
    box-shadow:0 3px 15px rgba(0,0,0,.1);
}

.result h2{
    color:#0b2d5c;
    margin-bottom:15px;
}

.score{
    font-size:42px;
    font-weight:bold;
    color:#174a85;
}

.result-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin:20px 0;
}

.result-item{
    padding:12px;
    background:#f2f5f9;
    border-radius:10px;
}

.result-item strong{
    display:block;
    font-size:20px;
}

.review{
    text-align:left;
    margin-top:20px;
}

.review-item{
    padding:10px;
    border-bottom:1px solid #ddd;
    font-size:14px;
}

.review-correct{
    color:#087333;
}

.review-wrong{
    color:#b01717;
}

@media(max-width:600px){
    .header h1{
        font-size:21px;
    }

    .question{
        font-size:17px;
    }

    .option{
        font-size:14px;
        padding:12px;
    }

    .result-grid{
        grid-template-columns:1fr 1fr 1fr;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🧠 नियंत्रण एवं समन्वय</h1>
        <p>Class 10 Science • Railway / Group-D Mock Test</p>
        <p>One Question at a Time • Explanation + Exam Notes</p>
    </div>

    <div class="info-bar">
        <div class="info-box">
            <small>कुल प्रश्न</small>
            <strong>55</strong>
        </div>

        <div class="info-box">
            <small>Negative Marking</small>
            <strong>नहीं</strong>
        </div>

        <div class="info-box">
            <small>Timer</small>
            <strong>नहीं</strong>
        </div>
    </div>

    <div class="progress-section">
        <div class="progress-text">
            <span id="progressText">Question 1 of 55</span>
            <span id="scoreText">Score: 0</span>
        </div>

        <div class="progress">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>

    <div id="quiz"></div>

    <div class="result" id="result">
        <h2>🎉 Mock Test Complete</h2>

        <div class="score" id="finalScore">0/55</div>

        <div class="result-grid">
            <div class="result-item">
                <strong id="correctCount">0</strong>
                सही
            </div>

            <div class="result-item">
                <strong id="wrongCount">0</strong>
                गलत
            </div>

            <div class="result-item">
                <strong id="percentage">0%</strong>
                प्रतिशत
            </div>
        </div>

        <button id="restartBtn" onclick="restartQuiz()">
            🔄 Test फिर से शुरू करें
        </button>

        <div class="review" id="review"></div>
    </div>

</div>


<script>

const questions = [

{
q:"मानव मस्तिष्क का मुख्य विचारक भाग कहाँ स्थित होता है?",
options:[
"अग्र-मस्तिष्क",
"मेरु रज्जु",
"मध्य मस्तिष्क",
"मेडुला"
],
answer:0,
explanation:"अग्र-मस्तिष्क (Forebrain) मस्तिष्क का वह भाग है जो सोचने, समझने, सीखने, स्मरण और निर्णय जैसी उच्च मानसिक गतिविधियों में महत्वपूर्ण भूमिका निभाता है।",
notes:[
"प्रमस्तिष्क (Cerebrum) अग्र-मस्तिष्क का प्रमुख भाग है।",
"प्रमस्तिष्क चिंतन, स्मृति, बुद्धि तथा स्वैच्छिक क्रियाओं से संबंधित है।",
"मेरुरज्जु प्रतिवर्ती क्रियाओं और मस्तिष्क-शरीर के बीच संदेश के लिए महत्वपूर्ण है।"
]
},

{
q:"मस्तिष्क को चिंतन गतिविधियों के लिए क्या उपयुक्त बनाता है?",
options:[
"इसका चिकना पृष्ठ",
"इसका हृदय से संबंध",
"कानों के पास इसकी अवस्थिति",
"कई न्यूरॉन्स वाली इसकी जटिल व्यवस्था"
],
answer:3,
explanation:"मस्तिष्क में बहुत बड़ी संख्या में न्यूरॉन्स एक जटिल नेटवर्क बनाते हैं। इनके बीच संदेशों के आदान-प्रदान के कारण मस्तिष्क जटिल चिंतन और सूचना-प्रसंस्करण कर सकता है।",
notes:[
"न्यूरॉन तंत्रिका तंत्र की संरचनात्मक और क्रियात्मक इकाई है।",
"न्यूरॉन विद्युत एवं रासायनिक संकेतों के माध्यम से सूचना का संचार करते हैं।",
"मस्तिष्क में न्यूरॉन्स की जटिल व्यवस्था उच्च स्तरीय कार्यों में सहायक है।"
]
},

{
q:"मस्तिष्क का कौन-सा भाग स्वैच्छिक मांसपेशियों के संचलन को सीधे नियंत्रित करता है?",
options:[
"मेडुला ऑब्लांगेटा (Medulla oblongata)",
"मोटर क्षेत्र (Motor area)",
"एसोसिएशन क्षेत्र (Association area)",
"संवेदी क्षेत्र (Sensory area)"
],
answer:1,
explanation:"मोटर क्षेत्र शरीर की स्वैच्छिक मांसपेशियों की गतिविधियों को नियंत्रित करता है। जब हम अपनी इच्छा से हाथ-पैर चलाते हैं, तो मोटर क्षेत्र इसमें महत्वपूर्ण भूमिका निभाता है।",
notes:[
"Motor area → स्वैच्छिक मांसपेशियों की गति।",
"Sensory area → संवेदी जानकारी का विश्लेषण।",
"Association area → संवेदी जानकारी को अन्य सूचनाओं से जोड़कर विचार और निर्णय में सहायता।"
]
},

{
q:"मस्तिष्क का कौन-सा भाग रक्तचाप, लार स्रवण और वमन जैसी अनैच्छिक क्रियाओं को नियंत्रित करता है?",
options:[
"प्रमस्तिष्क (Cerebrum)",
"अनुमस्तिष्क (Cerebellum)",
"थैलेमस (Thalamus)",
"मेडुला ऑब्लांगेटा (Medulla oblongata)"
],
answer:3,
explanation:"मेडुला ऑब्लांगेटा पश्चमस्तिष्क का भाग है और कई अनैच्छिक क्रियाओं जैसे रक्तचाप, हृदयगति, श्वसन, लार स्रवण और वमन को नियंत्रित करता है।",
notes:[
"Medulla → अनैच्छिक क्रियाएँ।",
"Cerebellum → संतुलन और शारीरिक मुद्रा।",
"Cerebrum → चिंतन एवं स्वैच्छिक क्रियाएँ।"
]
},

{
q:"मानव मस्तिष्क का कौन-सा भाग किसी व्यक्ति के सोचने और सीखने की क्षमताओं को नियंत्रित करता है?",
options:[
"मेडुला (Medulla)",
"हाइपोथैलेमस (Hypothalamus)",
"अनुमस्तिष्क (Cerebellum)",
"प्रमस्तिष्क (Cerebrum)"
],
answer:3,
explanation:"प्रमस्तिष्क (Cerebrum) मस्तिष्क का सबसे बड़ा भाग है। यह सोचने, सीखने, स्मृति, बुद्धि तथा स्वैच्छिक गतिविधियों में महत्वपूर्ण भूमिका निभाता है।",
notes:[
"Cerebrum = चिंतन + स्मृति + सीखना + स्वैच्छिक क्रिया।",
"Cerebellum = संतुलन और समन्वय।",
"Medulla = कई अनैच्छिक क्रियाएँ।"
]
},

{
q:"पर्याप्त मात्रा में भोजन ग्रहण करने के पश्चात, पेट भरने की संवेदना की अनुभूति हमारे शरीर के किस हिस्से में होती है?",
options:[
"हृदय",
"अग्र-मस्तिष्क",
"मुख गुहिका",
"मध्य-मस्तिष्क"
],
answer:1,
explanation:"भोजन से संबंधित तृप्ति (satiety) जैसी अनुभूतियों के नियंत्रण में मस्तिष्क, विशेषकर हाइपोथैलेमस और अग्र-मस्तिष्क के क्षेत्र महत्वपूर्ण होते हैं।",
notes:[
"हाइपोथैलेमस भूख और तृप्ति के नियमन में महत्वपूर्ण है।",
"अग्र-मस्तिष्क उच्च मानसिक तथा कई नियामक कार्यों से संबंधित है।",
"भोजन का पाचन मुख्यतः पाचन तंत्र में होता है।"
]
},

{
q:"मस्तिष्क का कौन-सा भाग मुख्य रूप से उच्च स्तरीय विचार प्रक्रियाओं और संवेदी जानकारी की जटिल व्याख्या के लिए जिम्मेदार है?",
options:[
"अनुमस्तिष्क",
"मेरुदंड",
"मस्तिष्क कांड",
"अग्रमस्तिष्क"
],
answer:3,
explanation:"अग्रमस्तिष्क उच्च स्तरीय मानसिक प्रक्रियाओं और संवेदी सूचनाओं के जटिल विश्लेषण में महत्वपूर्ण भूमिका निभाता है।",
notes:[
"Forebrain → thinking, interpretation और कई sensory functions।",
"Cerebellum → posture, balance और coordination।",
"Spinal cord → संदेशों का संचार और reflex actions।"
]
},

{
q:"निम्नलिखित में से कौन-सा सीधे रक्त में स्रावित किया जाता है और शरीर के विभिन्न अंगों तक पहुँचाया जाता है?",
options:[
"पित्त रस (Bile juice)",
"एड्रिनेलिन (Adrenaline)",
"लार (Saliva)",
"अग्नाशयी रस (Pancreatic juice)"
],
answer:1,
explanation:"एड्रिनेलिन एक हार्मोन है जो अधिवृक्क ग्रंथि से सीधे रक्त में स्रावित होता है और रक्त द्वारा शरीर के विभिन्न भागों तक पहुँचता है।",
notes:[
"Adrenaline → अधिवृक्क ग्रंथि।",
"यह आपातकालीन स्थिति में Fight or Flight response से संबंधित है।",
"पित्त, लार और अग्नाशयी रस पाचन से संबंधित स्राव हैं।"
]
},

{
q:"टेस्टोस्टेरोन नामक हार्मोन मनुष्य के निम्नलिखित में से किस अंग से स्रावित होता है?",
options:[
"मूत्रवाहिनी",
"गर्भाशय",
"डिम्बवाहिनी",
"वृषण"
],
answer:3,
explanation:"पुरुषों में टेस्टोस्टेरोन मुख्यतः वृषण (Testes) में बनता है। यह पुरुषों में यौन परिपक्वता और द्वितीयक लैंगिक लक्षणों के विकास में महत्वपूर्ण है।",
notes:[
"Testosterone → Testes.",
"Estrogen → मुख्यतः अंडाशय।",
"Testosterone पुरुषों में दाढ़ी-मूँछ, भारी आवाज और मांसपेशियों के विकास जैसे द्वितीयक लैंगिक लक्षणों से संबंधित है।"
]
},

{
q:"निम्नलिखित में से कौन-सा रासायनिक स्राव हमारे शरीर को नियंत्रण और समन्वय में मदद करता है?",
options:[
"गैस्ट्रिक म्यूकोसा",
"हार्मोन",
"लार",
"सीबम"
],
answer:1,
explanation:"हार्मोन रासायनिक संदेशवाहक होते हैं। अंतःस्रावी ग्रंथियाँ इन्हें रक्त में छोड़ती हैं और ये शरीर के विभिन्न कार्यों के नियंत्रण एवं समन्वय में सहायता करते हैं।",
notes:[
"Hormones = chemical messengers.",
"Endocrine glands अपने हार्मोन सीधे रक्त में छोड़ती हैं।",
"उदाहरण: Insulin, Thyroxine, Adrenaline, Growth hormone।"
]
},

{
q:"मानव शरीर में कौन-सी ग्रंथि वृद्धि हार्मोन का स्राव करती है?",
options:[
"अग्न्याशय",
"अवटु ग्रंथि",
"अधिवृक्क ग्रंथि",
"पीयूष ग्रंथि"
],
answer:3,
explanation:"वृद्धि हार्मोन (Growth Hormone/GH) का स्राव पीयूष ग्रंथि (Pituitary gland) की अग्र पिट्यूटरी से होता है।",
notes:[
"Pituitary = Master gland.",
"Growth hormone शरीर की वृद्धि में महत्वपूर्ण है।",
"GH की कमी से बच्चों में बौनापन हो सकता है।",
"वयस्कों में GH की अधिकता Acromegaly से संबंधित हो सकती है।"
]
},

{
q:"कौन-सा हार्मोन लड़कों में यौन परिपक्वता को उत्तेजित करता है?",
options:[

q:"थायरॉइड ग्रंथि द्वारा थायरॉक्सिन हार्मोन स्रावित करने के लिए कौन-सा तत्व आवश्यक है?",
options:[
"ब्रोमीन",
"क्लोरीन",
"आयोडीन",
"फ्लूओरीन"
],
answer:2,
explanation:"थायरॉक्सिन के निर्माण के लिए आयोडीन आवश्यक तत्व है। आहार में आयोडीन की कमी से thyroid-related disorders हो सकते हैं।",
notes:[
"Iodine → Thyroxine synthesis.",
"Thyroxine → metabolism regulation.",
"Iodine deficiency → goitre का एक प्रमुख कारण हो सकता है।"
]
}

];


/* ===========================
   QUIZ ENGINE
=========================== */

let currentQuestion = 0;
let score = 0;
let answered = false;
let userAnswers = [];

function loadQuestion(){

    answered = false;

    const q = questions[currentQuestion];

    document.getElementById("progressText").innerText =
        `Question ${currentQuestion + 1} of ${questions.length}`;

    document.getElementById("scoreText").innerText =
        `Score: ${score}`;

    const percentage =
        ((currentQuestion) / questions.length) * 100;

    document.getElementById("progressFill").style.width =
        percentage + "%";

    let html = `
        <div class="question-card">

            <div class="question-number">
                प्रश्न ${currentQuestion + 1}
            </div>

            <div class="question">
                ${q.q}
            </div>

            <div id="options">
    `;

    q.options.forEach((option,index)=>{

        html += `
            <div class="option"
                 onclick="selectAnswer(${index})"
                 id="option-${index}">
                <b>${String.fromCharCode(65+index)}.</b>
                ${option}
            </div>
        `;

    });

    html += `
            </div>

            <div class="explanation" id="explanation">

                <div class="answer-title" id="answerTitle"></div>

                <div class="explanation-body">

                    <strong>📖 Explanation:</strong>
                    <p id="explanationText"></p>

                    <div class="notes">
                        <strong>📌 Exam में याद रखें:</strong>
                        <ul id="notesList"></ul>
                    </div>

                    <div class="result-note" id="resultNote"></div>

                </div>

            </div>

            <div class="buttons">
                <button id="nextBtn" onclick="nextQuestion()" disabled>
                    अगला प्रश्न ➜
                </button>
            </div>

        </div>
    `;

    document.getElementById("quiz").innerHTML = html;
}


function selectAnswer(index){

    if(answered) return;

    answered = true;

    const q = questions[currentQuestion];

    userAnswers[currentQuestion] = index;

    const allOptions =
        document.querySelectorAll(".option");

    allOptions.forEach((option,i)=>{

        option.classList.add("disabled");

        if(i === q.answer){
            option.classList.add("correct");
        }

        if(i === index && index !== q.answer){
            option.classList.add("wrong");
        }

    });

    if(index === q.answer){
        score++;
    }

    document.getElementById("scoreText").innerText =
        `Score: ${score}`;

    const explanation =
        document.getElementById("explanation");

    explanation.style.display = "block";

    document.getElementById("answerTitle").innerHTML =
        `✅ सही उत्तर: ${String.fromCharCode(65+q.answer)}. ${q.options[q.answer]}`;

    document.getElementById("explanationText").innerText =
        q.explanation;

    const notesList =
        document.getElementById("notesList");

    notesList.innerHTML = "";

    q.notes.forEach(note=>{
        const li = document.createElement("li");
        li.innerText = note;
        notesList.appendChild(li);
    });

    if(index === q.answer){

        document.getElementById("resultNote").innerHTML =
            "🎯 <b>आपका उत्तर सही है!</b> अगला प्रश्न करने से पहले ऊपर दिए गए Exam Notes जरूर पढ़ें।";

    }else{

        document.getElementById("resultNote").innerHTML =
            `❌ <b>आपका उत्तर गलत है।</b><br>
             आपने चुना: ${String.fromCharCode(65+index)}. ${q.options[index]}<br>
             सही उत्तर: ${String.fromCharCode(65+q.answer)}. ${q.options[q.answer]}`;

    }

    document.getElementById("nextBtn").disabled = false;

    document.getElementById("nextBtn").innerText =
        currentQuestion === questions.length - 1
        ? "🏁 Test समाप्त करें"
        : "अगला प्रश्न ➜";

}


function nextQuestion(){

    if(!answered) return;

    currentQuestion++;

    if(currentQuestion >= questions.length){

        showResult();

    }else{

        loadQuestion();

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }
}


function showResult(){

    document.getElementById("quiz").style.display = "none";

    document.querySelector(".progress-section").style.display = "none";

    const result =
        document.getElementById("result");

    result.style.display = "block";

    document.getElementById("finalScore").innerText =
        `${score}/${questions.length}`;

    const wrong =
        questions.length - score;

    const percent =
        Math.round((score / questions.length) * 100);

    document.getElementById("correctCount").innerText =
        score;

    document.getElementById("wrongCount").innerText =
        wrong;

    document.getElementById("percentage").innerText =
        percent + "%";

    let reviewHTML =
        "<h3>📋 Question Review</h3>";

    questions.forEach((q,i)=>{

        const user =
            userAnswers[i];

        const isCorrect =
            user === q.answer;

        reviewHTML += `
            <div class="review-item
                ${isCorrect ? 'review-correct':'review-wrong'}">

                <b>Q${i+1}.</b>

                ${isCorrect ? "✅ सही" : "❌ गलत"}

                ${!isCorrect
                    ? ` — सही उत्तर:
                       ${String.fromCharCode(65+q.answer)}`
                    : ""}

            </div>
        `;

    });

    document.getElementById("review").innerHTML =
        reviewHTML;

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


function restartQuiz(){

    currentQuestion = 0;
    score = 0;
    answered = false;
    userAnswers = [];

    document.getElementById("quiz").style.display = "block";

    document.querySelector(".progress-section").style.display = "block";

    document.getElementById("result").style.display = "none";

    loadQuestion();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* START */
loadQuestion();

</script>

</html>

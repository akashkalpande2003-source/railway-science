<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Class 9 Science | Motion | TCS Style Mock Test</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,"Noto Sans Devanagari",sans-serif;
  background:#eef3f8;
  color:#17212b;
}

/* HEADER */
.header{
  background:#123b6d;
  color:white;
  padding:14px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:1000;
  box-shadow:0 2px 8px rgba(0,0,0,.2);
}

.header h1{
  font-size:20px;
}

.header p{
  font-size:12px;
  margin-top:3px;
  opacity:.9;
}

.timer{
  background:white;
  color:#123b6d;
  padding:8px 12px;
  border-radius:6px;
  font-weight:bold;
  font-size:16px;
  min-width:85px;
  text-align:center;
}

/* MAIN */
.container{
  max-width:950px;
  margin:20px auto;
  padding:0 15px;
}

.test-info{
  background:white;
  border-left:5px solid #2563a6;
  padding:14px;
  margin-bottom:15px;
  border-radius:6px;
  box-shadow:0 1px 5px rgba(0,0,0,.08);
  line-height:1.7;
}

.test-info strong{
  color:#123b6d;
}

/* QUESTION */
.question-card{
  background:white;
  border-radius:7px;
  padding:20px;
  box-shadow:0 2px 8px rgba(0,0,0,.1);
  min-height:430px;
}

.qtop{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #ddd;
  padding-bottom:12px;
  margin-bottom:18px;
}

.qnumber{
  font-size:17px;
  font-weight:bold;
  color:#123b6d;
}

.qtag{
  font-size:12px;
  background:#e8f1fb;
  color:#2563a6;
  padding:5px 9px;
  border-radius:4px;
}

.question{
  font-size:18px;
  line-height:1.65;
  font-weight:600;
  margin-bottom:20px;
}

.options{
  display:flex;
  flex-direction:column;
  gap:11px;
}

.option{
  border:1px solid #cbd5e1;
  border-radius:6px;
  padding:13px 14px;
  cursor:pointer;
  background:#fff;
  transition:.15s;
  font-size:16px;
  line-height:1.5;
}

.option:hover{
  border-color:#2563a6;
  background:#f3f8fd;
}

.option.selected{
  border-color:#2563a6;
  background:#e8f2ff;
  box-shadow:0 0 0 1px #2563a6 inset;
}

.nav{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-top:20px;
}

.nav button,
.submit-btn{
  border:0;
  border-radius:6px;
  padding:12px 20px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.prev{
  background:#e5e7eb;
  color:#333;
}

.next{
  background:#2563a6;
  color:white;
  margin-left:auto;
}

.submit-btn{
  background:#16803c;
  color:white;
  width:100%;
  margin-top:15px;
}

/* =========================================================
   RIGHT SIDE PALETTE BUTTON
========================================================= */

.palette-btn{
  position:fixed;
  right:0;
  left:auto;
  top:80px;
  z-index:4000;

  width:45px;
  height:48px;

  border:0;
  border-radius:7px 0 0 7px;

  background:#123b6d;
  color:white;

  font-size:24px;
  font-weight:bold;

  cursor:pointer;

  box-shadow:-2px 2px 7px rgba(0,0,0,.25);
}

/* =========================================================
   RIGHT SIDE PALETTE
========================================================= */

.palette{
  position:fixed;

  right:-310px;
  left:auto;

  top:0;

  width:300px;
  height:100vh;

  background:white;

  z-index:5000;

  box-shadow:-4px 0 15px rgba(0,0,0,.25);

  transition:right .25s ease;

  overflow-y:auto;
}

.palette.open{
  right:0;
  left:auto;
}

.palette-head{
  background:#123b6d;
  color:white;

  padding:16px;

  display:flex;
  justify-content:space-between;
  align-items:center;

  position:sticky;
  top:0;

  z-index:5;
}

.palette-head button{
  background:none;
  border:0;
  color:white;
  font-size:24px;
  cursor:pointer;
}

.palette-info{
  padding:12px;
  background:#f1f5f9;
  font-size:13px;
  line-height:1.7;
}

.palette-grid{
  padding:15px;

  display:grid;

  grid-template-columns:repeat(5,1fr);

  gap:8px;
}

.pbtn{
  height:38px;

  border:1px solid #cbd5e1;

  background:#fff;

  border-radius:5px;

  cursor:pointer;

  font-weight:bold;
}

.pbtn:hover{
  background:#e8f2ff;
}

.pbtn.current{
  background:#2563a6;
  color:white;
  border-color:#2563a6;
}

.pbtn.answered{
  background:#16803c;
  color:white;
  border-color:#16803c;
}

.pbtn.wrong{
  background:#d32f2f;
  color:white;
  border-color:#d32f2f;
}

/* OVERLAY */

.overlay{
  display:none;

  position:fixed;

  inset:0;

  background:rgba(0,0,0,.4);

  z-index:4500;
}

.overlay.show{
  display:block;
}

/* RESULT */

.result{
  display:none;

  background:white;

  border-radius:8px;

  padding:25px;

  box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.result h2{
  color:#123b6d;

  margin-bottom:18px;

  text-align:center;
}

.score-box{
  background:#eef6ff;

  border:1px solid #c9def5;

  border-radius:7px;

  padding:20px;

  text-align:center;

  margin-bottom:20px;
}

.score{
  font-size:32px;

  font-weight:bold;

  color:#123b6d;

  margin-top:5px;
}

.result-grid{
  display:grid;

  grid-template-columns:repeat(2,1fr);

  gap:12px;
}

.result-item{
  padding:12px;

  background:#f7f8fa;

  border-radius:6px;

  line-height:1.6;
}

.restart{
  width:100%;

  margin-top:20px;

  background:#2563a6;

  color:white;

  border:0;

  padding:13px;

  border-radius:6px;

  font-weight:bold;

  cursor:pointer;
}

/* SOLUTIONS */

.solution-card{
  background:#fff;

  border:1px solid #d6dde5;

  border-radius:7px;

  padding:16px;

  margin-top:14px;

  box-shadow:0 1px 4px rgba(0,0,0,.08);
}

.solution-title{
  color:#123b6d;

  font-weight:bold;

  font-size:16px;

  padding-bottom:10px;

  border-bottom:1px solid #e5e7eb;

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:10px;
}

.solution-question{
  font-weight:600;

  line-height:1.6;

  margin-top:12px;
}

.your-answer{
  margin-top:12px;

  padding:10px;

  background:#f7f8fa;

  border-radius:5px;

  line-height:1.6;
}

.correct-answer{
  margin-top:8px;

  padding:10px;

  background:#eaf7ee;

  color:#146c35;

  border-radius:5px;

  line-height:1.6;
}

.solution-explanation{
  margin-top:10px;

  padding:12px;

  background:#f1f6fb;

  border-left:4px solid #2563a6;

  line-height:1.7;
}

.correct-result{
  background:#16803c;

  color:white;

  padding:4px 8px;

  border-radius:4px;

  font-size:12px;

  white-space:nowrap;
}

.incorrect-result{
  background:#d32f2f;

  color:white;

  padding:4px 8px;

  border-radius:4px;

  font-size:12px;

  white-space:nowrap;
}

.unattempted{
  background:#64748b;

  color:white;

  padding:4px 8px;

  border-radius:4px;

  font-size:12px;

  white-space:nowrap;
}

/* MOBILE */

@media(max-width:600px){

  .header{
    padding:11px 10px;
  }

  .header h1{
    font-size:16px;
  }

  .header p{
    font-size:10px;
  }

  .timer{
    font-size:14px;

    min-width:75px;

    padding:7px 8px;
  }

  .container{
    margin:12px auto;

    padding:0 8px;
  }

  .question-card{
    padding:15px;

    min-height:0;
  }

  .question{
    font-size:16px;

    line-height:1.6;
  }

  .option{
    font-size:14px;

    padding:11px;
  }

  .qnumber{
    font-size:15px;
  }

  .result{
    padding:15px;
  }

  .result-grid{
    grid-template-columns:1fr;
  }

  .palette{
    width:285px;
  }

  .solution-card{
    padding:13px;
  }

  .solution-title{
    font-size:14px;
  }

  .solution-question{
    font-size:14px;
  }

  .your-answer,
  .correct-answer,
  .solution-explanation{
    font-size:14px;
  }

}
</style>
</head>

<body>

<!-- HEADER -->

<header class="header">

  <div>
    <h1>🚆 Class 9 Science — Motion</h1>

    <p>
      TCS Style Mock Test | 57 Questions | Negative Marking 1/3
    </p>
  </div>

  <div class="timer" id="timer">
    30:00
  </div>

</header>


<!-- RIGHT SIDE PALETTE BUTTON -->

<button
  class="palette-btn"
  onclick="openPalette()"
  aria-label="Question Palette"
>
  ☰
</button>


<!-- OVERLAY -->

<div
  class="overlay"
  id="overlay"
  onclick="closePalette()"
></div>


<!-- RIGHT SIDE QUESTION PALETTE -->

<aside
  class="palette"
  id="palette"
>

  <div class="palette-head">

    <strong>
      Question Palette
    </strong>

    <button
      onclick="closePalette()"
    >
      ×
    </button>

  </div>


  <div class="palette-info">

    🔵 Current Question<br>

    🟢 Attempted<br>

    ⚪ Not Attempted<br>

    🔴 Incorrect — Submit के बाद

  </div>


  <div
    class="palette-grid"
    id="paletteGrid"
  ></div>

</aside>


<!-- MAIN -->

<main class="container">


  <!-- TEST INFORMATION -->

  <div class="test-info">

    <strong>
      Class 9 Science — Motion
    </strong>

    <br>

    कुल प्रश्न:
    <strong>57</strong>

    |

    समय:
    <strong>30 मिनट</strong>

    |

    सही उत्तर:
    <strong>+1 अंक</strong>

    |

    गलत उत्तर:
    <strong>−1/3 अंक</strong>

  </div>


  <!-- QUESTION CARD -->

  <div
    class="question-card"
    id="questionCard"
  >

    <div class="qtop">

      <div
        class="qnumber"
        id="qNumber"
      ></div>

      <div class="qtag">
        TCS STYLE
      </div>

    </div>


    <div
      class="question"
      id="questionText"
    ></div>


    <div
      class="options"
      id="options"
    ></div>


    <div class="nav">

      <button
        class="prev"
        onclick="previousQuestion()"
      >
        ← Previous
      </button>


      <button
        class="next"
        onclick="nextQuestion()"
      >
        Next →
      </button>

    </div>


    <button
      class="submit-btn"
      onclick="submitTest()"
    >
      Submit Test
    </button>

  </div>


  <!-- RESULT -->

  <div
    class="result"
    id="result"
  ></div>

</main>


<script>

/* =========================================================
   QUESTIONS
========================================================= */

const questions = [

{
q:`एकसमान गति से गतिमान किसी वस्तु का त्वरण क्या होता है?`,
o:[
`शून्य`,
`एक`,
`अधिकतम`,
`ऋणात्मक`
],
a:0,
e:`एकसमान गति में वेग में कोई परिवर्तन नहीं होता। इसलिए त्वरण शून्य होता है।`
},

{
q:`एक कार 5 सेकंड में अपना वेग 10 m/s से बढ़ाकर 30 m/s कर लेती है। कार का त्वरण क्या है?`,
o:[
`6 m/s²`,
`10 m/s²`,
`2 m/s²`,
`4 m/s²`
],
a:3,
e:`Given: u = 10 m/s, v = 30 m/s, t = 5 s<br>Formula: a = (v − u) / t<br>Calculation: a = (30 − 10) / 5 = 4 m/s²<br>Conclusion: त्वरण = 4 m/s²`
},

{
q:`निम्नलिखित में से कौन-सा उस दर का वर्णन करता है जिस पर कोई वस्तु अपना वेग बदलती है?`,
o:[
`दूरी`,
`त्वरण`,
`विस्थापन`,
`चाल`
],
a:1,
e:`किसी वस्तु के वेग में समय के साथ परिवर्तन की दर को त्वरण कहते हैं।`
},

{
q:`किस भौतिक राशि को समय के सापेक्ष वेग में परिवर्तन की दर के रूप में परिभाषित किया गया है?`,
o:[
`त्वरण`,
`चाल`,
`विस्थापन`,
`तय की गई दूरी`
],
a:0,
e:`त्वरण की परिभाषा a = Δv / Δt है।`
},

{
q:`एक कार 3 घंटे में 150 किलोमीटर की दूरी तय करती है। कार की औसत चाल कितनी है और इस राशि के लिए सही मात्रक क्या है?`,
o:[
`0.02 किलोमीटर प्रति घंटे`,
`150 किलोमीटर प्रति घंटे`,
`50 किलोमीटर प्रति मिनट`,
`50 किलोमीटर प्रति घंटे`
],
a:3,
e:`Given: दूरी = 150 km, समय = 3 h<br>Formula: औसत चाल = दूरी / समय<br>Calculation: 150 / 3 = 50 km/h<br>Conclusion: औसत चाल = 50 km/h`
},

{
q:`एक धावक 20 सेकंड में 60 मीटर उत्तर की ओर और फिर 80 मीटर दक्षिण की ओर गति करता है। उसकी औसत चाल और औसत वेग के संदर्भ में कौन-सा कथन सही है?`,
o:[
`औसत चाल शून्य है`,
`औसत चाल, औसत वेग से कम है`,
`औसत चाल, औसत वेग से अधिक है`,
`औसत चाल, औसत वेग के बराबर है`
],
a:2,
e:`कुल दूरी = 60 + 80 = 140 m, जबकि विस्थापन का परिमाण = 20 m। इसलिए औसत चाल का परिमाण औसत वेग के परिमाण से अधिक है।`
},

{
q:`एक साइकिल चालक 20 सेकंड में 60 मीटर उत्तर और फिर 80 मीटर दक्षिण की ओर जाता है। उसके औसत वेग का परिमाण क्या है?`,
o:[
`एक मीटर प्रति सेकंड`,
`शून्य मीटर प्रति सेकंड`,
`पांच मीटर प्रति सेकंड`,
`सात मीटर प्रति सेकंड`
],
a:0,
e:`Net displacement = 80 − 60 = 20 m दक्षिण।<br>Average velocity = displacement / time = 20 / 20 = 1 m/s.`
},

{
q:`एक साइकिल चालक 30 किलोमीटर की दूरी 1.5 घंटे में तय करता है। साइकिल चालक की औसत चाल कितनी है?`,
o:[
`20 किलोमीटर प्रति घंटा`,
`15 किलोमीटर प्रति घंटा`,
`2 किलोमीटर प्रति घंटा`,
`45 किलोमीटर प्रति घंटा`
],
a:0,
e:`Average speed = Distance / Time = 30 / 1.5 = 20 km/h.`
},

{
q:`कोई कार 5 सेकंड तक 20 m/s की स्थिर चाल से चलती है। इस दौरान कार द्वारा तय की गई कुल दूरी कितनी है?`,
o:[
`100 मीटर`,
`400 मीटर`,
`4 मीटर`,
`25 मीटर`
],
a:0,
e:`Given: v = 20 m/s, t = 5 s<br>Formula: s = vt<br>Calculation: s = 20 × 5 = 100 m<br>Conclusion: दूरी = 100 मीटर।`
},

{
q:`किसी गतिमान पिंड के विस्थापन का पूर्ण वर्णन करने के लिए क्या आवश्यक है?`,
o:[
`परिमाण और दिशा दोनों`,
`केवल दिशा`,
`केवल परिमाण`,
`मूल बिंदु पर स्थिति`
],
a:0,
e:`विस्थापन एक सदिश राशि है, इसलिए इसके पूर्ण वर्णन के लिए परिमाण और दिशा दोनों आवश्यक हैं।`
},

{
q:`एक-विमीय गति में निम्नलिखित में से कौन-सी राशि कभी भी ऋणात्मक नहीं हो सकती है?`,
o:[
`विस्थापन`,
`स्थिति में परिवर्तन`,
`वेग`,
`पथ की लंबाई`
],
a:3,
e:`पथ की लंबाई एक अदिश राशि है और यह हमेशा शून्य या धनात्मक होती है।`
},

{
q:`द्वि-विमीय गति में विस्थापन सदिश क्या निरूपित करता है?`,
o:[
`वस्तु द्वारा अनुसरण किया गया पथ`,
`वस्तु की औसत चाल`,
`प्रारंभिक बिंदु से अंतिम बिंदु तक स्थिति में परिवर्तन`,
`पथ के अनुदिश तय की गई दूरी`
],
a:2,
e:`विस्थापन सदिश प्रारंभिक स्थिति से अंतिम स्थिति तक स्थिति में परिवर्तन को दर्शाता है।`
},

{
q:`निम्नलिखित में से कौन-सा कथन, किसी सरल रेखा में गति करने वाली और अपने प्रारंभिक बिंदु पर लौटने वाली वस्तु के लिए पथ की लंबाई और विस्थापन के बीच के अंतर का सर्वोत्तम वर्णन करता है?`,
o:[
`विस्थापन सदैव ऋणात्मक होता है`,
`पथ की लंबाई सदैव विस्थापन के बराबर होती है`,
`पथ की लंबाई या तो विस्थापन के बराबर या उससे अधिक होती है`,
`विस्थापन, पथ की लंबाई से अधिक होता है`
],
a:2,
e:`पथ की लंबाई हमेशा विस्थापन के परिमाण से बड़ी या उसके बराबर होती है। प्रारंभिक बिंदु पर लौटने पर विस्थापन शून्य होता है।`
},

{
q:`निम्नलिखित में से कौन-सा कथन स्थिति सदिश और विस्थापन सदिश के बीच के अंतर को सही रूप में वर्णित करता है?`,
o:[

/* =========================================================
   VARIABLES
========================================================= */

let current = 0;

let answers =
  new Array(questions.length).fill(null);

let submitted = false;

let timeLeft = 30 * 60;

let timerInterval;


/* =========================================================
   CREATE PALETTE
========================================================= */

function createPalette(){

  const grid =
    document.getElementById("paletteGrid");

  grid.innerHTML = "";

  questions.forEach((q,index)=>{

    const btn =
      document.createElement("button");

    btn.className = "pbtn";

    btn.textContent = index + 1;

    btn.onclick = function(){

      current = index;

      renderQuestion();

      closePalette();

    };

    grid.appendChild(btn);

  });

  updatePalette();

}


/* =========================================================
   UPDATE PALETTE
========================================================= */

function updatePalette(){

  const buttons =
    document.querySelectorAll(".pbtn");

  buttons.forEach((btn,index)=>{

    btn.classList.remove(
      "current",
      "answered",
      "wrong"
    );


    /* CURRENT */

    if(index === current){

      btn.classList.add("current");

    }


    /* ATTEMPTED */

    if(answers[index] !== null){

      btn.classList.add("answered");

    }


    /* WRONG AFTER SUBMIT */

    if(
      submitted &&
      answers[index] !== null &&
      answers[index] !== questions[index].a
    ){

      btn.classList.remove("answered");

      btn.classList.add("wrong");

    }

  });

}


/* =========================================================
   RENDER QUESTION
========================================================= */

function renderQuestion(){

  const q =
    questions[current];


  document.getElementById("qNumber").textContent =

    "Question " +
    (current + 1) +
    " of " +
    questions.length;


  document.getElementById("questionText").innerHTML =
    q.q;


  const optionsBox =
    document.getElementById("options");

  optionsBox.innerHTML = "";


  q.o.forEach((option,index)=>{

    const div =
      document.createElement("div");

    div.className = "option";


    if(answers[current] === index){

      div.classList.add("selected");

    }


    div.innerHTML =

      "<strong>" +

      String.fromCharCode(65 + index) +

      ".</strong> " +

      option;


    div.onclick = function(){

      if(submitted) return;

      answers[current] = index;

      renderQuestion();

      updatePalette();

    };


    optionsBox.appendChild(div);

  });


  updatePalette();


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================================================
   NEXT
========================================================= */

function nextQuestion(){

  if(current < questions.length - 1){

    current++;

    renderQuestion();

  }
  else{

    alert(
      "यह अंतिम प्रश्न है। Submit Test दबाकर परिणाम देखें।"
    );

  }

}


/* =========================================================
   PREVIOUS
========================================================= */

function previousQuestion(){

  if(current > 0){

    current--;

    renderQuestion();

  }

}


/* =========================================================
   OPEN PALETTE
========================================================= */

function openPalette(){

  document
    .getElementById("palette")
    .classList.add("open");


  document
    .getElementById("overlay")
    .classList.add("show");

}


/* =========================================================
   CLOSE PALETTE
========================================================= */

function closePalette(){

  document
    .getElementById("palette")
    .classList.remove("open");


  document
    .getElementById("overlay")
    .classList.remove("show");

}


/* =========================================================
   SUBMIT TEST
========================================================= */

function submitTest(){

  if(submitted) return;


  const unanswered =
    answers.filter(
      x => x === null
    ).length;


  if(unanswered > 0){

    const proceed =
      confirm(
        "अभी " +
        unanswered +
        " प्रश्न अनुत्तरित हैं। क्या आप टेस्ट submit करना चाहते हैं?"
      );


    if(!proceed) return;

  }


  submitted = true;


  clearInterval(timerInterval);


  let correct = 0;

  let wrong = 0;

  let unansweredCount = 0;


  answers.forEach((ans,index)=>{

    if(ans === null){

      unansweredCount++;

    }
    else if(
      ans === questions[index].a
    ){

      correct++;

    }
    else{

      wrong++;

    }

  });


  const negativeMarks =
    wrong / 3;


  const marks =
    correct - negativeMarks;


  const percentage =
    (marks / questions.length) * 100;


  /* SOLUTIONS */

  let solutionHTML = "";


  questions.forEach((q,index)=>{

    const userAnswer =
      answers[index];


    let statusText = "";

    let statusClass = "";


    if(userAnswer === null){

      statusText =
        "⚪ Unattempted";

      statusClass =
        "unattempted";

    }
    else if(
      userAnswer === q.a
    ){

      statusText =
        "✅ Correct";

      statusClass =
        "correct-result";

    }
    else{

      statusText =
        "❌ Incorrect";

      statusClass =
        "incorrect-result";

    }


    const userAnswerText =

      userAnswer === null

      ?

      "Not Attempted"

      :

      String.fromCharCode(
        65 + userAnswer
      )
      +
      ". "
      +
      q.o[userAnswer];


    const correctAnswerText =

      String.fromCharCode(
        65 + q.a
      )
      +
      ". "
      +
      q.o[q.a];


    solutionHTML += `

      <div class="solution-card">

        <div class="solution-title">

          <span>
            Q${index + 1}
          </span>

          <span class="${statusClass}">
            ${statusText}
          </span>

        </div>


        <div class="solution-question">

          ${q.q}

        </div>


        <div class="your-answer">

          <strong>Your Answer:</strong><br>

          ${userAnswerText}

        </div>


        <div class="correct-answer">

          <strong>Correct Answer:</strong><br>

          ${correctAnswerText}

        </div>


        <div class="solution-explanation">

          <strong>Explanation:</strong><br>

          ${q.e}

        </div>

      </div>

    `;

  });


  /* HIDE TEST */

  document
    .getElementById("questionCard")
    .style.display = "none";


  /* SHOW RESULT */

  const result =
    document.getElementById("result");


  result.style.display =
    "block";


  result.innerHTML = `

    <h2>
      🎯 Test Result
    </h2>


    <div class="score-box">

      <div>
        Final Score
      </div>

      <div class="score">
        ${marks.toFixed(2)}
        /
        ${questions.length}
      </div>

      <div style="margin-top:8px;">

        Percentage:
        ${percentage.toFixed(2)}%

      </div>

    </div>


    <div class="result-grid">


      <div class="result-item">

        <strong>
          कुल प्रश्न
        </strong>

        <br>

        ${questions.length}

      </div>


      <div class="result-item">

        <strong>
          Correct
        </strong>

        <br>

        ${correct}

      </div>


      <div class="result-item">

        <strong>
          Incorrect
        </strong>

        <br>

        ${wrong}

      </div>


      <div class="result-item">

        <strong>
          Unattempted
        </strong>

        <br>

        ${unansweredCount}

      </div>


      <div class="result-item">

        <strong>
          Positive Marks
        </strong>

        <br>

        +${correct.toFixed(2)}

      </div>


      <div class="result-item">

        <strong>
          Negative Marks
        </strong>

        <br>

        −${negativeMarks.toFixed(2)}

      </div>


    </div>


    <h2 style="margin-top:30px;">

      📖 Question-wise Solutions

    </h2>


    <div>

      ${solutionHTML}

    </div>


    <button
      class="restart"
      onclick="location.reload()"
    >

      🔄 Retake Test

    </button>

  `;


  updatePalette();


  closePalette();


  window.scrollTo({

    top:0,

    behavior:"smooth"

  });

}


/* =========================================================
   TIMER
========================================================= */

function updateTimer(){

  if(submitted) return;


  let minutes =
    Math.floor(timeLeft / 60);


  let seconds =
    timeLeft % 60;


  document.getElementById("timer").textContent =

    String(minutes).padStart(2,"0")

    +

    ":"

    +

    String(seconds).padStart(2,"0");


  if(timeLeft <= 0){

    clearInterval(timerInterval);


    alert(
      "⏰ समय समाप्त हो गया। आपका टेस्ट automatically submit किया जा रहा है।"
    );


    submitTest();


    return;

  }


  timeLeft--;

}


/* =========================================================
   START TEST
========================================================= */

createPalette();

renderQuestion();

updateTimer();

timerInterval =
  setInterval(
    updateTimer,
    1000
  );

</script>

</body>
</html>
